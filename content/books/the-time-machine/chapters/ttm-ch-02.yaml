id: ttm-ch-02
bookId: book-time-machine
title: Chapter 2
titleZh: 第二章
summaryZh: 时间旅行者缺席了周四的晚宴，客人们先行开席。他随后才现身，模样让在场的客人大吃一惊，还声称自己刚刚从时间旅行中归来。在狼吞虎咽地吃完晚餐后，他邀请众人进入吸烟室，准备讲述他那段令人难以置信的经历。
sections:
  - id: ttm-ch-02-s1
    text: |-
      I think that at that time none of us quite believed in the Time Machine. The fact is, the Time Traveller was one of those men who are too clever to be believed: you never felt that you saw all round him; you always suspected some subtle reserve, some ingenuity in ambush, behind his lucid frankness. Had Filby shown the model and explained the matter in the Time Traveller’s words, we should have shown him far less scepticism. For we should have perceived his motives; a pork butcher could understand Filby. But the Time Traveller had more than a touch of whim among his elements, and we distrusted him. Things that would have made the frame of a less clever man seemed tricks in his hands. It is a mistake to do things too easily. The serious people who took him seriously never felt quite sure of his deportment; they were somehow aware that trusting their reputations for judgment with him was like furnishing a nursery with eggshell china. So I don’t think any of us said very much about time travelling in the interval between that Thursday and the next, though its odd potentialities ran, no doubt, in most of our minds: its plausibility, that is, its practical incredibleness, the curious possibilities of anachronism and of utter confusion it suggested. For my own part, I was particularly preoccupied with the trick of the model. That I remember discussing with the Medical Man, whom I met on Friday at the Linnaean. He said he had seen a similar thing at Tubingen, and laid considerable stress on the blowing out of the candle. But how the trick was done he could not explain.

      The next Thursday I went again to Richmond—I suppose I was one of the Time Traveller’s most constant guests—and, arriving late, found four or five men already assembled in his drawing-room. The Medical Man was standing before the fire with a sheet of paper in one hand and his watch in the other. I looked round for the Time Traveller, and—“It’s half-past seven now,” said the Medical Man. “I suppose we’d better have dinner?”

      “Where’s—?” said I, naming our host.

      “You’ve just come? It’s rather odd. He’s unavoidably detained. He asks me in this note to lead off with dinner at seven if he’s not back. Says he’ll explain when he comes.”

      “It seems a pity to let the dinner spoil,” said the Editor of a well-known daily paper; and thereupon the Doctor rang the bell.
    checkIn:
      id: ttm-ch-02-s1-c1
      stem: Why did the guests find it hard to believe the Time Traveller?
      options:
        - He had no model to show his friends at the dinner.
        - He refused to explain how the machine worked.
        - His friends had never seen him build anything before.
        - He was too clever, and people always suspected some hidden trick behind his frankness.
      correctIndex: 3
      explanationZh: 原文说他是 "too clever to be believed"，人们总觉得他坦率的外表下藏有机关。而提到模型的人是 Filby，并非时间旅行者没有模型可展示，排除该项即可。
  - id: ttm-ch-02-s2
    text: |-
      The Psychologist was the only person besides the Doctor and myself who had attended the previous dinner. The other men were Blank, the Editor aforementioned, a certain journalist, and another—a quiet, shy man with a beard—whom I didn’t know, and who, as far as my observation went, never opened his mouth all the evening. There was some speculation at the dinner-table about the Time Traveller’s absence, and I suggested time travelling, in a half-jocular spirit. The Editor wanted that explained to him, and the Psychologist volunteered a wooden account of the “ingenious paradox and trick” we had witnessed that day week. He was in the midst of his exposition when the door from the corridor opened slowly and without noise. I was facing the door, and saw it first. “Hallo!” I said. “At last!” And the door opened wider, and the Time Traveller stood before us. I gave a cry of surprise. “Good heavens! man, what’s the matter?” cried the Medical Man, who saw him next. And the whole tableful turned towards the door.

      He was in an amazing plight. His coat was dusty and dirty, and smeared with green down the sleeves; his hair disordered, and as it seemed to me greyer—either with dust and dirt or because its colour had actually faded. His face was ghastly pale; his chin had a brown cut on it—a cut half healed; his expression was haggard and drawn, as by intense suffering. For a moment he hesitated in the doorway, as if he had been dazzled by the light. Then he came into the room. He walked with just such a limp as I have seen in footsore tramps. We stared at him in silence, expecting him to speak.

      He said not a word, but came painfully to the table, and made a motion towards the wine. The Editor filled a glass of champagne, and pushed it towards him. He drained it, and it seemed to do him good: for he looked round the table, and the ghost of his old smile flickered across his face. “What on earth have you been up to, man?” said the Doctor. The Time Traveller did not seem to hear. “Don’t let me disturb you,” he said, with a certain faltering articulation. “I’m all right.” He stopped, held out his glass for more, and took it off at a draught. “That’s good,” he said. His eyes grew brighter, and a faint colour came into his cheeks. His glance flickered over our faces with a certain dull approval, and then went round the warm and comfortable room. Then he spoke again, still as it were feeling his way among his words. “I’m going to wash and dress, and then I’ll come down and explain things … Save me some of that mutton. I’m starving for a bit of meat.”
    checkIn:
      id: ttm-ch-02-s2-c1
      stem: What did the Time Traveller do right after he entered the dining room?
      options:
        - He sat down and started eating the mutton immediately.
        - He reached for the wine and drank a glass of champagne.
        - He told the guests about his time travel adventure.
        - He went upstairs to wash and change his clothes first.
      correctIndex: 1
      explanationZh: 文中写他走到桌边，朝酒做了个动作，编辑给他倒了杯香槟，他一饮而尽。他确实说要上楼换洗，但那是在喝完酒之后才说的，所以先吃肉或先上楼都不对。
  - id: ttm-ch-02-s3
    text: |-
      He looked across at the Editor, who was a rare visitor, and hoped he was all right. The Editor began a question. “Tell you presently,” said the Time Traveller. “I’m—funny! Be all right in a minute.”

      He put down his glass, and walked towards the staircase door. Again I remarked his lameness and the soft padding sound of his footfall, and standing up in my place, I saw his feet as he went out. He had nothing on them but a pair of tattered, bloodstained socks. Then the door closed upon him. I had half a mind to follow, till I remembered how he detested any fuss about himself. For a minute, perhaps, my mind was woolgathering. Then, “Remarkable Behaviour of an Eminent Scientist,” I heard the Editor say, thinking (after his wont) in headlines. And this brought my attention back to the bright dinner-table.

      “What’s the game?” said the Journalist. “Has he been doing the Amateur Cadger? I don’t follow.” I met the eye of the Psychologist, and read my own interpretation in his face. I thought of the Time Traveller limping painfully upstairs. I don’t think anyone else had noticed his lameness.

      The first to recover completely from this surprise was the Medical Man, who rang the bell—the Time Traveller hated to have servants waiting at dinner—for a hot plate. At that the Editor turned to his knife and fork with a grunt, and the Silent Man followed suit. The dinner was resumed. Conversation was exclamatory for a little while, with gaps of wonderment; and then the Editor got fervent in his curiosity. “Does our friend eke out his modest income with a crossing? or has he his Nebuchadnezzar phases?” he inquired. “I feel assured it’s this business of the Time Machine,” I said, and took up the Psychologist’s account of our previous meeting. The new guests were frankly incredulous. The Editor raised objections. “What was this time travelling? A man couldn’t cover himself with dust by rolling in a paradox, could he?” And then, as the idea came home to him, he resorted to caricature. Hadn’t they any clothes-brushes in the Future? The Journalist too, would not believe at any price, and joined the Editor in the easy work of heaping ridicule on the whole thing. They were both the new kind of journalist—very joyous, irreverent young men. “Our Special Correspondent in the Day after Tomorrow reports,” the Journalist was saying—or rather shouting—when the Time Traveller came back. He was dressed in ordinary evening clothes, and nothing save his haggard look remained of the change that had startled me.
    checkIn:
      id: ttm-ch-02-s3-c1
      stem: What did the narrator notice about the Time Traveller's feet as he walked out?
      options:
        - He wore only tattered, bloodstained socks.
        - He had no shoes or socks on at all.
        - He wore one shoe and one sock.
        - He wore a pair of worn-out boots.
      correctIndex: 0
      explanationZh: 叙述者站起来时看到他出门时的脚，文中写 "He had nothing on them but a pair of tattered, bloodstained socks"。所以并非完全赤脚，也不是只穿了一只鞋袜。
  - id: ttm-ch-02-s4
    text: |-
      “I say,” said the Editor hilariously, “these chaps here say you have been travelling into the middle of next week! Tell us all about little Rosebery, will you? What will you take for the lot?”

      The Time Traveller came to the place reserved for him without a word. He smiled quietly, in his old way. “Where’s my mutton?” he said. “What a treat it is to stick a fork into meat again!”

      “Story!” cried the Editor.

      “Story be damned!” said the Time Traveller. “I want something to eat. I won’t say a word until I get some peptone into my arteries. Thanks. And the salt.”

      “One word,” said I. “Have you been time travelling?”

      “Yes,” said the Time Traveller, with his mouth full, nodding his head.

      “I’d give a shilling a line for a verbatim note,” said the Editor. The Time Traveller pushed his glass towards the Silent Man and rang it with his fingernail; at which the Silent Man, who had been staring at his face, started convulsively, and poured him wine. The rest of the dinner was uncomfortable. For my own part, sudden questions kept on rising to my lips, and I dare say it was the same with the others. The Journalist tried to relieve the tension by telling anecdotes of Hettie Potter. The Time Traveller devoted his attention to his dinner, and displayed the appetite of a tramp. The Medical Man smoked a cigarette, and watched the Time Traveller through his eyelashes. The Silent Man seemed even more clumsy than usual, and drank champagne with regularity and determination out of sheer nervousness. At last the Time Traveller pushed his plate away, and looked round us. “I suppose I must apologize,” he said. “I was simply starving. I’ve had a most amazing time.” He reached out his hand for a cigar, and cut the end. “But come into the smoking-room. It’s too long a story to tell over greasy plates.” And ringing the bell in passing, he led the way into the adjoining room.

      “You have told Blank, and Dash, and Chose about the machine?” he said to me, leaning back in his easy-chair and naming the three new guests.

      “But the thing’s a mere paradox,” said the Editor.

      “I can’t argue tonight. I don’t mind telling you the story, but I can’t argue. I will,” he went on, “tell you the story of what has happened to me, if you like, but you must refrain from interruptions. I want to tell it. Badly. Most of it will sound like lying. So be it! It’s true—every word of it, all the same. I was in my laboratory at four o’clock, and since then … I’ve lived eight days … such days as no human being ever lived before! I’m nearly worn out, but I shan’t sleep till I’ve told this thing over to you. Then I shall go to bed. But no interruptions! Is it agreed?”
    checkIn:
      id: ttm-ch-02-s4-c1
      stem: What did the Time Traveller demand before he would tell his story?
      options:
        - He wanted the Editor to pay him a shilling a line first.
        - He asked everyone to move to the smoking-room and smoke cigars.
        - He needed to eat first and insisted that no one interrupt him.
        - He wanted the Medical Man to examine him before talking.
      correctIndex: 2
      explanationZh: 他说 "I won't say a word until I get some peptone into my arteries"，要求先吃饭；之后到吸烟室又说 "no interruptions"。编辑提出的一先令一行的报价是他自己的主意，时间旅行者并未接受。
  - id: ttm-ch-02-s5
    text: “Agreed,” said the Editor, and the rest of us echoed “Agreed.” And with that the Time Traveller began his story as I have set it forth. He sat back in his chair at first, and spoke like a weary man. Afterwards he got more animated. In writing it down I feel with only too much keenness the inadequacy of pen and ink—and, above all, my own inadequacy—to express its quality. You read, I will suppose, attentively enough; but you cannot see the speaker’s white, sincere face in the bright circle of the little lamp, nor hear the intonation of his voice. You cannot know how his expression followed the turns of his story! Most of us hearers were in shadow, for the candles in the smoking-room had not been lighted, and only the face of the Journalist and the legs of the Silent Man from the knees downward were illuminated. At first we glanced now and again at each other. After a time we ceased to do that, and looked only at the Time Traveller’s face.
    checkIn:
      id: ttm-ch-02-s5-c1
      stem: What happened as the Time Traveller told his story in the smoking-room?
      options:
        - The listeners stopped glancing at each other and looked only at his face.
        - The listeners kept whispering questions to each other.
        - The listeners fell asleep because they were bored.
        - The listeners laughed at his ridiculous story.
      correctIndex: 0
      explanationZh: 文中说起初大家偶尔对视，但后来 "we ceased to do that, and looked only at the Time Traveller's face"。这说明大家被他的讲述吸引了，而非互相低语或发笑。
quiz:
  - id: ttm-ch-02-q1
    stem: Why did the guests decide to start dinner without the Time Traveller?
    options:
      - The Medical Man decided the food was going to spoil.
      - The Editor insisted they should not wait any longer.
      - He left a note asking them to begin at seven if he was not back.
      - The guests were too hungry to keep waiting.
    correctIndex: 2
    explanationZh: 文中医学家说时间旅行者留了便条，请他在七点未归时就先开饭。虽然编辑也说过别让晚餐坏掉，但这只是附和，真正的原因是那张便条。
  - id: ttm-ch-02-q2
    stem: What condition was the Time Traveller in when he first appeared at the dinner?
    options:
      - Dirty, pale, limping, and with a half-healed cut on his chin.
      - Clean and well-dressed but very tired and quiet.
      - Covered in snow and shivering from the cold.
      - Perfectly healthy but extremely angry and rude.
    correctIndex: 0
    explanationZh: 原文详细描写了他的样子：外套满是灰尘、脸色惨白、走路一瘸一拐、下巴上有一道半愈合的伤口。干净整洁或满身冰雪都不是文中描述的状态。
  - id: ttm-ch-02-q3
    stem: How did the new guests, especially the Editor and Journalist, react to the idea of time travel?
    options:
      - They were excited and begged to hear the full story.
      - They were openly unbelieving and mocked the whole idea.
      - They were frightened and wanted to leave the house.
      - They were silent and refused to discuss it at all.
    correctIndex: 1
    explanationZh: 新客人们 "frankly incredulous"，编辑和记者还用挖苦的方式嘲弄时间旅行的说法，比如问未来有没有衣服刷。这与他们兴奋求故事或害怕想离开的反应截然不同。
  - id: ttm-ch-02-q4
    stem: How did the Time Traveller explain why he needed to eat before telling his story?
    options:
      - He said he was simply starving and needed food in his arteries.
      - He said the story was too short to bother telling before dinner.
      - He said the Medical Man had told him never to talk on an empty stomach.
      - He said he had already eaten but wanted to buy time.
    correctIndex: 0
    explanationZh: 他直言 "I was simply starving"，又说要在把营养送进血管之前一个字都不说。他确实是饥饿难耐，而非借口拖延或受医嘱。
  - id: ttm-ch-02-q5
    stem: What did the Time Traveller ask his listeners to agree to before he began his story?
    options:
      - No questions until the next morning.
      - No one was allowed to write anything down.
      - Everyone had to promise to believe his story.
      - No interruptions while he spoke.
    correctIndex: 3
    explanationZh: 他在吸烟室里明确要求 "no interruptions"，众人齐声应允。他没有要求等到次日再提问，也没有要求禁止记录或必须事先相信他的故事。
  - id: ttm-ch-02-q6
    stem: Where did the Time Traveller say he had been since four o'clock that day?
    options:
      - He had been lost in the woods for eight hours.
      - He had been working in his laboratory all day.
      - He had visited a foreign country for a week.
      - He had lived eight days in that time.
    correctIndex: 3
    explanationZh: 他说自己四点钟在实验室，之后 "I've lived eight days"。这是时间旅行造成的奇特经历，不是迷路、在实验室待了一天，也不是出国旅行了一周。

id: ttm-ch-03
bookId: book-time-machine
title: Chapter 3
titleZh: 第三章
summaryZh: 时间旅行者向客人们描述了他首次驾驶时间机器的经历：从实验室出发，一路飞速穿越漫长的岁月，最终在遥远未来的一处花园中狼狈停下。等待他的，是一场突如其来的冰雹，和一个完全陌生的世界。
sections:
  - id: ttm-ch-03-s1
    text: |-
      “I told some of you last Thursday of the principles of the Time Machine, and showed you the actual thing itself, incomplete in the workshop. There it is now, a little travel-worn, truly; and one of the ivory bars is cracked, and a brass rail bent; but the rest of it’s sound enough. I expected to finish it on Friday, but on Friday, when the putting together was nearly done, I found that one of the nickel bars was exactly one inch too short, and this I had to get remade; so that the thing was not complete until this morning. It was at ten o’clock today that the first of all Time Machines began its career. I gave it a last tap, tried all the screws again, put one more drop of oil on the quartz rod, and sat myself in the saddle. I suppose a suicide who holds a pistol to his skull feels much the same wonder at what will come next as I felt then. I took the starting lever in one hand and the stopping one in the other, pressed the first, and almost immediately the second. I seemed to reel; I felt a nightmare sensation of falling; and, looking round, I saw the laboratory exactly as before. Had anything happened? For a moment I suspected that my intellect had tricked me. Then I noted the clock. A moment before, as it seemed, it had stood at a minute or so past ten; now it was nearly half-past three!

      “I drew a breath, set my teeth, gripped the starting lever with both hands, and went off with a thud. The laboratory got hazy and went dark. Mrs. Watchett came in and walked, apparently without seeing me, towards the garden door. I suppose it took her a minute or so to traverse the place, but to me she seemed to shoot across the room like a rocket. I pressed the lever over to its extreme position. The night came like the turning out of a lamp, and in another moment came tomorrow. The laboratory grew faint and hazy, then fainter and ever fainter. Tomorrow night came black, then day again, night again, day again, faster and faster still. An eddying murmur filled my ears, and a strange, dumb confusedness descended on my mind.

      “I am afraid I cannot convey the peculiar sensations of time travelling. They are excessively unpleasant. There is a feeling exactly like that one has upon a switchback—of a helpless headlong motion! I felt the same horrible anticipation, too, of an imminent smash. As I put on pace, night followed day like the flapping of a black wing. The dim suggestion of the laboratory seemed presently to fall away from me, and I saw the sun hopping swiftly across the sky, leaping it every minute, and every minute marking a day. I supposed the laboratory had been destroyed and I had come into the open air. I had a dim impression of scaffolding, but I was already going too fast to be conscious of any moving things. The slowest snail that ever crawled dashed by too fast for me. The twinkling succession of darkness and light was excessively painful to the eye. Then, in the intermittent darknesses, I saw the moon spinning swiftly through her quarters from new to full, and had a faint glimpse of the circling stars. Presently, as I went on, still gaining velocity, the palpitation of night and day merged into one continuous greyness; the sky took on a wonderful deepness of blue, a splendid luminous color like that of early twilight; the jerking sun became a streak of fire, a brilliant arch, in space; the moon a fainter fluctuating band; and I could see nothing of the stars, save now and then a brighter circle flickering in the blue.
    checkIn:
      id: ttm-ch-03-s1-c1
      stem: How did the Time Traveller confirm that the machine had worked after his very first, brief test?
      options:
        - Mrs. Watchett spoke to him and told him the time
        - The nickel bar glowed with a strange light
        - The laboratory clock had jumped ahead by hours
        - The machine had moved to a different room
      correctIndex: 2
      explanationZh: 他说自己按下了启动杆又立刻按停止杆，怀疑什么也没发生，然后“注意到了时钟”：从“past ten”跳到了“nearly half-past three”，说明时间确实在推移。关于 Mrs. Watchett 的选项有迷惑性，但她只是后来穿越中看到的人影，并没有和他说话。
  - id: ttm-ch-03-s2
    text: |-
      “The landscape was misty and vague. I was still on the hillside upon which this house now stands, and the shoulder rose above me grey and dim. I saw trees growing and changing like puffs of vapour, now brown, now green; they grew, spread, shivered, and passed away. I saw huge buildings rise up faint and fair, and pass like dreams. The whole surface of the earth seemed changed—melting and flowing under my eyes. The little hands upon the dials that registered my speed raced round faster and faster. Presently I noted that the sun belt swayed up and down, from solstice to solstice, in a minute or less, and that consequently my pace was over a year a minute; and minute by minute the white snow flashed across the world, and vanished, and was followed by the bright, brief green of spring.

      “The unpleasant sensations of the start were less poignant now. They merged at last into a kind of hysterical exhilaration. I remarked indeed a clumsy swaying of the machine, for which I was unable to account. But my mind was too confused to attend to it, so with a kind of madness growing upon me, I flung myself into futurity. At first I scarce thought of stopping, scarce thought of anything but these new sensations. But presently a fresh series of impressions grew up in my mind—a certain curiosity and therewith a certain dread—until at last they took complete possession of me. What strange developments of humanity, what wonderful advances upon our rudimentary civilization, I thought, might not appear when I came to look nearly into the dim elusive world that raced and fluctuated before my eyes! I saw great and splendid architecture rising about me, more massive than any buildings of our own time, and yet, as it seemed, built of glimmer and mist. I saw a richer green flow up the hillside, and remain there, without any wintry intermission. Even through the veil of my confusion the earth seemed very fair. And so my mind came round to the business of stopping.

      “The peculiar risk lay in the possibility of my finding some substance in the space which I, or the machine, occupied. So long as I travelled at a high velocity through time, this scarcely mattered; I was, so to speak, attenuated—was slipping like a vapour through the interstices of intervening substances! But to come to a stop involved the jamming of myself, molecule by molecule, into whatever lay in my way; meant bringing my atoms into such intimate contact with those of the obstacle that a profound chemical reaction—possibly a far-reaching explosion—would result, and blow myself and my apparatus out of all possible dimensions—into the Unknown. This possibility had occurred to me again and again while I was making the machine; but then I had cheerfully accepted it as an unavoidable risk—one of the risks a man has got to take! Now the risk was inevitable, I no longer saw it in the same cheerful light. The fact is that, insensibly, the absolute strangeness of everything, the sickly jarring and swaying of the machine, above all, the feeling of prolonged falling, had absolutely upset my nerve. I told myself that I could never stop, and with a gust of petulance I resolved to stop forthwith. Like an impatient fool, I lugged over the lever, and incontinently the thing went reeling over, and I was flung headlong through the air.
    checkIn:
      id: ttm-ch-03-s2-c1
      stem: What made stopping the machine especially dangerous?
      options:
        - The machine was already cracked and might fall apart at high speed
        - Stopping would cut off his air supply and suffocate him
        - He had no braking lever and could only slow down very gradually
        - His atoms might jam into matter and cause an explosion
      correctIndex: 3
      explanationZh: 原文解释，高速穿越时他像蒸气一样从物体缝隙间滑过，但停下来意味着“molecule by molecule”地挤入障碍物，可能引发剧烈的化学反应甚至爆炸。关于机器损坏的选项听起来合理，但原文真正强调的危险是空间被占的问题。
  - id: ttm-ch-03-s3
    text: |-
      “There was the sound of a clap of thunder in my ears. I may have been stunned for a moment. A pitiless hail was hissing round me, and I was sitting on soft turf in front of the overset machine. Everything still seemed grey, but presently I remarked that the confusion in my ears was gone. I looked round me. I was on what seemed to be a little lawn in a garden, surrounded by rhododendron bushes, and I noticed that their mauve and purple blossoms were dropping in a shower under the beating of the hailstones. The rebounding, dancing hail hung in a cloud over the machine, and drove along the ground like smoke. In a moment I was wet to the skin. ‘Fine hospitality,’ said I, ‘to a man who has travelled innumerable years to see you.’

      “Presently I thought what a fool I was to get wet. I stood up and looked round me. A colossal figure, carved apparently in some white stone, loomed indistinctly beyond the rhododendrons through the hazy downpour. But all else of the world was invisible.

      “My sensations would be hard to describe. As the columns of hail grew thinner, I saw the white figure more distinctly. It was very large, for a silver birch-tree touched its shoulder. It was of white marble, in shape something like a winged sphinx, but the wings, instead of being carried vertically at the sides, were spread so that it seemed to hover. The pedestal, it appeared to me, was of bronze, and was thick with verdigris. It chanced that the face was towards me; the sightless eyes seemed to watch me; there was the faint shadow of a smile on the lips. It was greatly weatherworn, and that imparted an unpleasant suggestion of disease. I stood looking at it for a little space—half a minute, perhaps, or half an hour. It seemed to advance and to recede as the hail drove before it denser or thinner. At last I tore my eyes from it for a moment and saw that the hail curtain had worn threadbare, and that the sky was lightening with the promise of the sun.

      “I looked up again at the crouching white shape, and the full temerity of my voyage came suddenly upon me. What might appear when that hazy curtain was altogether withdrawn? What might not have happened to men? What if cruelty had grown into a common passion? What if in this interval the race had lost its manliness and had developed into something inhuman, unsympathetic, and overwhelmingly powerful? I might seem some old-world savage animal, only the more dreadful and disgusting for our common likeness—a foul creature to be incontinently slain.
    checkIn:
      id: ttm-ch-03-s3-c1
      stem: What large object does the Time Traveller see through the hail beyond the rhododendron bushes?
      options:
        - A white marble figure shaped like a winged sphinx on a bronze pedestal.
        - A colossal stone statue of a man holding a sword.
        - A white marble fountain with angels carved on its sides.
        - A great bronze gate covered with green verdigris.
      correctIndex: 0
      explanationZh: 原文说那是一座白色大理石雕像，“shape something like a winged sphinx”，底座是青铜的，布满铜绿（verdigris）。关于青铜门的选项利用了文中提到的 verdigris，但那是底座的特征，而非独立物体。
  - id: ttm-ch-03-s4
    text: |-
      “Already I saw other vast shapes—huge buildings with intricate parapets and tall columns, with a wooded hillside dimly creeping in upon me through the lessening storm. I was seized with a panic fear. I turned frantically to the Time Machine, and strove hard to readjust it. As I did so the shafts of the sun smote through the thunderstorm. The grey downpour was swept aside and vanished like the trailing garments of a ghost. Above me, in the intense blue of the summer sky, some faint brown shreds of cloud whirled into nothingness. The great buildings about me stood out clear and distinct, shining with the wet of the thunderstorm, and picked out in white by the unmelted hailstones piled along their courses. I felt naked in a strange world. I felt as perhaps a bird may feel in the clear air, knowing the hawk wings above and will swoop. My fear grew to frenzy. I took a breathing space, set my teeth, and again grappled fiercely, wrist and knee, with the machine. It gave under my desperate onset and turned over. It struck my chin violently. One hand on the saddle, the other on the lever, I stood panting heavily in attitude to mount again.

      “But with this recovery of a prompt retreat my courage recovered. I looked more curiously and less fearfully at this world of the remote future. In a circular opening, high up in the wall of the nearer house, I saw a group of figures clad in rich soft robes. They had seen me, and their faces were directed towards me.

      “Then I heard voices approaching me. Coming through the bushes by the White Sphinx were the heads and shoulders of men running. One of these emerged in a pathway leading straight to the little lawn upon which I stood with my machine. He was a slight creature—perhaps four feet high—clad in a purple tunic, girdled at the waist with a leather belt. Sandals or buskins—I could not clearly distinguish which—were on his feet; his legs were bare to the knees, and his head was bare. Noticing that, I noticed for the first time how warm the air was.

      “He struck me as being a very beautiful and graceful creature, but indescribably frail. His flushed face reminded me of the more beautiful kind of consumptive—that hectic beauty of which we used to hear so much. At the sight of him I suddenly regained confidence. I took my hands from the machine.
    checkIn:
      id: ttm-ch-03-s4-c1
      stem: What is the first living person from the future that the Time Traveller sees up close?
      options:
        - A tall, armoured soldier carrying a spear
        - A frail little figure in a purple tunic
        - A white-robed figure standing on the sphinx's pedestal
        - A child in ragged clothes with no shoes at all
      correctIndex: 1
      explanationZh: 原文描写此人“perhaps four feet high”，穿紫色长袍，腰间系着皮带。关于白袍人物的选项有迷惑性，因为之前在建筑高处确实看到了穿袍子的人群，但走近他身边的是这个穿紫色长袍的小个子。
quiz:
  - id: ttm-ch-03-q1
    stem: What delayed the completion of the Time Machine until the morning of the journey?
    options:
      - A brass rail was bent and needed to be straightened before use.
      - One of the nickel bars was exactly one inch too short and had to be remade.
      - The quartz rod cracked and had to be replaced entirely.
      - The saddle was unstable and required extra screws.
    correctIndex: 1
    explanationZh: 原文说周五快装好时发现“one of the nickel bars was exactly one inch too short”，只好重做，直到今早才完工。关于黄铜杆弯曲的选项有迷惑性，文中确实提到了“a brass rail bent”，但那是后来的磨损，不是导致延迟的原因。
  - id: ttm-ch-03-q2
    stem: When the Time Traveller accelerated through time, how did the alternating day and night eventually appear to his eyes?
    options:
      - They stayed as a rapid flicker of black and white that never blended.
      - They turned into a deep red glow with no visible sun at all.
      - They became a solid sheet of unbroken darkness.
      - They merged into a continuous greyness, and the sun became a brilliant arch of fire.
    correctIndex: 3
    explanationZh: 随着速度加快，“night and day merged into one continuous greyness”，太阳变成“a streak of fire, a brilliant arch”。关于黑白持续闪烁的选项有迷惑性，但那是早期较慢时的感受，最终日夜确实融为一片灰。
  - id: ttm-ch-03-q3
    stem: Why did the Time Traveller describe his first stop as reckless and foolish?
    options:
      - He yanked the lever in a sudden fit of impatience instead of stopping carefully.
      - He forgot to bring the stopping lever with him on the journey.
      - He had never tested the stopping mechanism before leaving.
      - He tried to stop the machine while still travelling at maximum speed.
    correctIndex: 0
    explanationZh: 原文说恐惧让他变得烦躁，于是“Like an impatient fool, I lugged over the lever”，结果机器翻倒，他被抛了出去。关于忘记停止杆的选项有迷惑性，但他一直手握启动杆和停止杆，问题在于他太粗暴地扳动了。
  - id: ttm-ch-03-q4
    stem: After the thunderstorm and hail began to clear, what worry seized the Time Traveller about the future inhabitants?
    options:
      - He worried they might have forgotten how to speak any language
      - He feared they might have evolved into giant insects
      - He feared men had grown inhuman, cruel, and mighty
      - He worried they might worship him as a god and refuse to let him leave
    correctIndex: 2
    explanationZh: 他看着白色斯芬克斯，心中涌起恐惧：“What if cruelty had grown into a common passion?”，担心人类已变成“inhuman, unsympathetic, and overwhelmingly powerful”。关于语言退化的选项虽然有一定合理性，但原文明确聚焦于残忍和非人化。
  - id: ttm-ch-03-q5
    stem: When the small future person appeared, why did the Time Traveller suddenly regain his confidence?
    options:
      - The being looked so frail and delicate that it seemed to pose no threat.
      - The person spoke to him in perfect English and welcomed him warmly.
      - The person was armed only with a wooden staff, which looked harmless.
      - The person bowed low and offered him food and drink.
    correctIndex: 0
    explanationZh: 他形容这个未来人为“indescribably frail”，脸上有“hectic beauty”般的病态美，看到他后“suddenly regained confidence”。关于英语欢迎的选项有迷惑性，但当时对方只是跑过来，并没有说话。

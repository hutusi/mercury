id: ttm-ch-11
bookId: book-time-machine
title: Chapter 11
titleZh: 第十一章
summaryZh: 下一段旅程把时间旅行者带到了难以想象的遥远未来。他在一片荒凉的海滩上停下机器，那里的天空、海洋和“居民”都与他熟悉的世界彻底两样——地球暮年的图景正在他眼前徐徐展开。
sections:
  - id: ttm-ch-11-s1
    text: |-
      “I have already told you of the sickness and confusion that comes with time travelling. And this time I was not seated properly in the saddle, but sideways and in an unstable fashion. For an indefinite time I clung to the machine as it swayed and vibrated, quite unheeding how I went, and when I brought myself to look at the dials again I was amazed to find where I had arrived. One dial records days, and another thousands of days, another millions of days, and another thousands of millions. Now, instead of reversing the levers, I had pulled them over so as to go forward with them, and when I came to look at these indicators I found that the thousands hand was sweeping round as fast as the seconds hand of a watch—into futurity.

      “As I drove on, a peculiar change crept over the appearance of things. The palpitating greyness grew darker; then—though I was still travelling with prodigious velocity—the blinking succession of day and night, which was usually indicative of a slower pace, returned, and grew more and more marked. This puzzled me very much at first. The alternations of night and day grew slower and slower, and so did the passage of the sun across the sky, until they seemed to stretch through centuries. At last a steady twilight brooded over the earth, a twilight only broken now and then when a comet glared across the darkling sky. The band of light that had indicated the sun had long since disappeared; for the sun had ceased to set—it simply rose and fell in the west, and grew ever broader and more red. All trace of the moon had vanished. The circling of the stars, growing slower and slower, had given place to creeping points of light. At last, some time before I stopped, the sun, red and very large, halted motionless upon the horizon, a vast dome glowing with a dull heat, and now and then suffering a momentary extinction. At one time it had for a little while glowed more brilliantly again, but it speedily reverted to its sullen red heat. I perceived by this slowing down of its rising and setting that the work of the tidal drag was done. The earth had come to rest with one face to the sun, even as in our own time the moon faces the earth. Very cautiously, for I remembered my former headlong fall, I began to reverse my motion. Slower and slower went the circling hands until the thousands one seemed motionless and the daily one was no longer a mere mist upon its scale. Still slower, until the dim outlines of a desolate beach grew visible.
    checkIn:
      id: ttm-ch-11-s1-c1
      stem: When the Time Traveller checks the dials, what does he discover about his direction of travel?
      options:
        - He has returned to his own time by mistake.
        - He has accidentally flown into the far future
        - He is travelling backward into the deep past.
        - He has stopped in the age of the Eloi.
      correctIndex: 1
      explanationZh: 文中说“instead of reversing the levers, I had pulled them over so as to go forward”，他发现自己意外地向前飞入了遥远的未来。提到“returned to his own time”是反向操作的结果，与他实际做的相反。
  - id: ttm-ch-11-s2
    text: |-
      “I stopped very gently and sat upon the Time Machine, looking round. The sky was no longer blue. Northeastward it was inky black, and out of the blackness shone brightly and steadily the pale white stars. Overhead it was a deep Indian red and starless, and southeastward it grew brighter to a glowing scarlet where, cut by the horizon, lay the huge hull of the sun, red and motionless. The rocks about me were of a harsh reddish colour, and all the trace of life that I could see at first was the intensely green vegetation that covered every projecting point on their southeastern face. It was the same rich green that one sees on forest moss or on the lichen in caves: plants which like these grow in a perpetual twilight.

      “The machine was standing on a sloping beach. The sea stretched away to the southwest, to rise into a sharp bright horizon against the wan sky. There were no breakers and no waves, for not a breath of wind was stirring. Only a slight oily swell rose and fell like a gentle breathing, and showed that the eternal sea was still moving and living. And along the margin where the water sometimes broke was a thick incrustation of salt—pink under the lurid sky. There was a sense of oppression in my head, and I noticed that I was breathing very fast. The sensation reminded me of my only experience of mountaineering, and from that I judged the air to be more rarefied than it is now.

      “Far away up the desolate slope I heard a harsh scream, and saw a thing like a huge white butterfly go slanting and fluttering up into the sky and, circling, disappear over some low hillocks beyond. The sound of its voice was so dismal that I shivered and seated myself more firmly upon the machine. Looking round me again, I saw that, quite near, what I had taken to be a reddish mass of rock was moving slowly towards me. Then I saw the thing was really a monstrous crablike creature. Can you imagine a crab as large as yonder table, with its many legs moving slowly and uncertainly, its big claws swaying, its long antennae, like carters’ whips, waving and feeling, and its stalked eyes gleaming at you on either side of its metallic front? Its back was corrugated and ornamented with ungainly bosses, and a greenish incrustation blotched it here and there. I could see the many palps of its complicated mouth flickering and feeling as it moved.
    checkIn:
      id: ttm-ch-11-s2-c1
      stem: What does the Time Traveller first see moving slowly toward him on the beach?
      options:
        - A huge white butterfly.
        - A swarm of small insects.
        - A group of Eloi people.
        - A giant crab-like creature.
      correctIndex: 3
      explanationZh: 他先看到一个 reddish mass of rock 在移动，仔细一看是“a monstrous crablike creature”。那个像 huge white butterfly 的东西是飞上天空消失的另一个生物，不是在海滩上向他爬来的东西。
  - id: ttm-ch-11-s3
    text: |-
      “As I stared at this sinister apparition crawling towards me, I felt a tickling on my cheek as though a fly had lighted there. I tried to brush it away with my hand, but in a moment it returned, and almost immediately came another by my ear. I struck at this, and caught something threadlike. It was drawn swiftly out of my hand. With a frightful qualm, I turned, and I saw that I had grasped the antenna of another monster crab that stood just behind me. Its evil eyes were wriggling on their stalks, its mouth was all alive with appetite, and its vast ungainly claws, smeared with an algal slime, were descending upon me. In a moment my hand was on the lever, and I had placed a month between myself and these monsters. But I was still on the same beach, and I saw them distinctly now as soon as I stopped. Dozens of them seemed to be crawling here and there, in the sombre light, among the foliated sheets of intense green.

      “I cannot convey the sense of abominable desolation that hung over the world. The red eastern sky, the northward blackness, the salt Dead Sea, the stony beach crawling with these foul, slow-stirring monsters, the uniform poisonous-looking green of the lichenous plants, the thin air that hurts one’s lungs: all contributed to an appalling effect. I moved on a hundred years, and there was the same red sun—a little larger, a little duller—the same dying sea, the same chill air, and the same crowd of earthy crustacea creeping in and out among the green weed and the red rocks. And in the westward sky, I saw a curved pale line like a vast new moon.

      “So I travelled, stopping ever and again, in great strides of a thousand years or more, drawn on by the mystery of the earth’s fate, watching with a strange fascination the sun grow larger and duller in the westward sky, and the life of the old earth ebb away. At last, more than thirty million years hence, the huge red-hot dome of the sun had come to obscure nearly a tenth part of the darkling heavens. Then I stopped once more, for the crawling multitude of crabs had disappeared, and the red beach, save for its livid green liverworts and lichens, seemed lifeless. And now it was flecked with white. A bitter cold assailed me. Rare white flakes ever and again came eddying down. To the northeastward, the glare of snow lay under the starlight of the sable sky and I could see an undulating crest of hillocks pinkish white. There were fringes of ice along the sea margin, with drifting masses further out; but the main expanse of that salt ocean, all bloody under the eternal sunset, was still unfrozen.
    checkIn:
      id: ttm-ch-11-s3-c1
      stem: As the Time Traveller keeps moving forward in great strides, what eventually happens to the giant crabs?
      options:
        - They grow larger and more numerous.
        - They change colour to blend with the snow.
        - They disappear entirely.
        - They learn to fly away from the cold.
      correctIndex: 2
      explanationZh: 文中说“the crawling multitude of crabs had disappeared”，说明这些蟹类怪物最终完全消失了。它们不是变得更多或学会飞行，而是生命正在消亡。
  - id: ttm-ch-11-s4
    text: |-
      “I looked about me to see if any traces of animal life remained. A certain indefinable apprehension still kept me in the saddle of the machine. But I saw nothing moving, in earth or sky or sea. The green slime on the rocks alone testified that life was not extinct. A shallow sandbank had appeared in the sea and the water had receded from the beach. I fancied I saw some black object flopping about upon this bank, but it became motionless as I looked at it, and I judged that my eye had been deceived, and that the black object was merely a rock. The stars in the sky were intensely bright and seemed to me to twinkle very little.

      “Suddenly I noticed that the circular westward outline of the sun had changed; that a concavity, a bay, had appeared in the curve. I saw this grow larger. For a minute perhaps I stared aghast at this blackness that was creeping over the day, and then I realized that an eclipse was beginning. Either the moon or the planet Mercury was passing across the sun’s disk. Naturally, at first I took it to be the moon, but there is much to incline me to believe that what I really saw was the transit of an inner planet passing very near to the earth.

      “The darkness grew apace; a cold wind began to blow in freshening gusts from the east, and the showering white flakes in the air increased in number. From the edge of the sea came a ripple and whisper. Beyond these lifeless sounds the world was silent. Silent? It would be hard to convey the stillness of it. All the sounds of man, the bleating of sheep, the cries of birds, the hum of insects, the stir that makes the background of our lives—all that was over. As the darkness thickened, the eddying flakes grew more abundant, dancing before my eyes; and the cold of the air more intense. At last, one by one, swiftly, one after the other, the white peaks of the distant hills vanished into blackness. The breeze rose to a moaning wind. I saw the black central shadow of the eclipse sweeping towards me. In another moment the pale stars alone were visible. All else was rayless obscurity. The sky was absolutely black.

      “A horror of this great darkness came on me. The cold, that smote to my marrow, and the pain I felt in breathing, overcame me. I shivered, and a deadly nausea seized me. Then like a red-hot bow in the sky appeared the edge of the sun. I got off the machine to recover myself. I felt giddy and incapable of facing the return journey. As I stood sick and confused I saw again the moving thing upon the shoal—there was no mistake now that it was a moving thing—against the red water of the sea. It was a round thing, the size of a football perhaps, or, it may be, bigger, and tentacles trailed down from it; it seemed black against the weltering bloodred water, and it was hopping fitfully about. Then I felt I was fainting. But a terrible dread of lying helpless in that remote and awful twilight sustained me while I clambered upon the saddle.
    checkIn:
      id: ttm-ch-11-s4-c1
      stem: What causes the darkness that begins to spread across the sun?
      options:
        - An eclipse, likely caused by an inner planet passing near Earth.
        - A thick storm cloud blocking the sky.
        - The sun itself dying and going out.
        - A mountain casting a shadow over the beach.
      correctIndex: 0
      explanationZh: 他看到太阳边缘出现一个凹陷，意识到“an eclipse was beginning”，并倾向于认为这是一颗内行星经过地球附近。云层遮住太阳或太阳熄灭都不是他观察到的现象。
quiz:
  - id: ttm-ch-11-q1
    stem: Why does the sun appear as a large, red, motionless dome on the horizon?
    options:
      - The sun has expanded and moved closer to the Earth.
      - The Time Traveller's machine distorts his view of the sky.
      - A comet has knocked the Earth closer to the sun.
      - The Earth has stopped rotating, with one face always toward the sun.
    correctIndex: 3
    explanationZh: 文中说太阳停滞在地平线上，是因为“the work of the tidal drag was done. The earth had come to rest with one face to the sun”，就像月亮总以同一面朝向地球一样。这并非因为太阳膨胀或机器扭曲了视野。
  - id: ttm-ch-11-q2
    stem: How does the Time Traveller escape the monster crab that tries to grab him from behind?
    options:
      - He kills it by pushing it into the sea.
      - He runs away down the beach on foot.
      - He pulls the lever and jumps a month into the future.
      - He hides among the green rocks until it leaves.
    correctIndex: 2
    explanationZh: 当怪物蟹的爪子向他落下时，他“In a moment my hand was on the lever, and I had placed a month between myself and these monsters”。他通过时间跳跃一个月来逃脱，而非搏斗或逃跑。
  - id: ttm-ch-11-q3
    stem: What effect does the thin air have on the Time Traveller when he stops in the far future?
    options:
      - He feels energetic and unusually strong.
      - He feels oppressed and breathes fast
      - He falls asleep for a long time.
      - He loses his eyesight for a while.
    correctIndex: 1
    explanationZh: 他说头部有压迫感，呼吸急促，并“reminded me of my only experience of mountaineering”，由此判断空气比现在稀薄。空气稀薄不会让人精力充沛或沉睡。
  - id: ttm-ch-11-q4
    stem: What does the Time Traveller see on the shallow sandbank after the eclipse ends?
    options:
      - A white bird with broken wings trying to fly.
      - A small boat drifting toward the shore.
      - A human figure waving at him.
      - A hopping black thing with trailing tentacles
    correctIndex: 3
    explanationZh: 日食结束后他再次看到浅滩上的移动物体：“a round thing, the size of a football perhaps... and tentacles trailed down from it... it was hopping fitfully about”。那不是鸟或船，而是一个带触手的黑色球状生物。
  - id: ttm-ch-11-q5
    stem: Why does the Time Traveller finally decide to get back on the machine after nearly fainting?
    options:
      - He is terrified of lying helpless in that desolate twilight.
      - He wants to chase the black creature on the sandbank.
      - He hears the Eloi calling for help in the distance.
      - He hopes to find fresh water further along the beach.
    correctIndex: 0
    explanationZh: 他在快要晕倒时，“a terrible dread of lying helpless in that remote and awful twilight sustained me”，于是爬回鞍座。他并非为了追逐生物或寻找水源，而是出于对在荒凉暮色中无助倒下的恐惧。
  - id: ttm-ch-11-q6
    stem: What signs tell the Time Traveller that almost all life on Earth has ended?
    options:
      - The entire ocean has frozen solid into ice.
      - All the green plants have turned to red dust.
      - Nothing moved; only green slime remained
      - The beach is crowded with tiny white insects.
    correctIndex: 2
    explanationZh: 他环顾四周，在天空、大地和海洋中都没有看到任何移动的东西，“The green slime on the rocks alone testified that life was not extinct”。岩上的绿色黏液是生命仅存的痕迹，海洋并未完全冻结。

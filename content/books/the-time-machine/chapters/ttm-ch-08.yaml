# yaml-language-server: $schema=../../../.schemas/book-chapter.schema.json
id: ttm-ch-08
bookId: book-time-machine
title: Chapter 8
titleZh: 第八章
summaryZh: 时间旅行者带着威娜来到了废墟般的绿瓷宫——一座未来的博物馆。他在这里探索了化石、矿物、机械和图书馆的遗迹，并找到了几件关键的防身之物。随着夜幕降临，他开始为迎接黑夜、夺回时间机做准备。
sections:
  - id: ttm-ch-08-s1
    text: |-
      “I found the Palace of Green Porcelain, when we approached it about noon, deserted and falling into ruin. Only ragged vestiges of glass remained in its windows, and great sheets of the green facing had fallen away from the corroded metallic framework. It lay very high upon a turfy down, and looking northeastward before I entered it, I was surprised to see a large estuary, or even creek, where I judged Wandsworth and Battersea must once have been. I thought then—though I never followed up the thought—of what might have happened, or might be happening, to the living things in the sea.

      “The material of the Palace proved on examination to be indeed porcelain, and along the face of it I saw an inscription in some unknown character. I thought, rather foolishly, that Weena might help me to interpret this, but I only learned that the bare idea of writing had never entered her head. She always seemed to me, I fancy, more human than she was, perhaps because her affection was so human.

      “Within the big valves of the door—which were open and broken—we found, instead of the customary hall, a long gallery lit by many side windows. At the first glance I was reminded of a museum. The tiled floor was thick with dust, and a remarkable array of miscellaneous objects was shrouded in the same grey covering. Then I perceived, standing strange and gaunt in the centre of the hall, what was clearly the lower part of a huge skeleton. I recognized by the oblique feet that it was some extinct creature after the fashion of the Megatherium. The skull and the upper bones lay beside it in the thick dust, and in one place, where rainwater had dropped through a leak in the roof, the thing itself had been worn away. Further in the gallery was the huge skeleton barrel of a Brontosaurus. My museum hypothesis was confirmed. Going towards the side I found what appeared to be sloping shelves, and clearing away the thick dust, I found the old familiar glass cases of our own time. But they must have been airtight to judge from the fair preservation of some of their contents.

      “Clearly we stood among the ruins of some latter-day South Kensington! Here, apparently, was the Palaeontological Section, and a very splendid array of fossils it must have been, though the inevitable process of decay that had been staved off for a time, and had, through the extinction of bacteria and fungi, lost ninety-nine hundredths of its force, was nevertheless, with extreme sureness if with extreme slowness at work again upon all its treasures. Here and there I found traces of the little people in the shape of rare fossils broken to pieces or threaded in strings upon reeds. And the cases had in some instances been bodily removed—by the Morlocks as I judged. The place was very silent. The thick dust deadened our footsteps. Weena, who had been rolling a sea urchin down the sloping glass of a case, presently came, as I stared about me, and very quietly took my hand and stood beside me.
    checkIn:
      id: ttm-ch-08-s1-c1
      stem: What does the Palace of Green Porcelain turn out to be?
      options:
        - A royal palace where the Morlocks now live.
        - A factory that makes green porcelain.
        - A temple built by the little people.
        - The ruins of a museum from a past intellectual age.
      correctIndex: 3
      explanationZh: 文中说“I was reminded of a museum”，并由此推断此地是未来的“South Kensington”遗址。它并不是工厂或住所，而是一座古老的博物馆。
  - id: ttm-ch-08-s2
    text: |-
      “And at first I was so much surprised by this ancient monument of an intellectual age, that I gave no thought to the possibilities it presented. Even my preoccupation about the Time Machine receded a little from my mind.

      “To judge from the size of the place, this Palace of Green Porcelain had a great deal more in it than a Gallery of Palaeontology; possibly historical galleries; it might be, even a library! To me, at least in my present circumstances, these would be vastly more interesting than this spectacle of oldtime geology in decay. Exploring, I found another short gallery running transversely to the first. This appeared to be devoted to minerals, and the sight of a block of sulphur set my mind running on gunpowder. But I could find no saltpeter; indeed, no nitrates of any kind. Doubtless they had deliquesced ages ago. Yet the sulphur hung in my mind, and set up a train of thinking. As for the rest of the contents of that gallery, though on the whole they were the best preserved of all I saw, I had little interest. I am no specialist in mineralogy, and I went on down a very ruinous aisle running parallel to the first hall I had entered. Apparently this section had been devoted to natural history, but everything had long since passed out of recognition. A few shrivelled and blackened vestiges of what had once been stuffed animals, desiccated mummies in jars that had once held spirit, a brown dust of departed plants: that was all! I was sorry for that, because I should have been glad to trace the patent readjustments by which the conquest of animated nature had been attained. Then we came to a gallery of simply colossal proportions, but singularly ill-lit, the floor of it running downward at a slight angle from the end at which I entered. At intervals white globes hung from the ceiling—many of them cracked and smashed—which suggested that originally the place had been artificially lit. Here I was more in my element, for rising on either side of me were the huge bulks of big machines, all greatly corroded and many broken down, but some still fairly complete. You know I have a certain weakness for mechanism, and I was inclined to linger among these; the more so as for the most part they had the interest of puzzles, and I could make only the vaguest guesses at what they were for. I fancied that if I could solve their puzzles I should find myself in possession of powers that might be of use against the Morlocks.
    checkIn:
      id: ttm-ch-08-s2-c1
      stem: Why does the Time Traveller linger among the old machines?
      options:
        - He hopes solving their puzzles might give him powers useful against the Morlocks.
        - He wants to repair one so he can travel back home.
        - He is trying to find a hidden door to the Morlocks' tunnels.
        - He believes the machines contain explosives.
      correctIndex: 0
      explanationZh: 文中提到他对机械有偏好，随后说“I fancied that if I could solve their puzzles I should find myself in possession of powers that might be of use against the Morlocks”。他并不是想修理机器回家，而是希望借此对抗莫洛克人。
  - id: ttm-ch-08-s3
    text: |-
      “Suddenly Weena came very close to my side. So suddenly that she startled me. Had it not been for her I do not think I should have noticed that the floor of the gallery sloped at all. The end I had come in at was quite above ground, and was lit by rare slit-like windows. As you went down the length, the ground came up against these windows, until at last there was a pit like the ‘area’ of a London house before each, and only a narrow line of daylight at the top. I went slowly along, puzzling about the machines, and had been too intent upon them to notice the gradual diminution of the light, until Weena’s increasing apprehensions drew my attention. Then I saw that the gallery ran down at last into a thick darkness. I hesitated, and then, as I looked round me, I saw that the dust was less abundant and its surface less even. Further away towards the dimness, it appeared to be broken by a number of small narrow footprints. My sense of the immediate presence of the Morlocks revived at that. I felt that I was wasting my time in the academic examination of machinery. I called to mind that it was already far advanced in the afternoon, and that I had still no weapon, no refuge, and no means of making a fire. And then down in the remote blackness of the gallery I heard a peculiar pattering, and the same odd noises I had heard down the well.

      “I took Weena’s hand. Then, struck with a sudden idea, I left her and turned to a machine from which projected a lever not unlike those in a signal-box. Clambering upon the stand, and grasping this lever in my hands, I put all my weight upon it sideways. Suddenly Weena, deserted in the central aisle, began to whimper. I had judged the strength of the lever pretty correctly, for it snapped after a minute’s strain, and I rejoined her with a mace in my hand more than sufficient, I judged, for any Morlock skull I might encounter. And I longed very much to kill a Morlock or so. Very inhuman, you may think, to want to go killing one’s own descendants! But it was impossible, somehow, to feel any humanity in the things. Only my disinclination to leave Weena, and a persuasion that if I began to slake my thirst for murder my Time Machine might suffer, restrained me from going straight down the gallery and killing the brutes I heard.
    checkIn:
      id: ttm-ch-08-s3-c1
      stem: How does the Time Traveller obtain his mace?
      options:
        - He finds it lying among the dust on the floor.
        - He breaks a lever off a machine.
        - He pulls it from a display case of weapons.
        - Weena hands him a metal bar she found.
      correctIndex: 1
      explanationZh: 文中说“I left her and turned to a machine from which projected a lever”，随后他用体重压断杠杆，得到“a mace in my hand”。武器并非捡来的，也不是从武器陈列柜取出的。
  - id: ttm-ch-08-s4
    text: |-
      “Well, mace in one hand and Weena in the other, I went out of that gallery and into another and still larger one, which at the first glance reminded me of a military chapel hung with tattered flags. The brown and charred rags that hung from the sides of it, I presently recognized as the decaying vestiges of books. They had long since dropped to pieces, and every semblance of print had left them. But here and there were warped boards and cracked metallic clasps that told the tale well enough. Had I been a literary man I might, perhaps, have moralized upon the futility of all ambition. But as it was, the thing that struck me with keenest force was the enormous waste of labour to which this sombre wilderness of rotting paper testified. At the time I will confess that I thought chiefly of the Philosophical Transactions and my own seventeen papers upon physical optics.

      “Then, going up a broad staircase, we came to what may once have been a gallery of technical chemistry. And here I had not a little hope of useful discoveries. Except at one end where the roof had collapsed, this gallery was well preserved. I went eagerly to every unbroken case. And at last, in one of the really airtight cases, I found a box of matches. Very eagerly I tried them. They were perfectly good. They were not even damp. I turned to Weena. ‘Dance,’ I cried to her in her own tongue. For now I had a weapon indeed against the horrible creatures we feared. And so, in that derelict museum, upon the thick soft carpeting of dust, to Weena’s huge delight, I solemnly performed a kind of composite dance, whistling “The Land of the Leal” as cheerfully as I could. In part it was a modest cancan, in part a step dance, in part a skirt-dance (so far as my tailcoat permitted), and in part original. For I am naturally inventive, as you know.

      “Now, I still think that for this box of matches to have escaped the wear of time for immemorial years was a most strange, as for me it was a most fortunate thing. Yet, oddly enough, I found a far unlikelier substance, and that was camphor. I found it in a sealed jar, that by chance, I suppose, had been really hermetically sealed. I fancied at first that it was paraffin wax, and smashed the glass accordingly. But the odour of camphor was unmistakable. In the universal decay this volatile substance had chanced to survive, perhaps through many thousands of centuries. It reminded me of a sepia painting I had once seen done from the ink of a fossil Belemnite that must have perished and become fossilized millions of years ago. I was about to throw it away, but I remembered that it was inflammable and burned with a good bright flame—was, in fact, an excellent candle—and I put it in my pocket. I found no explosives, however, nor any means of breaking down the bronze doors. As yet my iron crowbar was the most helpful thing I had chanced upon. Nevertheless I left that gallery greatly elated.
    checkIn:
      id: ttm-ch-08-s4-c1
      stem: What discovery makes the Time Traveller so happy that he dances with Weena?
      options:
        - A sealed jar of camphor.
        - A block of sulphur.
        - A box of matches that still work.
        - A box of dynamite cartridges.
      correctIndex: 2
      explanationZh: 文中说在气密陈列柜中找到了“a box of matches”，试了一下“perfectly good”，于是高兴地与威娜跳舞。樟脑是之后才发现的，而炸药在更后面才出现。
  - id: ttm-ch-08-s5
    text: |-
      “I cannot tell you all the story of that long afternoon. It would require a great effort of memory to recall my explorations in at all the proper order. I remember a long gallery of rusting stands of arms, and how I hesitated between my crowbar and a hatchet or a sword. I could not carry both, however, and my bar of iron promised best against the bronze gates. There were numbers of guns, pistols, and rifles. The most were masses of rust, but many were of some new metal, and still fairly sound. But any cartridges or powder there may once have been had rotted into dust. One corner I saw was charred and shattered; perhaps, I thought, by an explosion among the specimens. In another place was a vast array of idols—Polynesian, Mexican, Grecian, Phoenician, every country on earth I should think. And here, yielding to an irresistible impulse, I wrote my name upon the nose of a steatite monster from South America that particularly took my fancy.

      “As the evening drew on, my interest waned. I went through gallery after gallery, dusty, silent, often ruinous, the exhibits sometimes mere heaps of rust and lignite, sometimes fresher. In one place I suddenly found myself near the model of a tin-mine, and then by the merest accident I discovered, in an airtight case, two dynamite cartridges! I shouted ‘Eureka!’ and smashed the case with joy. Then came a doubt. I hesitated. Then, selecting a little side gallery, I made my essay. I never felt such a disappointment as I did in waiting five, ten, fifteen minutes for an explosion that never came. Of course the things were dummies, as I might have guessed from their presence. I really believe that had they not been so, I should have rushed off incontinently and blown Sphinx, bronze doors, and (as it proved) my chances of finding the Time Machine, all together into nonexistence.

      “It was after that, I think, that we came to a little open court within the palace. It was turfed, and had three fruit-trees. So we rested and refreshed ourselves. Towards sunset I began to consider our position. Night was creeping upon us, and my inaccessible hiding-place had still to be found. But that troubled me very little now. I had in my possession a thing that was, perhaps, the best of all defences against the Morlocks—I had matches! I had the camphor in my pocket, too, if a blaze were needed. It seemed to me that the best thing we could do would be to pass the night in the open, protected by a fire. In the morning there was the getting of the Time Machine. Towards that, as yet, I had only my iron mace. But now, with my growing knowledge, I felt very differently towards those bronze doors. Up to this, I had refrained from forcing them, largely because of the mystery on the other side. They had never impressed me as being very strong, and I hoped to find my bar of iron not altogether inadequate for the work.
    checkIn:
      id: ttm-ch-08-s5-c1
      stem: What happens when the Time Traveller tries to test the dynamite cartridges?
      options:
        - They explode and damage part of the gallery.
        - They burn slowly and give him a bright flame.
        - Nothing happens because they are dummies.
        - They release a toxic gas that forces him to leave.
      correctIndex: 2
      explanationZh: 文中说他等了五到十五分钟，却等来了“an explosion that never came”，因为“the things were dummies”。这些假货根本不会爆炸，这其实让他避免了炸毁斯芬克斯和自己的时间机。
quiz:
  - id: ttm-ch-08-q1
    stem: When the Time Traveller first sees writing on the Palace, what does he learn about Weena?
    options:
      - The very idea of writing has never entered her head.
      - She can read a little but cannot write herself.
      - She recognizes the letters but refuses to explain them.
      - She can interpret the symbols only in bright sunlight.
    correctIndex: 0
    explanationZh: 文中明确说“the bare idea of writing had never entered her head”。她并非拒绝解释或需要条件才能读，而是连书写的概念都没有。
  - id: ttm-ch-08-q2
    stem: What detail first warns the Time Traveller that Morlocks may be nearby in the machine gallery?
    options:
      - A loud roar from the far end of the gallery.
      - Small, narrow footprints in the dust.
      - A broken machine still smoking.
      - Fresh blood on the floor.
    correctIndex: 1
    explanationZh: 文中写到他注意到灰尘“broken by a number of small narrow footprints”，由此莫洛克人的存在感重新升起。他并没有听到吼叫或看到冒烟的机器。
  - id: ttm-ch-08-q3
    stem: Why does the Time Traveller refrain from going straight down the gallery to kill the Morlocks?
    options:
      - He has no weapon yet and feels defenseless.
      - He fears that doing so might endanger his Time Machine.
      - Weena begs him to leave with her immediately.
      - The Morlocks have already fled the gallery.
    correctIndex: 1
    explanationZh: 文中说他之所以克制，是因为“a persuasion that if I began to slake my thirst for murder my Time Machine might suffer”。他手里已有铁锤，但担心贸然行动会危及时间机。
  - id: ttm-ch-08-q4
    stem: What does the Time Traveller find in the gallery that reminds him of a military chapel?
    options:
      - Decaying rags that are the remains of books.
      - Rows of rusty rifles and pistols.
      - Tattered battle flags from old wars.
      - A collection of stone idols from many countries.
    correctIndex: 0
    explanationZh: 文中说这个大厅让他想起military chapel，但随后认出“the decaying vestiges of books”。武器和神像是在其他展厅看到的，不是这里。
  - id: ttm-ch-08-q5
    stem: What does the Time Traveller do with the camphor, and why?
    options:
      - He throws it away because it has gone bad.
      - He eats a small piece to refresh himself.
      - He uses it to patch a leak in the roof.
      - He keeps it because it burns with a good bright flame, like an excellent candle.
    correctIndex: 3
    explanationZh: 文中说他起初想丢掉，但记起它“inflammable and burned with a good bright flame”，于是放进口袋当蜡烛用。他并非丢弃或食用。
  - id: ttm-ch-08-q6
    stem: Why are the dynamite cartridges ultimately useless to the Time Traveller?
    options:
      - They are too old and have rotted into dust.
      - He cannot find anything to strike a match near them.
      - They are fakes placed in the display.
      - They are locked in a case he cannot break.
    correctIndex: 2
    explanationZh: 文中说等了半天没有爆炸，原因是“the things were dummies”。它们不是受潮失效的真炸药，而是陈列用的假货。

      - It came to yield three times the clear revenue of Ireland's
    correctIndex: 3
    explanationZh: 改良起初费钱，头四年这个邮局倒欠了他们九百多镑；此后开始回本，到他被撤职之前，"we had brought it to yield three times as much clear revenue to the crown as the post-office of Ireland"。他末了加了一句：那桩糊涂事之后，他们从这里再没收到过一个法寻。

  - id: bf-ch-13-q2
    stem: Whose idea was the Philadelphia hospital?
    options:
      - Dr. Thomas Bond, a particular friend of Franklin's
      - The governor, who put it before the Assembly
      - Franklin himself, though he made a show of denying it
      - A knot of country members who later opposed the bill
    correctIndex: 0
    explanationZh: 富兰克林特意声明这桩善举 "has been ascribed to me, but was originally his"——出自好友 Dr. Thomas Bond。邦德四处劝捐却收效甚微，因为这在美洲还是新鲜事，一时没人明白。
  - id: bf-ch-13-q3
    stem: What did the country members object at first?

id: bf-ch-13
bookId: book-franklin
title: Public Services and Duties (1749–1753)
titleZh: 公共服务与职责（1749–1753）
summaryZh: 和约既成，自卫联合的事告一段落，他把心思又转回办学堂上。这一次先拉起一批热心的朋友，多半出自 Junto；接着印了一本谈青年教育的小册子，白送给城里有头脸的人家。
sections:
  - id: bf-ch-13-s1
    text: |-
      Peace being concluded, and the association business therefore at an end, I turned my thoughts again to the affair of establishing an academy. The first step I took was to associate in the design a number of active friends, of whom the Junto furnished a good part; the next was to write and publish a pamphlet, entitled “Proposals Relating to the Education of Youth in Pennsylvania.” This I distributed among the principal inhabitants gratis; and as soon as I could suppose their minds a little prepared by the perusal of it, I set on foot a subscription for opening and supporting an academy; it was to be paid in quotas yearly for five years; by so dividing it, I judged the subscription might be larger, and I believe it was so, amounting to no less, if I remember right, than five thousand pounds.

      In the introduction to these proposals, I stated their publication, not as an act of mine, but of some public-spirited gentlemen, avoiding as much as I could, according to my usual rule, the presenting myself to the public as the author of any scheme for their benefit.

      The subscribers, to carry the project into immediate execution, chose out of their number twenty-four trustees, and appointed Mr. Francis, then attorney-general, and myself to draw up constitutions for the government of the academy; which being done and signed, a house was hired, masters engaged, and the schools opened, I think, in the same year, 1749.

      The scholars increasing fast, the house was soon found too small, and we were looking out for a piece of ground, properly situated, with intention to build, when Providence threw into our way a large house ready built, which, with a few alterations, might well serve our purpose. This was the building before mentioned, erected by the hearers of Mr. Whitefield, and was obtained for us in the following manner.

      It is to be noted that the contributions to this building being made by people of different sects, care was taken in the nomination of trustees, in whom the building and ground was to be vested, that a predominancy should not be given to any sect, lest in time that predominancy might be a means of appropriating the whole to the use of such sect, contrary to the original intention. It was therefore that one of each sect was appointed, viz., one Church-of-England man, one Presbyterian, one Baptist, one Moravian, etc., those, in case of vacancy by death, were to fill it by election from among the contributors. The Moravian happened not to please his colleagues, and on his death they resolved to have no other of that sect. The difficulty then was, how to avoid having two of some other sect, by means of the new choice.
    checkIn:
      id: bf-ch-13-s1-c1
      stem: How was the academy pamphlet presented to the public?
      options:
        - As the work of some public-spirited gentlemen, not his own
        - As his own proposal, to draw larger subscriptions in
        - As a scheme put forward by the Junto and no one else
        - As a plan drawn up by the twenty-four trustees
      correctIndex: 0
      explanationZh: 序言里他把这份东西说成 "not as an act of mine, but of some public-spirited gentlemen"，照的还是那条老规矩——凡是造福公众的方案，尽量不把自己摆到台前。
  - id: bf-ch-13-s2
    text: |-
      Several persons were named, and for that reason not agreed to. At length one mentioned me, with the observation that I was merely an honest man, and of no sect at all, which prevailed with them to choose me. The enthusiasm which existed when the house was built had long since abated, and its trustees had not been able to procure fresh contributions for paying the ground-rent, and discharging some other debts the building had occasioned, which embarrassed them greatly. Being now a member of both sets of trustees, that for the building and that for the academy, I had a good opportunity of negotiating with both, and brought them finally to an agreement, by which the trustees for the building were to cede it to those of the academy, the latter undertaking to discharge the debt, to keep forever open in the building a large hall for occasional preachers, according to the original intention, and maintain a free-school for the instruction of poor children. Writings were accordingly drawn, and on paying the debts the trustees of the academy were put in possession of the premises; and by dividing the great and lofty hall into stories, and different rooms above and below for the several schools, and purchasing some additional ground, the whole was soon made fit for our purpose, and the scholars removed into the building. The care and trouble of agreeing with the workmen, purchasing materials, and superintending the work, fell upon me; and I went through it the more cheerfully, as it did not then interfere with my private business, having the year before taken a very able, industrious, and honest partner, Mr. David Hall, with whose character I was well acquainted, as he had worked for me four years. He took off my hands all care of the printing-office, paying me punctually my share of the profits. The partnership continued eighteen years, successfully for us both.

      The trustees of the academy, after a while, were incorporated by a charter from the governor; their funds were increased by contributions in Britain and grants of land from the proprietaries, to which the Assembly has since made considerable addition; and thus was established the present University of Philadelphia. I have been continued one of its trustees from the beginning, now near forty years, and have had the very great pleasure of seeing a number of the youth who have received their education in it, distinguished by their improved abilities, serviceable in public stations, and ornaments to their country.
    checkIn:
      id: bf-ch-13-s2-c1
      stem: Why did the building's trustees settle on Franklin?
      options:
        - He was the leading Moravian in the congregation
        - He was an honest man, and of no sect at all
        - He had acted as the academy's attorney already
        - He offered to clear the ground-rent himself
      correctIndex: 1
      explanationZh: 各派都不愿再选摩拉维亚人，又怕新人一进来让某派占了两席，僵持之下有人提起他，理由是 "I was merely an honest man, and of no sect at all"，众人这才点头。
  - id: bf-ch-13-s3
    text: |-
      When I disengaged myself, as above mentioned, from private business, I flattered myself that, by the sufficient though moderate fortune I had acquired, I had secured leisure during the rest of my life for philosophical studies and amusements. I purchased all Dr. Spence’s apparatus, who had come from England to lecture here, and I proceeded in my electrical experiments with great alacrity; but the public, now considering me as a man of leisure, laid hold of me for their purposes, every part of our civil government, and almost at the same time, imposing some duty upon me. The governor put me into the commission of the peace; the corporation of the city chose me of the common council, and soon after an alderman; and the citizens at large chose me a burgess to represent them in Assembly. This latter station was the more agreeable to me, as I was at length tired with sitting there to hear debates, in which, as clerk, I could take no part, and which were often so unentertaining that I was induced to amuse myself with making magic squares or circles, or anything to avoid weariness; and I conceived my becoming a member would enlarge my power of doing good. I would not, however, insinuate that my ambition was not flattered by all these promotions; it certainly was; for, considering my low beginning, they were great things to me; and they were still more pleasing, as being so many spontaneous testimonies of the public good opinion, and by me entirely unsolicited.

      The office of justice of the peace I tried a little, by attending a few courts, and sitting on the bench to hear causes; but finding that more knowledge of the common law than I possessed was necessary to act in that station with credit, I gradually withdrew from it, excusing myself by my being obliged to attend the higher duties of a legislator in the Assembly. My election to this trust was repeated every year for ten years, without my ever asking any elector for his vote, or signifying, either directly or indirectly, any desire of being chosen. On taking my seat in the House, my son was appointed their clerk.

      The year following, a treaty being to be held with the Indians at Carlisle, the governor sent a message to the House, proposing that they should nominate some of their members, to be joined with some members of council, as commissioners for that purpose. The House named the speaker (Mr. Norris) and myself; and, being commissioned, we went to Carlisle, and met the Indians accordingly.
    checkIn:
      id: bf-ch-13-s3-c1
      stem: Why did Franklin fall away from the justice's bench?
      options:
        - The salary was too small to be worth the trouble
        - The governor turned him out for neglecting the courts
        - He found he had too little common law for the bench
        - He meant to give his whole time to electrical work
      correctIndex: 2
      explanationZh: 他上过几回堂、听过几桩案子，随即发现 "more knowledge of the common law than I possessed was necessary to act in that station with credit"，便渐渐不去了，借口是议会那边的差事更要紧。
  - id: bf-ch-13-s4
    text: |-
      As those people are extremely apt to get drunk, and, when so, are very quarrelsome and disorderly, we strictly forbad the selling any liquor to them; and when they complained of this restriction, we told them that if they would continue sober during the treaty, we would give them plenty of rum when business was over. They promised this, and they kept their promise, because they could get no liquor, and the treaty was conducted very orderly, and concluded to mutual satisfaction. They then claimed and received the rum; this was in the afternoon: they were near one hundred men, women, and children, and were lodged in temporary cabins, built in the form of a square, just without the town. In the evening, hearing a great noise among them, the commissioners walked out to see what was the matter. We found they had made a great bonfire in the middle of the square; they were all drunk, men and women, quarreling and fighting. Their dark-coloured bodies, half naked, seen only by the gloomy light of the bonfire, running after and beating one another with firebrands, accompanied by their horrid yellings, formed a scene the most resembling our ideas of hell that could well be imagined; there was no appeasing the tumult, and we retired to our lodging. At midnight a number of them came thundering at our door, demanding more rum, of which we took no notice.

      The next day, sensible they had misbehaved in giving us that disturbance, they sent three of their old counselors to make their apology. The orator acknowledged the fault, but laid it upon the rum; and then endeavoured to excuse the rum by saying, “The Great Spirit, who made all things, made everything for some use, and whatever use he designed anything for, that use it should always be put to. Now, when he made rum, he said, ‘Let this be for the Indians to get drunk with,’ and it must be so.” And, indeed, if it be the design of Providence to extirpate these savages in order to make room for cultivators of the earth, it seems not improbable that rum may be the appointed means. It has already annihilated all the tribes who formerly inhabited the seacoast.

      In 1751, Dr. Thomas Bond, a particular friend of mine, conceived the idea of establishing a hospital in Philadelphia (a very beneficent design, which has been ascribed to me, but was originally his), for the reception and cure of poor sick persons, whether inhabitants of the province or strangers. He was zealous and active in endeavouring to procure subscriptions for it, but the proposal being a novelty in America, and at first not well understood, he met but with small success.
    checkIn:
      id: bf-ch-13-s4-c1
      stem: How were the Indians kept sober through the treaty?
      options:
        - No liquor was to be sold to them until business was over
        - They had sworn a vow of temperance before setting out
        - There was no rum to be had anywhere in the province
        - The rum was handed out before the talks began each day
      correctIndex: 0
      explanationZh: 委员们 "strictly forbad the selling any liquor to them"，并许诺事情谈完就给足朗姆酒。他们守住了承诺——书里补了一句实话："because they could get no liquor"。
  - id: bf-ch-13-s5
    text: |-
      At length he came to me with the compliment that he found there was no such thing as carrying a public-spirited project through without my being concerned in it. “For,” says he, “I am often asked by those to whom I propose subscribing, Have you consulted Franklin upon this business? And what does he think of it? And when I tell them that I have not (supposing it rather out of your line), they do not subscribe, but say they will consider of it.” I enquired into the nature and probable utility of his scheme, and receiving from him a very satisfactory explanation, I not only subscribed to it myself, but engaged heartily in the design of procuring subscriptions from others. Previously, however, to the solicitation, I endeavoured to prepare the minds of the people by writing on the subject in the newspapers, which was my usual custom in such cases, but which he had omitted.

      The subscriptions afterwards were more free and generous; but, beginning to flag, I saw they would be insufficient without some assistance from the Assembly, and therefore proposed to petition for it, which was done. The country members did not at first relish the project; they objected that it could only be serviceable to the city, and therefore the citizens alone should be at the expense of it; and they doubted whether the citizens themselves generally approved of it. My allegation on the contrary, that it met with such approbation as to leave no doubt of our being able to raise two thousand pounds by voluntary donations, they considered as a most extravagant supposition, and utterly impossible.

      On this I formed my plan; and, asking leave to bring in a bill for incorporating the contributors according to the prayer of their petition, and granting them a blank sum of money, which leave was obtained chiefly on the consideration that the House could throw the bill out if they did not like it, I drew it so as to make the important clause a conditional one, viz., “And be it enacted, by the authority aforesaid, that when the said contributors shall have met and chosen their managers and treasurer, and shall have raised by their contributions a capital stock of ⸻ value (the yearly interest of which is to be applied to the accommodating of the sick poor in the said hospital, free of charge for diet, attendance, advice, and medicines), and shall make the same appear to the satisfaction of the speaker of the Assembly for the time being, that then it shall and may be lawful for the said speaker, and he is hereby required, to sign an order on the provincial treasurer for the payment of two thousand pounds, in two yearly payments, to the treasurer of the said hospital, to be applied to the founding, building, and finishing of the same.”
    checkIn:
      id: bf-ch-13-s5-c1
      stem: What did Franklin do before he went out asking for subscriptions?
      options:
        - He went to Britain first to look for private money
        - He wrote on the subject in the papers to prepare people
        - He printed a list of everyone likely to give
        - He took the petition to the Assembly before anyone else
      correctIndex: 1
      explanationZh: 他自己加入并出力募捐之前，先 "endeavoured to prepare the minds of the people by writing on the subject in the newspapers, which was my usual custom in such cases, but which he had omitted"——这一步邦德医生原本漏掉了。
  - id: bf-ch-13-s6
    text: |-
      This condition carried the bill through; for the members, who had opposed the grant, and now conceived they might have the credit of being charitable without the expense, agreed to its passage; and then, in soliciting subscriptions among the people, we urged the conditional promise of the law as an additional motive to give, since every man’s donation would be doubled; thus the clause worked both ways. The subscriptions accordingly soon exceeded the requisite sum, and we claimed and received the public gift, which enabled us to carry the design into execution. A convenient and handsome building was soon erected; the institution has by constant experience been found useful, and flourishes to this day; and I do not remember any of my political manoeuvers, the success of which gave me at the time more pleasure, or wherein, after thinking of it, I more easily excused myself for having made some use of cunning.

      It was about this time that another projector, the Rev. Gilbert Tennent, came to me with a request that I would assist him in procuring a subscription for erecting a new meetinghouse. It was to be for the use of a congregation he had gathered among the Presbyterians, who were originally disciples of Mr. Whitefield. Unwilling to make myself disagreeable to my fellow-citizens by too frequently soliciting their contributions, I absolutely refused. He then desired I would furnish him with a list of the names of persons I knew by experience to be generous and public-spirited. I thought it would be unbecoming in me, after their kind compliance with my solicitations, to mark them out to be worried by other beggars, and therefore refused also to give such a list. He then desired I would at least give him my advice. “That I will readily do,” said I; “and, in the first place, I advise you to apply to all those whom you know will give something; next, to those whom you are uncertain whether they will give anything or not, and show them the list of those who have given; and, lastly, do not neglect those who you are sure will give nothing, for in some of them you may be mistaken.” He laughed and thanked me, and said he would take my advice. He did so, for he asked of everybody, and he obtained a much larger sum than he expected, with which he erected the capacious and very elegant meetinghouse that stands in Arch-street.
    checkIn:
      id: bf-ch-13-s6-c1
      stem: Why did the bill's opponents let it pass in the end?
      options:
        - They were promised private favours for their votes
        - They thought the money had all been raised already
        - They could take credit for charity without the expense
        - They expected the hospital to be built in their own counties
      correctIndex: 2
      explanationZh: 那笔钱要等民间先募足才拨得出来，于是先前反对的人 "now conceived they might have the credit of being charitable without the expense, agreed to its passage"。募捐时又可以拿这个条件劝人——每一笔捐款都等于翻倍，条款两头都在起作用。
  - id: bf-ch-13-s7
    text: |-
      Our city, though laid out with a beautiful regularity, the streets large, straight, and crossing each other at right angles, had the disgrace of suffering those streets to remain long unpaved, and in wet weather the wheels of heavy carriages ploughed them into a quagmire, so that it was difficult to cross them; and in dry weather the dust was offensive. I had lived near what was called the Jersey Market, and saw with pain the inhabitants wading in mud while purchasing their provisions. A strip of ground down the middle of that market was at length paved with brick, so that, being once in the market, they had firm footing, but were often over shoes in dirt to get there. By talking and writing on the subject, I was at length instrumental in getting the street paved with stone between the market and the bricked foot-pavement, that was on each side next the houses. This, for some time, gave an easy access to the market dry-shod; but, the rest of the street not being paved, whenever a carriage came out of the mud upon this pavement, it shook off and left its dirt upon it, and it was soon covered with mire, which was not removed, the city as yet having no scavengers.

      After some inquiry, I found a poor, industrious man, who was willing to undertake keeping the pavement clean, by sweeping it twice a week, carrying off the dirt from before all the neighbours’ doors, for the sum of sixpence per month, to be paid by each house. I then wrote and printed a paper setting forth the advantages to the neighbourhood that might be obtained by this small expense; the greater ease in keeping our houses clean, so much dirt not being brought in by people’s feet; the benefit to the shops by more custom, etc., etc., as buyers could more easily get at them; and by not having, in windy weather, the dust blown in upon their goods, etc., etc. I sent one of these papers to each house, and in a day or two went round to see who would subscribe an agreement to pay these sixpences; it was unanimously signed, and for a time well executed. All the inhabitants of the city were delighted with the cleanliness of the pavement that surrounded the market, it being a convenience to all, and this raised a general desire to have all the streets paved, and made the people more willing to submit to a tax for that purpose.
    checkIn:
      id: bf-ch-13-s7-c1
      stem: How was the pavement by the Jersey Market first kept clean?
      options:
        - He found a poor man, paid sixpence a month by each house
        - He asked the Assembly to fund scavengers for the whole city
        - He paid the whole cost himself out of his own pocket
        - He got the neighbours to sweep by turns without pay
      correctIndex: 0
      explanationZh: 他寻到一个肯干的穷人，一周扫两次、把各家门前的脏土运走，"for the sum of sixpence per month, to be paid by each house"。他先印了一张纸讲明好处送到各户，两天后上门收签名，人人都签了。
  - id: bf-ch-13-s8
    text: |-
      After some time I drew a bill for paving the city, and brought it into the Assembly. It was just before I went to England, in 1757, and did not pass till I was gone, and then with an alteration in the mode of assessment, which I thought not for the better, but with an additional provision for lighting as well as paving the streets, which was a great improvement. It was by a private person, the late Mr. John Clifton, his giving a sample of the utility of lamps, by placing one at his door, that the people were first impressed with the idea of enlighting all the city. The honour of this public benefit has also been ascribed to me, but it belongs truly to that gentleman. I did but follow his example, and have only some merit to claim respecting the form of our lamps, as differing from the globe lamps we were at first supplied with from London. Those we found inconvenient in these respects: they admitted no air below; the smoke, therefore, did not readily go out above, but circulated in the globe, lodged on its inside, and soon obstructed the light they were intended to afford; giving, besides, the daily trouble of wiping them clean; and an accidental stroke on one of them would demolish it, and render it totally useless. I therefore suggested the composing them of four flat panes, with a long funnel above to draw up the smoke, and crevices admitting air below, to facilitate the ascent of the smoke; by this means they were kept clean, and did not grow dark in a few hours, as the London lamps do, but continued bright till morning, and an accidental stroke would generally break but a single pane, easily repaired.

      I have sometimes wondered that the Londoners did not, from the effect holes in the bottom of the globe lamps used at Vauxhall have in keeping them clean, learn to have such holes in their street lamps. But, these holes being made for another purpose, viz., to communicate flame more suddenly to the wick by a little flax hanging down through them, the other use, of letting in air, seems not to have been thought of; and therefore, after the lamps have been lit a few hours, the streets of London are very poorly illuminated.

      The mention of these improvements puts me in mind of one I proposed, when in London, to Dr. Fothergill, who was among the best men I have known, and a great promoter of useful projects. I had observed that the streets, when dry, were never swept, and the light dust carried away; but it was suffered to accumulate till wet weather reduced it to mud, and then, after lying some days so deep on the pavement that there was no crossing but in paths kept clean by poor people with brooms, it was with great labour raked together and thrown up into carts open above, the sides of which suffered some of the slush at every jolt on the pavement to shake out and fall, sometimes to the annoyance of foot-passengers. The reason given for not sweeping the dusty streets was that the dust would fly into the windows of shops and houses.
    checkIn:
      id: bf-ch-13-s8-c1
      stem: What shape did Franklin propose for the street lamps?
      options:
        - Thicker globes brought from London for strength
        - A mirror set behind each flame to throw the light down
        - A sealed glass case to keep the smoke from getting out
        - Four flat panes, a funnel above, and crevices below
      correctIndex: 3
      explanationZh: 伦敦来的球形灯下不进气，烟出不去，就在球里打转、糊在内壁上，几个钟头便暗了，碰一下还整只报废。他因此主张 "composing them of four flat panes, with a long funnel above to draw up the smoke, and crevices admitting air below"——这样能亮到天明，磕坏也只坏一块玻璃。
  - id: bf-ch-13-s9
    text: |-
      An accidental occurrence had instructed me how much sweeping might be done in a little time. I found at my door in Craven-street, one morning, a poor woman sweeping my pavement with a birch broom; she appeared very pale and feeble, as just come out of a fit of sickness. I asked who employed her to sweep there; she said, “Nobody, but I am very poor and in distress, and I sweeps before gentle-folkses doors, and hopes they will give me something.” I bid her sweep the whole street clean, and I would give her a shilling; this was at nine o’clock; at twelve she came for the shilling. From the slowness I saw at first in her working, I could scarce believe that the work was done so soon, and sent my servant to examine it, who reported that the whole street was swept perfectly clean, and all the dust placed in the gutter, which was in the middle; and the next rain washed it quite away, so that the pavement and even the kennel were perfectly clean.

      I then judged that, if that feeble woman could sweep such a street in three hours, a strong, active man might have done it in half the time. And here let me remark the convenience of having but one gutter in such a narrow street, running down its middle, instead of two, one on each side, near the footway; for where all the rain that falls on a street runs from the sides and meets in the middle, it forms there a current strong enough to wash away all the mud it meets with; but when divided into two channels, it is often too weak to cleanse either, and only makes the mud it finds more fluid, so that the wheels of carriages and feet of horses throw and dash it upon the foot-pavement, which is thereby rendered foul and slippery, and sometimes splash it upon those who are walking. My proposal, communicated to the good doctor, was as follows:

      “For the more effectual cleaning and keeping clean the streets of London and Westminster, it is proposed that the several watchmen be contracted with to have the dust swept up in dry seasons, and the mud raked up at other times, each in the several streets and lanes of his round; that they be furnished with brooms and other proper instruments for these purposes, to be kept at their respective stands, ready to furnish the poor people they may employ in the service.
    checkIn:
      id: bf-ch-13-s9-c1
      stem: What did the woman in Craven-street teach Franklin?
      options:
        - That London already had a good system for cleaning streets
        - That a feeble woman could sweep a whole street in three hours
        - That sweeping only spread the dirt further about the street
        - That birch brooms were of no use on a London pavement
      correctIndex: 1
      explanationZh: 她面色苍白，像刚病过一场，九点开工，十二点就来讨那一先令。仆人查过之后回报说整条街扫得干干净净，灰土都拨进了当中的水沟，一场雨就冲光了。他由此推想，一个精壮汉子这活儿只要一半时间。
  - id: bf-ch-13-s10
    text: |-
      “That in the dry summer months the dust be all swept up into heaps at proper distances, before the shops and windows of houses are usually opened, when the scavengers, with close-covered carts, shall also carry it all away.

      “That the mud, when raked up, be not left in heaps to be spread abroad again by the wheels of carriages and trampling of horses, but that the scavengers be provided with bodies of carts, not placed high upon wheels, but low upon sliders, with lattice bottoms, which, being covered with straw, will retain the mud thrown into them, and permit the water to drain from it, whereby it will become much lighter, water making the greatest part of its weight; these bodies of carts to be placed at convenient distances, and the mud brought to them in wheelbarrows; they remaining where placed till the mud is drained, and then horses brought to draw them away.”

      I have since had doubts of the practicability of the latter part of this proposal, on account of the narrowness of some streets, and the difficulty of placing the draining-sleds so as not to encumber too much the passage; but I am still of opinion that the former, requiring the dust to be swept up and carried away before the shops are open, is very practicable in the summer, when the days are long; for, in walking through the Strand and Fleet-street one morning at seven o’clock, I observed there was not one shop open, though it had been daylight and the sun up above three hours; the inhabitants of London choosing voluntarily to live much by candlelight, and sleep by sunshine, and yet often complain, a little absurdly, of the duty on candles, and the high price of tallow.

      Some may think these trifling matters not worth minding or relating; but when they consider that though dust blown into the eyes of a single person, or into a single shop on a windy day, is but of small importance, yet the great number of the instances in a populous city, and its frequent repetitions give it weight and consequence, perhaps they will not censure very severely those who bestow some attention to affairs of this seemingly low nature. Human felicity is produced not so much by great pieces of good fortune that seldom happen, as by little advantages that occur every day. Thus, if you teach a poor young man to shave himself, and keep his razor in order, you may contribute more to the happiness of his life than in giving him a thousand guineas. The money may be soon spent, the regret only remaining of having foolishly consumed it; but in the other case, he escapes the frequent vexation of waiting for barbers, and of their sometimes dirty fingers, offensive breaths, and dull razors; he shaves when most convenient to him, and enjoys daily the pleasure of its being done with a good instrument. With these sentiments I have hazarded the few preceding pages, hoping they may afford hints which some time or other may be useful to a city I love, having lived many years in it very happily, and perhaps to some of our towns in America.
    checkIn:
      id: bf-ch-13-s10-c1
      stem: Why did Franklin later doubt the draining-sled part of his plan?
      options:
        - The sleds would cost the city more than it could bear
        - There was not straw enough in London to line them
        - Some streets were too narrow to set them out of the way
        - The mud inside them would freeze hard in the winter
      correctIndex: 2
      explanationZh: 他后来对方案的后半段起了疑，缘故是 "the narrowness of some streets, and the difficulty of placing the draining-sleds so as not to encumber too much the passage"。前半段——趁店铺开门前把浮土扫走运掉——他仍认为夏天完全办得到。
  - id: bf-ch-13-s11
    text: |-
      Having been for some time employed by the postmaster-general of America as his comptroller in regulating several offices, and bringing the officers to account, I was, upon his death in 1753, appointed, jointly with Mr. William Hunter, to succeed him, by a commission from the postmaster-general in England. The American office never had hitherto paid anything to that of Britain. We were to have six hundred pounds a year between us, if we could make that sum out of the profits of the office. To do this, a variety of improvements were necessary; some of these were inevitably at first expensive, so that in the first four years the office became above nine hundred pounds in debt to us. But it soon after began to repay us; and before I was displaced by a freak of the ministers, of which I shall speak hereafter, we had brought it to yield three times as much clear revenue to the crown as the post-office of Ireland. Since that imprudent transaction, they have received from it—not one farthing!

      The business of the post-office occasioned my taking a journey this year to New England, where the College of Cambridge, of their own motion, presented me with the degree of Master of Arts. Yale College, in Connecticut, had before made me a similar compliment. Thus, without studying in any college, I came to partake of their honours. They were conferred in consideration of my improvements and discoveries in the electric branch of natural philosophy.
    checkIn:
      id: bf-ch-13-s11-c1
      stem: On what ground did Cambridge and Yale confer their degrees?
      options:
        - For putting the colonial post-office on a paying footing
        - For his years as comptroller to the postmaster-general
        - For founding the academy in Philadelphia
        - For his improvements and discoveries in electricity
      correctIndex: 3
      explanationZh: 两校都是主动授予的，"in consideration of my improvements and discoveries in the electric branch of natural philosophy"。他自嘲说，自己没进过任何学院，倒也分到了学院的荣誉。
quiz:
  - id: bf-ch-13-q1
    stem: On what terms did the academy take over Whitefield's building?
    options:
      - They were to pay a yearly ground-rent to the old trustees
      - They were to turn the whole place into fee-paying rooms
      - They were to keep a hall for preachers and a free school
      - They were to keep one Moravian on the board for ever
    correctIndex: 2

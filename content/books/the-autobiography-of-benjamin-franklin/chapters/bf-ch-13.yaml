      - He drew out improvements he meant to make to his press
    correctIndex: 1
    explanationZh: 做书记只能旁听，插不上话，辩论又常常无趣，他便 "induced to amuse myself with making magic squares or circles, or anything to avoid weariness"。后来当选议员，他觉得比做书记称心，也因为终于能开口做点事了。
  - id: bf-ch-13-q6
    stem: How did the American post-office fare under Franklin and Hunter?
    options:
      - It never turned a profit and stayed deep in debt

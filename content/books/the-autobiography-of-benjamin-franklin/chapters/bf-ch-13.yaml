    explanationZh: 这些人先前已慷慨应过他的募捐，再把名字交出去 "to be worried by other beggars" 就不合适了。他只肯给一条主意：先找准会给的，再找拿不准的并给他们看已捐者的名单，最后连以为一定不给的也别漏掉——那里头说不定就看走了眼。
  - id: bf-ch-13-q5
    stem: How did Franklin pass the duller debates while he was clerk?
    options:
      - He drafted letters to his friends in natural philosophy

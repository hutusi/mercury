id: bf-ch-18
bookId: book-franklin
title: Scientific Experiments
titleZh: 科学实验
summaryZh: 在接着写新总督任内的公事之前，他先回头交代一件事——自己那点哲学上的名声是怎么来的。1746 年他在波士顿遇上一位刚从苏格兰来的斯彭斯医生，看了几个做得并不算高明的电学实验。
sections:
  - id: bf-ch-18-s1
    text: |-
      Before I proceed in relating the part I had in public affairs under this new governor’s administration, it may not be amiss here to give some account of the rise and progress of my philosophical reputation.

      In 1746, being at Boston, I met there with a Dr. Spence, who was lately arrived from Scotland, and showed me some electric experiments. They were imperfectly performed, as he was not very expert; but, being on a subject quite new to me, they equally surprised and pleased me. Soon after my return to Philadelphia, our library company received from Mr. P. Collinson, Fellow of the Royal Society of London, a present of a glass tube, with some account of the use of it in making such experiments. I eagerly seized the opportunity of repeating what I had seen at Boston; and, by much practice, acquired great readiness in performing those, also, which we had an account of from England, adding a number of new ones. I say much practice, for my house was continually full, for some time, with people who came to see these new wonders.

      To divide a little this incumbrance among my friends, I caused a number of similar tubes to be blown at our glasshouse, with which they furnished themselves, so that we had at length several performers. Among these, the principal was Mr. Kinnersley, an ingenious neighbour, who, being out of business, I encouraged to undertake showing the experiments for money, and drew up for him two lectures, in which the experiments were ranged in such order, and accompanied with such explanations in such method, as that the foregoing should assist in comprehending the following. He procured an elegant apparatus for the purpose, in which all the little machines that I had roughly made for myself were nicely formed by instrument-makers. His lectures were well attended, and gave great satisfaction; and after some time he went through the colonies, exhibiting them in every capital town, and picked up some money. In the West India islands, indeed, it was with difficulty the experiments could be made, from the general moisture of the air.

      Obliged as we were to Mr. Collinson for his present of the tube, etc., I thought it right he should be informed of our success in using it, and wrote him several letters containing accounts of our experiments. He got them read in the Royal Society, where they were not at first thought worth so much notice as to be printed in their Transactions. One paper, which I wrote for Mr. Kinnersley, on the sameness of lightning with electricity, I sent to Dr. Mitchel, an acquaintance of mine, and one of the members also of that society, who wrote me word that it had been read, but was laughed at by the connoisseurs. The papers, however, being shown to Dr. Fothergill, he thought them of too much value to be stifled, and advised the printing of them. Mr. Collinson then gave them to Cave for publication in his Gentleman’s Magazine; but he chose to print them separately in a pamphlet, and Dr. Fothergill wrote the preface. Cave, it seems, judged rightly for his profit, for by the additions that arrived afterward, they swelled to a quarto volume, which has had five editions, and cost him nothing for copy-money.
    checkIn:
      id: bf-ch-18-s1-c1
      stem: How did Franklin spread the crowd that filled his house?
      options:
        - He had more tubes blown so friends could show them too
        - He began to charge a shilling at the door to thin the crowd
        - He moved the showings into the library company's hall
        - He wrote to Collinson for a fresh supply out of London
      correctIndex: 0
      explanationZh: 他的原话是 "To divide a little this incumbrance among my friends, I caused a number of similar tubes to be blown at our glasshouse, with which they furnished themselves, so that we had at length several performers."。收门票是后来 Kinnersley 巡回演讲时的事。
  - id: bf-ch-18-s2
    text: |-
      It was, however, some time before those papers were much taken notice of in England. A copy of them happening to fall into the hands of the Count de Buffon, a philosopher deservedly of great reputation in France, and, indeed, all over Europe, he prevailed with M. Dalibard to translate them into French, and they were printed at Paris. The publication offended the Abbé Nollet, preceptor in Natural Philosophy to the royal family, and an able experimenter, who had formed and published a theory of electricity, which then had the general vogue. He could not at first believe that such a work came from America, and said it must have been fabricated by his enemies at Paris, to decry his system. Afterwards, having been assured that there really existed such a person as Franklin at Philadelphia, which he had doubted, he wrote and published a volume of Letters, chiefly addressed to me, defending his theory, and denying the verity of my experiments, and of the positions deduced from them.

      I once purposed answering the abbé, and actually began the answer; but, on consideration that my writings contained a description of experiments which anyone might repeat and verify, and if not to be verified, could not be defended; or of observations offered as conjectures, and not delivered dogmatically, therefore not laying me under any obligation to defend them; and reflecting that a dispute between two persons, writing in different languages, might be lengthened greatly by mistranslations, and thence misconceptions of one another’s meaning, much of one of the abbé’s letters being founded on an error in the translation, I concluded to let my papers shift for themselves, believing it was better to spend what time I could spare from public business in making new experiments, than in disputing about those already made. I therefore never answered M. Nollet, and the event gave me no cause to repent my silence; for my friend M. le Roy, of the Royal Academy of Sciences, took up my cause and refuted him; my book was translated into the Italian, German, and Latin languages; and the doctrine it contained was by degrees universally adopted by the philosophers of Europe, in preference to that of the abbé; so that he lived to see himself the last of his sect, except Monsieur B⸺, of Paris, his élève and immediate disciple.

      What gave my book the more sudden and general celebrity, was the success of one of its proposed experiments, made by Messrs. Dalibard and De Lor at Marly, for drawing lightning from the clouds. This engaged the public attention everywhere. M. de Lor, who had an apparatus for experimental philosophy, and lectured in that branch of science, undertook to repeat what he called the “Philadelphia Experiments”; and, after they were performed before the king and court, all the curious of Paris flocked to see them. I will not swell this narrative with an account of that capital experiment, nor of the infinite pleasure I received in the success of a similar one I made soon after with a kite at Philadelphia, as both are to be found in the histories of electricity.
    checkIn:
      id: bf-ch-18-s2-c1
      stem: Why did Franklin let the Abbé Nollet's letters go unanswered?
      options:
        - He was told the Royal Society would answer for him
        - He owned that Nollet's theory fitted the facts better
        - His French was not equal to composing a proper reply
        - Experiments that anyone can repeat need no defending
      correctIndex: 3
      explanationZh: 他动过笔，也确实开了个头，随即想明白：文章里写的是 "experiments which anyone might repeat and verify"，验得出便无须辩，验不出也辩不了；何况两人各写一种语言，误译一层套一层，争起来没完——Nollet 有一整封信就是建在译错的字上的。于是他决定把时间花在做新实验上。
  - id: bf-ch-18-s3
    text: Dr. Wright, an English physician, when at Paris, wrote to a friend, who was of the Royal Society, an account of the high esteem my experiments were in among the learned abroad, and of their wonder that my writings had been so little noticed in England. The society, on this, resumed the consideration of the letters that had been read to them; and the celebrated Dr. Watson drew up a summary account of them, and of all I had afterwards sent to England on the subject, which he accompanied with some praise of the writer. This summary was then printed in their Transactions; and some members of the society in London, particularly the very ingenious Mr. Canton, having verified the experiment of procuring lightning from the clouds by a pointed rod, and acquainting them with the success, they soon made me more than amends for the slight with which they had before treated me. Without my having made any application for that honour, they chose me a member, and voted that I should be excused the customary payments, which would have amounted to twenty-five guineas; and ever since have given me their Transactions gratis. They also presented me with the gold medal of Sir Godfrey Copley for the year 1753, the delivery of which was accompanied by a very handsome speech of the president, Lord Macclesfield, wherein I was highly honoured.
    checkIn:
      id: bf-ch-18-s3-c1
      stem: What did the Royal Society do once the rod experiment was verified?
      options:
        - They put him at the head of a new committee on electricity
        - They bought the right to print his letters on the continent
        - They elected him, waived the fees, and gave him the Copley medal
        - They paid for a lightning rod to be set on St. Paul's
      correctIndex: 2
      explanationZh: 他一句话没求过，学会 "chose me a member, and voted that I should be excused the customary payments, which would have amounted to twenty-five guineas"，此后 Transactions 一直免费寄给他，还把 1753 年度的 Copley 金质奖章授予了他，会长 Macclesfield 勋爵为此说了一番极体面的话。
quiz:
  - id: bf-ch-18-q1
    stem: What first turned Franklin toward electricity?
    options:
      - Collinson's present of a glass tube to the library company
      - Dr. Spence's electric experiments, seen at Boston in 1746
      - A paid lecture course got up by Mr. Kinnersley
      - A pamphlet out of Paris passed on by Dr. Fothergill
    correctIndex: 1
    explanationZh: 原文是 "In 1746, being at Boston, I met there with a Dr. Spence, who was lately arrived from Scotland, and showed me some electric experiments." 那些实验做得并不利落，可题目对他全然新鲜，看得他又惊又喜。Collinson 送来玻璃管，是他回费城以后的事。
  - id: bf-ch-18-q2
    stem: How did Franklin set Kinnersley up to make money by the experiments?
    options:
      - He lent him an apparatus bought from London makers
      - He got him a standing place at the library company
      - He paid him wages to keep the tubes in order
      - He drew up two lectures, the experiments set in order
    correctIndex: 3
    explanationZh: 他替这位失业的邻居 "drew up for him two lectures, in which the experiments were ranged in such order, and accompanied with such explanations in such method, as that the foregoing should assist in comprehending the following"。那套讲究的仪器是 Kinnersley 自己置办的——把富兰克林随手做的粗东西请匠人重做了一遍。
  - id: bf-ch-18-q3
    stem: How were the letters taken when first read at the Royal Society?
    options:
      - They were sent straight back to Mr. Collinson unread
      - They were read, but not thought worth printing there
      - They were turned into French and printed within a month
      - They came out at once with a preface by Lord Macclesfield
    correctIndex: 1
    explanationZh: 它们 "were not at first thought worth so much notice as to be printed in their Transactions"；关于闪电与电同一性的那一篇，据说还被行家们笑过。是 Dr. Fothergill 觉得可惜，力主付印，最后由 Cave 印成小册子，Fothergill 写的序。
  - id: bf-ch-18-q4
    stem: How did the Abbé Nollet first take the French translation?
    options:
      - He took it for a forgery got up by his enemies at Paris
      - He repeated the experiments at once and owned them true
      - He crossed to Philadelphia to face Franklin himself
      - He got the king to keep the pamphlet out of France
    correctIndex: 0
    explanationZh: 他起先不信这样一部东西会出自美洲，"said it must have been fabricated by his enemies at Paris, to decry his system"。等人家告诉他费城真有富兰克林这么个人，他才写了一整卷信来为自己的学说辩护，并否认那些实验属实。
  - id: bf-ch-18-q5
    stem: What gave the book its sudden celebrity in Europe?
    options:
      - Nollet gave up his own theory of electricity in public
      - The Royal Society's award of the Copley gold medal
      - Kinnersley showed the experiments before the French court
      - Dalibard and De Lor drew lightning from the clouds at Marly
    correctIndex: 3
    explanationZh: 原文是 "What gave my book the more sudden and general celebrity, was the success of one of its proposed experiments, made by Messrs. Dalibard and De Lor at Marly, for drawing lightning from the clouds."。De Lor 把这套 Philadelphia Experiments 在国王和宫廷面前演过一回之后，巴黎的好奇人便都涌去看了。
  - id: bf-ch-18-q6
    stem: What made the Royal Society take up the letters again?
    options:
      - Franklin sailed to London and laid the case before them
      - Collinson threatened to give up his fellowship over it
      - Dr. Wright wrote from Paris of the esteem abroad
      - The French king wrote on his behalf
    correctIndex: 2
    explanationZh: 原文是 "Dr. Wright, an English physician, when at Paris, wrote to a friend, who was of the Royal Society, an account of the high esteem my experiments were in among the learned abroad, and of their wonder that my writings had been so little noticed in England."。学会由此重新审视，Watson 博士做了摘要，登进了 Transactions。

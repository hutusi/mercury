id: bf-ch-06
bookId: book-franklin
title: First Visit to London
titleZh: 初访伦敦
summaryZh: 他带着一纸信用状的许诺上了船——只是那封信始终没有到手。1724 年圣诞前一天，他在伦敦上岸，身上是十五枚皮斯托尔金币，和几封凭笔迹挑出来、来路不明的信。
sections:
  - id: bf-ch-06-s1
    text: |-
      The governor, seeming to like my company, had me frequently to his house, and his setting me up was always mentioned as a fixed thing. I was to take with me letters recommendatory to a number of his friends, besides the letter of credit to furnish me with the necessary money for purchasing the press and types, paper, etc. For these letters I was appointed to call at different times, when they were to be ready; but a future time was still named. Thus he went on till the ship, whose departure too had been several times postponed, was on the point of sailing. Then, when I called to take my leave and receive the letters, his secretary, Dr. Bard, came out to me and said the governor was extremely busy in writing, but would be down at Newcastle, before the ship, and there the letters would be delivered to me.

      Ralph, though married, and having one child, had determined to accompany me in this voyage. It was thought he intended to establish a correspondence, and obtain goods to sell on commission; but I found afterwards, that, through some discontent with his wife’s relations, he purposed to leave her on their hands, and never return again. Having taken leave of my friends, and interchanged some promises with Miss Read, I left Philadelphia in the ship, which anchored at Newcastle. The governor was there; but when I went to his lodging, the secretary came to me from him with the civillest message in the world, that he could not then see me, being engaged in business of the utmost importance, but should send the letters to me on board, wished me heartily a good voyage and a speedy return, etc. I returned on board a little puzzled, but still not doubting.

      Mr. Andrew Hamilton, a famous lawyer of Philadelphia, had taken passage in the same ship for himself and son, and with Mr. Denham, a Quaker merchant, and Messrs. Onion and Russel, masters of an iron work in Maryland, had engaged the great cabin; so that Ralph and I were forced to take up with a berth in the steerage, and none on board knowing us, were considered as ordinary persons. But Mr. Hamilton and his son (it was James, since governor) returned from Newcastle to Philadelphia, the father being recalled by a great fee to plead for a seized ship; and, just before we sailed, Colonel French coming on board, and showing me great respect, I was more taken notice of, and, with my friend Ralph, invited by the other gentlemen to come into the cabin, there being now room. Accordingly, we removed thither.
    checkIn:
      id: bf-ch-06-s1-c1
      stem: What word did the secretary bring when Franklin came for the letters?
      options:
        - That the letters had already gone ahead by post
        - That the governor was too ill to see anyone
        - That the venture was off and the credit withdrawn
        - That the governor would hand them over at Newcastle
      correctIndex: 3
      explanationZh: 船就要开了，他上门辞行取信，"his secretary, Dr. Bard, came out to me and said the governor was extremely busy in writing, but would be down at Newcastle, before the ship, and there the letters would be delivered to me"。到了纽卡斯尔，秘书又捎来一句同样客气的话，说信会送到船上。
  - id: bf-ch-06-s2
    text: |-
      Understanding that Colonel French had brought on board the governor’s despatches, I asked the captain for those letters that were to be under my care. He said all were put into the bag together and he could not then come at them; but, before we landed in England, I should have an opportunity of picking them out; so I was satisfied for the present, and we proceeded on our voyage. We had a sociable company in the cabin, and lived uncommonly well, having the addition of all Mr. Hamilton’s stores, who had laid in plentifully. In this passage Mr. Denham contracted a friendship for me that continued during his life. The voyage was otherwise not a pleasant one, as we had a great deal of bad weather.

      When we came into the Channel, the captain kept his word with me, and gave me an opportunity of examining the bag for the governor’s letters. I found none upon which my name was put as under my care. I picked out six or seven, that, by the handwriting, I thought might be the promised letters, especially as one of them was directed to Basket, the king’s printer, and another to some stationer. We arrived in London the 24th of December, 1724. I waited upon the stationer, who came first in my way, delivering the letter as from Governor Keith. “I don’t know such a person,” says he; but, opening the letter, “O! this is from Riddlesden. I have lately found him to be a complete rascal, and I will have nothing to do with him, nor receive any letters from him.” So, putting the letter into my hand, he turned on his heel and left me to serve some customer. I was surprised to find these were not the governor’s letters; and, after recollecting and comparing circumstances, I began to doubt his sincerity. I found my friend Denham, and opened the whole affair to him. He let me into Keith’s character; told me there was not the least probability that he had written any letters for me; that no one, who knew him, had the smallest dependence on him; and he laughed at the notion of the governor’s giving me a letter of credit, having, as he said, no credit to give. On my expressing some concern about what I should do, he advised me to endeavour getting some employment in the way of my business. “Among the printers here,” said he, “you will improve yourself, and when you return to America, you will set up to greater advantage.”
    checkIn:
      id: bf-ch-06-s2-c1
      stem: What did the London stationer say on opening the letter?
      options:
        - The letter turned out to be from Riddlesden, a known rascal
        - The letter proved to hold nothing but a blank sheet
        - The letter was a demand for an old shipping account
        - The letter was addressed to a rival printing house down the street
      correctIndex: 0
      explanationZh: 他把信当作 Keith 的送去，文具商拆开一看便说 "O! this is from Riddlesden. I have lately found him to be a complete rascal, and I will have nothing to do with him, nor receive any letters from him."，随即把信塞回他手里，转身招呼别的客人去了。
  - id: bf-ch-06-s3
    text: |-
      We both of us happened to know, as well as the stationer, that Riddlesden, the attorney, was a very knave. He had half ruined Miss Read’s father by persuading him to be bound for him. By this letter it appeared there was a secret scheme on foot to the prejudice of Hamilton (supposed to be then coming over with us); and that Keith was concerned in it with Riddlesden. Denham, who was a friend of Hamilton’s, thought he ought to be acquainted with it; so, when he arrived in England, which was soon after, partly from resentment and ill-will to Keith and Riddlesden, and partly from goodwill to him, I waited on him, and gave him the letter. He thanked me cordially, the information being of importance to him; and from that time he became my friend, greatly to my advantage afterwards on many occasions.

      But what shall we think of a governor’s playing such pitiful tricks, and imposing so grossly on a poor ignorant boy! It was a habit he had acquired. He wished to please everybody; and, having little to give, he gave expectations. He was otherwise an ingenious, sensible man, a pretty good writer, and a good governor for the people, though not for his constituents, the proprietaries, whose instructions he sometimes disregarded. Several of our best laws were of his planning and passed during his administration.

      Ralph and I were inseparable companions. We took lodgings together in Little Britain at three shillings and sixpence a week—as much as we could then afford. He found some relations, but they were poor, and unable to assist him. He now let me know his intentions of remaining in London, and that he never meant to return to Philadelphia. He had brought no money with him, the whole he could muster having been expended in paying his passage. I had fifteen pistoles; so he borrowed occasionally of me to subsist, while he was looking out for business. He first endeavoured to get into the playhouse, believing himself qualified for an actor; but Wilkes, to whom he applied, advised him candidly not to think of that employment, as it was impossible he should succeed in it. Then he proposed to Roberts, a publisher in Paternoster Row, to write for him a weekly paper like the Spectator, on certain conditions, which Roberts did not approve. Then he endeavoured to get employment as a hackney writer, to copy for the stationers and lawyers about the Temple, but could find no vacancy.
    checkIn:
      id: bf-ch-06-s3-c1
      stem: What did that letter turn out to disclose?
      options:
        - That Riddlesden had ruined Miss Read's father outright
        - That a scheme against Hamilton was afoot, with Keith in it
        - That Keith had drawn a letter of credit on a Bristol bank
        - That Hamilton had been recalled to plead for a seized ship
      correctIndex: 1
      explanationZh: 信里露出的是 "a secret scheme on foot to the prejudice of Hamilton (supposed to be then coming over with us); and that Keith was concerned in it with Riddlesden"。Denham 是 Hamilton 的朋友，主张该让他知道；Hamilton 收到信后诚恳道谢，此后一直是富兰克林的朋友。
  - id: bf-ch-06-s4
    text: |-
      I immediately got into work at Palmer’s, then a famous printing-house in Bartholomew Close, and here I continued near a year. I was pretty diligent, but spent with Ralph a good deal of my earnings in going to plays and other places of amusement. We had together consumed all my pistoles, and now just rubbed on from hand to mouth. He seemed quite to forget his wife and child, and I, by degrees, my engagements with Miss Read, to whom I never wrote more than one letter, and that was to let her know I was not likely soon to return. This was another of the great errata of my life, which I should wish to correct if I were to live it over again. In fact, by our expenses, I was constantly kept unable to pay my passage.

      At Palmer’s I was employed in composing for the second edition of Wollaston’s Religion of Nature. Some of his reasonings not appearing to me well founded, I wrote a little metaphysical piece in which I made remarks on them. It was entitled “A Dissertation on Liberty and Necessity, Pleasure and Pain.” I inscribed it to my friend Ralph; I printed a small number. It occasioned my being more considered by Mr. Palmer as a young man of some ingenuity, though he seriously expostulated with me upon the principles of my pamphlet, which to him appeared abominable. My printing this pamphlet was another erratum.

      While I lodged in Little Britain, I made an acquaintance with one Wilcox, a bookseller, whose shop was at the next door. He had an immense collection of secondhand books. Circulating libraries were not then in use; but we agreed that, on certain reasonable terms, which I have now forgotten, I might take, read, and return any of his books. This I esteemed a great advantage, and I made as much use of it as I could.

      My pamphlet by some means falling into the hands of one Lyons, a surgeon, author of a book entitled The Infallibility of Human Judgment, it occasioned an acquaintance between us. He took great notice of me, called on me often to converse on those subjects, carried me to the Horns, a pale alehouse in ⸻ Lane, Cheapside, and introduced me to Dr. Mandeville, author of the Fable of the Bees, who had a club there, of which he was the soul, being a most facetious, entertaining companion. Lyons, too, introduced me to Dr. Pemberton, at Batson’s Coffeehouse, who promised to give me an opportunity, sometime or other, of seeing Sir Isaac Newton, of which I was extremely desirous; but this never happened.
    checkIn:
      id: bf-ch-06-s4-c1
      stem: What arrangement did Franklin make with Wilcox the bookseller?
      options:
        - He was allowed the run of a circulating library for a fee
        - He bought secondhand books and resold them at a profit
        - He might take, read, and return any book in Wilcox's shop
        - He copied out whole volumes he could not afford to buy
      correctIndex: 2
      explanationZh: 隔壁 Wilcox 的旧书铺里堆着极多二手书，那时还没有流通图书馆，"we agreed that, on certain reasonable terms, which I have now forgotten, I might take, read, and return any of his books"。他说这是一桩大便宜，能用就尽量用。
  - id: bf-ch-06-s5
    text: |-
      I had brought over a few curiosities, among which the principal was a purse made of the asbestos, which purifies by fire. Sir Hans Sloane heard of it, came to see me, and invited me to his house in Bloomsbury Square, where he showed me all his curiosities, and persuaded me to let him add that to the number, for which he paid me handsomely.

      In our house there lodged a young woman, a milliner, who, I think, had a shop in the Cloisters. She had been genteelly bred, was sensible and lively, and of most pleasing conversation. Ralph read plays to her in the evenings, they grew intimate, she took another lodging, and he followed her. They lived together some time; but, he being still out of business, and her income not sufficient to maintain them with her child, he took a resolution of going from London, to try for a country school, which he thought himself well qualified to undertake, as he wrote an excellent hand, and was a master of arithmetic and accounts. This, however, he deemed a business below him, and confident of future better fortune, when he should be unwilling to have it known that he once was so meanly employed, he changed his name, and did me the honour to assume mine; for I soon after had a letter from him, acquainting me that he was settled in a small village (in Berkshire, I think it was, where he taught reading and writing to ten or a dozen boys, at sixpence each per week), recommending Mrs. T⸺ to my care, and desiring me to write to him, directing for Mr. Franklin, schoolmaster, at such a place.

      He continued to write frequently, sending me large specimens of an epic poem which he was then composing, and desiring my remarks and corrections. These I gave him from time to time, but endeavored rather to discourage his proceeding. One of Young’s Satires was then just published. I copied and sent him a great part of it, which set in a strong light the folly of pursuing the Muses with any hope of advancement by them. All was in vain; sheets of the poem continued to come by every post. In the meantime, Mrs. T⸺, having on his account lost her friends and business, was often in distresses, and used to send for me and borrow what I could spare to help her out of them. I grew fond of her company, and, being at that time under no religious restraint, and presuming upon my importance to her, I attempted familiarities (another erratum) which she repulsed with a proper resentment, and acquainted him with my behaviour. This made a breach between us; and, when he returned again to London, he let me know he thought I had cancelled all the obligations he had been under to me. So I found I was never to expect his repaying me what I lent to him or advanced for him. This, however, was not then of much consequence, as he was totally unable; and in the loss of his friendship I found myself relieved from a burden. I now began to think of getting a little money beforehand, and, expecting better work, I left Palmer’s to work at Watts’s, near Lincoln’s Inn Fields, a still greater printing-house. Here I continued all the rest of my stay in London.
    checkIn:
      id: bf-ch-06-s5-c1
      stem: Why did Ralph take Franklin's name in the country?
      options:
        - To keep out of the way of the men he owed money to in London
        - To publish his epic poem under a borrowed name
        - To keep his wife's relations from tracing him
        - So that his time as a village schoolmaster stayed hidden
      correctIndex: 3
      explanationZh: 教几个孩子读书写字在他看来掉了身价，"confident of future better fortune, when he should be unwilling to have it known that he once was so meanly employed, he changed his name, and did me the honour to assume mine"。此后来信都要富兰克林写给 Mr. Franklin, schoolmaster。
  - id: bf-ch-06-s6
    text: |-
      At my first admission into this printing-house I took to working at press, imagining I felt a want of the bodily exercise I had been used to in America, where presswork is mixed with composing. I drank only water; the other workmen, near fifty in number, were great guzzlers of beer. On occasion, I carried up and down stairs a large form of types in each hand, when others carried but one in both hands. They wondered to see, from this and several instances, that the “Water-American,” as they called me, was stronger than themselves, who drank strong beer! We had an alehouse boy who attended always in the house to supply the workmen. My companion at the press drank every day a pint before breakfast, a pint at breakfast with his bread and cheese, a pint between breakfast and dinner, a pint at dinner, a pint in the afternoon about six o’clock, and another when he had done his day’s work. I thought it a detestable custom; but it was necessary, he supposed, to drink strong beer, that he might be strong to labour. I endeavoured to convince him that the bodily strength afforded by beer could only be in proportion to the grain or flour of the barley dissolved in the water of which it was made; that there was more flour in a pennyworth of bread; and therefore, if he would eat that with a pint of water, it would give him more strength than a quart of beer. He drank on, however, and had four or five shillings to pay out of his wages every Saturday night for that muddling liquor; an expense I was free from. And thus these poor devils keep themselves always under.

      Watts, after some weeks, desiring to have me in the composing-room, I left the pressmen; a new bien venu or sum for drink, being five shillings, was demanded of me by the compositors. I thought it an imposition, as I had paid below; the master thought so too, and forbade my paying it. I stood out two or three weeks, was accordingly considered as an excommunicate, and had so many little pieces of private mischief done me, by mixing my sorts, transposing my pages, breaking my matter, etc., etc., if I were ever so little out of the room, and all ascribed to the chapel ghost, which they said ever haunted those not regularly admitted, that, notwithstanding the master’s protection, I found myself obliged to comply and pay the money, convinced of the folly of being on ill terms with those one is to live with continually.
    checkIn:
      id: bf-ch-06-s6-c1
      stem: What did the compositors do while Franklin held out on the bien venu?
      options:
        - They shut him out of the composing room every morning
        - They spoiled his work and laid it to the chapel ghost
        - They went to Watts and demanded he be turned off
        - They kept every case and tool in the room from him
      correctIndex: 1
      explanationZh: 他觉得楼下已交过一回，这五先令是敲竹杠，老板也这么想，还下令不许他付。于是他被当成 excommunicate——只要一离开屋子，就有人 "mixing my sorts, transposing my pages, breaking my matter"，一概推给据说专缠不入伙者的 chapel ghost。两三周后他还是交了钱，明白了跟朝夕相处的人过不去是件蠢事。
  - id: bf-ch-06-s7
    text: |-
      I was now on a fair footing with them, and soon acquired considerable influence. I proposed some reasonable alterations in their chapel laws, and carried them against all opposition. From my example, a great part of them left their muddling breakfast of beer, and bread, and cheese, finding they could with me be supplied from a neighbouring house with a large porringer of hot water-gruel, sprinkled with pepper, crumbed with bread, and a bit of butter in it, for the price of a pint of beer, viz., three halfpence. This was a more comfortable as well as cheaper breakfast, and keep their heads clearer. Those who continued sotting with beer all day, were often, by not paying, out of credit at the alehouse, and used to make interest with me to get beer; their “light,” as they phrased it, “being out.” I watched the pay-table on Saturday night, and collected what I stood engaged for them, having to pay sometimes near thirty shillings a week on their accounts. This, and my being esteemed a pretty good riggite, that is, a jocular verbal satirist, supported my consequence in the society. My constant attendance (I never making a St. Monday) recommended me to the master; and my uncommon quickness at composing occasioned my being put upon all work of dispatch, which was generally better paid. So I went on now very agreeably.

      My lodging in Little Britain being too remote, I found another in Duke-street, opposite to the Romish Chapel. It was two pair of stairs backwards, at an Italian warehouse. A widow lady kept the house; she had a daughter, and a maid servant, and a journeyman who attended the warehouse, but lodged abroad. After sending to inquire my character at the house where I last lodged she agreed to take me in at the same rate, 3s. 6d. per week; cheaper, as she said, from the protection she expected in having a man lodge in the house. She was a widow, an elderly woman; had been bred a Protestant, being a clergyman’s daughter, but was converted to the Catholic religion by her husband, whose memory she much revered; had lived much among people of distinction, and knew a thousand anecdotes of them as far back as the times of Charles the Second. She was lame in her knees with the gout, and, therefore, seldom stirred out of her room, so sometimes wanted company; and hers was so highly amusing to me, that I was sure to spend an evening with her whenever she desired it. Our supper was only half an anchovy each, on a very little strip of bread and butter, and half a pint of ale between us; but the entertainment was in her conversation. My always keeping good hours, and giving little trouble in the family, made her unwilling to part with me, so that, when I talked of a lodging I had heard of, nearer my business, for two shillings a week, which, intent as I now was on saving money, made some difference, she bid me not think of it, for she would abate me two shillings a week for the future; so I remained with her at one shilling and sixpence as long as I stayed in London.
    checkIn:
      id: bf-ch-06-s7-c1
      stem: What breakfast did Franklin get part of the shop to change to?
      options:
        - Cold porridge with dried fruit and a little cream
        - Oatcakes and a small cup of hot tea, at a penny
        - Hot water-gruel, crumbed with bread and peppered
        - Boiled eggs and a slice of toast, at three halfpence
      correctIndex: 2
      explanationZh: 他带头把啤酒配面包奶酪的早饭换成邻家买来的 "a large porringer of hot water-gruel, sprinkled with pepper, crumbed with bread, and a bit of butter in it"，价钱和一品脱啤酒一样是三个半便士，却更顶饿，脑子也更清楚。
  - id: bf-ch-06-s8
    text: |-
      In a garret of her house there lived a maiden lady of seventy, in the most retired manner, of whom my landlady gave me this account: that she was a Roman Catholic, had been sent abroad when young, and lodged in a nunnery with an intent of becoming a nun; but, the country not agreeing with her, she returned to England, where, there being no nunnery, she had vowed to lead the life of a nun, as near as might be done in those circumstances. Accordingly, she had given all her estate to charitable uses, reserving only twelve pounds a year to live on, and out of this sum she still gave a great deal in charity, living herself on water-gruel only, and using no fire but to boil it. She had lived many years in that garret, being permitted to remain there gratis by successive Catholic tenants of the house below, as they deemed it a blessing to have her there. A priest visited her to confess her every day. “I have asked her,” says my landlady, “how she, as she lived, could possibly find so much employment for a confessor?” “Oh,” said she, “it is impossible to avoid vain thoughts.” I was permitted once to visit her. She was cheerful and polite, and conversed pleasantly. The room was clean, but had no other furniture than a mattress, a table with a crucifix and book, a stool which she gave me to sit on, and a picture over the chimney of Saint Veronica displaying her handkerchief, with the miraculous figure of Christ’s bleeding face on it, which she explained to me with great seriousness. She looked pale, but was never sick; and I give it as another instance on how small an income, life and health may be supported.

      At Watts’s printing-house I contracted an acquaintance with an ingenious young man, one Wygate, who, having wealthy relations, had been better educated than most printers; was a tolerable Latinist, spoke French, and loved reading. I taught him and a friend of his to swim at twice going into the river, and they soon became good swimmers. They introduced me to some gentlemen from the country, who went to Chelsea by water to see the College and Don Saltero’s curiosities. In our return, at the request of the company, whose curiosity Wygate had excited, I stripped and leaped into the river, and swam from near Chelsea to Blackfriar’s, performing on the way many feats of activity, both upon and under water, that surprised and pleased those to whom they were novelties.
    checkIn:
      id: bf-ch-06-s8-c1
      stem: How did the old lady in the garret live?
      options:
        - On twelve pounds a year, eating only water-gruel
        - On alms collected for her by the Romish Chapel
        - On what she earned embroidering priests' vestments
        - On an annuity her late husband had settled on her
      correctIndex: 0
      explanationZh: 她把全部产业捐作慈善，"reserving only twelve pounds a year to live on"，从这十二镑里还要施舍出去不少，自己则 "living herself on water-gruel only, and using no fire but to boil it"。楼下历任天主教房客都乐意让她白住那间阁楼，觉得有她在是福气。
  - id: bf-ch-06-s9
    text: |-
      I had from a child been ever delighted with this exercise, had studied and practised all Thevenot’s motions and positions, added some of my own, aiming at the graceful and easy as well as the useful. All these I took this occasion of exhibiting to the company, and was much flattered by their admiration; and Wygate, who was desirous of becoming a master, grew more and more attached to me on that account, as well as from the similarity of our studies. He at length proposed to me traveling all over Europe together, supporting ourselves everywhere by working at our business. I was once inclined to it; but, mentioning it to my good friend Mr. Denham, with whom I often spent an hour when I had leisure, he dissuaded me from it, advising me to think only of returning to Pennsylvania, which he was now about to do.

      I must record one trait of this good man’s character. He had formerly been in business at Bristol, but failed in debt to a number of people, compounded and went to America. There, by a close application to business as a merchant, he acquired a plentiful fortune in a few years. Returning to England in the ship with me, he invited his old creditors to an entertainment, at which he thanked them for the easy composition they had favoured him with, and, when they expected nothing but the treat, every man at the first remove found under his plate an order on a banker for the full amount of the unpaid remainder with interest.

      He now told me he was about to return to Philadelphia, and should carry over a great quantity of goods in order to open a store there. He proposed to take me over as his clerk, to keep his books, in which he would instruct me, copy his letters, and attend the store. He added, that, as soon as I should be acquainted with mercantile business, he would promote me by sending me with a cargo of flour and bread, etc., to the West Indies, and procure me commissions from others which would be profitable; and, if I managed well, would establish me handsomely. The thing pleased me; for I was grown tired of London, remembered with pleasure the happy months I had spent in Pennsylvania, and wished again to see it; therefore I immediately agreed on the terms of fifty pounds a year, Pennsylvania money; less, indeed, than my present gettings as a compositor, but affording a better prospect.
    checkIn:
      id: bf-ch-06-s9-c1
      stem: What did Wygate at length propose to Franklin?
      options:
        - To open a printing house together in an Italian town
        - To travel over Europe, working at the trade as they went
        - To go out to the West Indies and set up as merchants
        - To bring out a weekly paper in London on shares
      correctIndex: 1
      explanationZh: Wygate 一心想练成游泳好手，又和他趣味相投，越发亲近，最后提出 "traveling all over Europe together, supporting ourselves everywhere by working at our business"。富兰克林一度动了心。
  - id: bf-ch-06-s10
    text: |-
      I now took leave of printing, as I thought, forever, and was daily employed in my new business, going about with Mr. Denham among the tradesmen to purchase various articles, and seeing them packed up, doing errands, calling upon workmen to dispatch, etc.; and, when all was on board, I had a few days’ leisure. On one of these days, I was, to my surprise, sent for by a great man I knew only by name, a Sir William Wyndham, and I waited upon him. He had heard by some means or other of my swimming from Chelsea to Blackfriars, and of my teaching Wygate and another young man to swim in a few hours. He had two sons, about to set out on their travels; he wished to have them first taught swimming, and proposed to gratify me handsomely if I would teach them. They were not yet come to town, and my stay was uncertain, so I could not undertake it; but, from this incident, I thought it likely that, if I were to remain in England and open a swimming-school, I might get a good deal of money; and it struck me so strongly, that, had the overture been sooner made me, probably I should not so soon have returned to America. After many years, you and I had something of more importance to do with one of these sons of Sir William Wyndham, become Earl of Egremont, which I shall mention in its place.

      Thus I spent about eighteen months in London; most part of the time I worked hard at my business, and spent but little upon myself except in seeing plays and in books. My friend Ralph had kept me poor; he owed me about twenty-seven pounds, which I was now never likely to receive; a great sum out of my small earnings! I loved him, notwithstanding, for he had many amiable qualities. I had by no means improved my fortune; but I had picked up some very ingenious acquaintance, whose conversation was of great advantage to me; and I had read considerably.
    checkIn:
      id: bf-ch-06-s10-c1
      stem: What did Sir William Wyndham send for Franklin to do?
      options:
        - To coach his two sons in Latin before they went up
        - To find them places at Watts's printing-house
        - To show them the curiosities at Don Saltero's
        - To teach his two sons to swim before they set out
      correctIndex: 3
      explanationZh: 他听说了那次从切尔西一路游到黑衣修士桥的事，也听说富兰克林两趟就把两个人教会了游泳，"He had two sons, about to set out on their travels; he wished to have them first taught swimming, and proposed to gratify me handsomely if I would teach them"。可惜孩子还没进城，他自己的行期又不定，只好作罢。
quiz:
  - id: bf-ch-06-q1
    stem: What was Ralph's real object in taking the voyage?
    options:
      - He meant to leave his wife on her relations and never return
      - He had a commission trade already arranged with London houses
      - He was going over to read law under a London attorney
      - He hoped to make peace with his wife's family in England
    correctIndex: 0
    explanationZh: 旁人以为他是去建立代销关系、批货回来卖，"but I found afterwards, that, through some discontent with his wife's relations, he purposed to leave her on their hands, and never return again"。他连船费都是把身上所有的钱凑出来的，到伦敦时一文不剩。
  - id: bf-ch-06-q2
    stem: What broke the friendship between Franklin and Ralph?
    options:
      - Franklin sent him Young's satire on chasing the Muses
      - Franklin refused to read any more of the epic poem
      - Franklin made advances to Mrs. T—, and she told Ralph
      - Franklin pressed him for the twenty-seven pounds owed
    correctIndex: 2
    explanationZh: Mrs. T— 为 Ralph 丢了朋友和生意，常打发人来借钱。富兰克林仗着自己对她有用，"attempted familiarities (another erratum) which she repulsed with a proper resentment, and acquainted him with my behaviour"。Ralph 回伦敦后便说，从前欠他的情分就此一笔勾销。
  - id: bf-ch-06-q3
    stem: What did Sir Hans Sloane get Franklin to part with?
    options:
      - A set of copper plates of American birds
      - A parcel of Boston pamphlets on the public affairs
      - An Indian wampum belt out of Pennsylvania
      - A purse made of asbestos, which purifies by fire
    correctIndex: 3
    explanationZh: 他从美洲带了几样稀罕东西，其中最要紧的是 "a purse made of the asbestos, which purifies by fire"。Sir Hans Sloane 听说后专程来看，请他到 Bloomsbury Square 的家中参观全部收藏，末了把这只钱包也收了进去，"for which he paid me handsomely"。
  - id: bf-ch-06-q4
    stem: How did Denham deal with his old Bristol creditors?
    options:
      - He feasted his old creditors and paid every debt in full
      - He burned the old bills and account books in front of them
      - He sued those who had refused him a composition
      - He printed a public apology in the Bristol paper
    correctIndex: 0
    explanationZh: 他早年在布里斯托尔亏空，与债主折价了结后去了美洲，几年间靠经商发了财。回英国后他请旧债主赴宴，先谢过当年的宽容，众人只当是吃一顿饭——"every man at the first remove found under his plate an order on a banker for the full amount of the unpaid remainder with interest"。
  - id: bf-ch-06-q5
    stem: What did Denham urge Franklin to do instead?
    options:
      - To stay on at Watts's and save what he could
      - To go home to Pennsylvania as Denham's clerk
      - To take up Wyndham's offer and teach swimming
      - To set up a printing house of his own in London
    correctIndex: 1
    explanationZh: 听他说起游历欧洲的打算，Denham "dissuaded me from it, advising me to think only of returning to Pennsylvania"，随即提出带他回去管账、抄信、看铺子，年薪五十镑宾州币——比排字的收入还少些，前景却好得多。
  - id: bf-ch-06-q6
    stem: What did Franklin count as another erratum while at Palmer's?
    options:
      - He gave up a standing contract with Palmer for better wages
      - He brought out a satire on the master of the printing-house
      - He printed a metaphysical pamphlet Palmer called abominable
      - He refused to set a religious book he did not believe in
    correctIndex: 2
    explanationZh: 他在 Palmer 处排 Wollaston 的《自然宗教》第二版，觉得其中几处推论站不住脚，便写了一篇 "A Dissertation on Liberty and Necessity, Pleasure and Pain"，自印了少量。Palmer 由此高看他的机敏，却也郑重责备那些原则；他自己的判词是 "My printing this pamphlet was another erratum."。

id: bf-ch-09
bookId: book-franklin
title: Plan for Attaining Moral Perfection
titleZh: 达到道德完善的计划
summaryZh: 他给自己出了个大题目——一辈子不犯一次错。可他很快发现，明白什么对什么错远远不够：防住这一样，另一样就趁着走神冒出来；习惯占了疏忽的便宜，性子有时又压过道理。于是他动手做了一本小册子。
sections:
  - id: bf-ch-09-s1
    text: |-
      It was about this time I conceived the bold and arduous project of arriving at moral perfection. I wished to live without committing any fault at any time; I would conquer all that either natural inclination, custom, or company might lead me into. As I knew, or thought I knew, what was right and wrong, I did not see why I might not always do the one and avoid the other. But I soon found I had undertaken a task of more difficulty than I had imagined. While my care was employed in guarding against one fault, I was often surprised by another; habit took the advantage of inattention; inclination was sometimes too strong for reason. I concluded, at length, that the mere speculative conviction that it was our interest to be completely virtuous, was not sufficient to prevent our slipping; and that the contrary habits must be broken, and good ones acquired and established, before we can have any dependence on a steady, uniform rectitude of conduct. For this purpose I therefore contrived the following method.

      In the various enumerations of the moral virtues I had met with in my reading, I found the catalogue more or less numerous, as different writers included more or fewer ideas under the same name. Temperance, for example, was by some confined to eating and drinking, while by others it was extended to mean the moderating every other pleasure, appetite, inclination, or passion, bodily or mental, even to our avarice and ambition. I proposed to myself, for the sake of clearness, to use rather more names, with fewer ideas annexed to each, than a few names with more ideas; and I included under thirteen names of virtues all that at that time occurred to me as necessary or desirable, and annexed to each a short precept, which fully expressed the extent I gave to its meaning.

      These names of virtues, with their precepts, were:

      1. Temperance. Eat not to dullness; drink not to elevation.

      2. Silence. Speak not but what may benefit others or yourself; avoid trifling conversation.

      3. Order. Let all your things have their places; let each part of your business have its time.

      4. Resolution. Resolve to perform what you ought; perform without fail what you resolve.

      5. Frugality. Make no expense but to do good to others or yourself; i.e., waste nothing.

      6. Industry. Lose no time; be always employed in something useful; cut off all unnecessary actions.

      7. Sincerity. Use no hurtful deceit; think innocently and justly; and, if you speak, speak accordingly.

      8. Justice. Wrong none by doing injuries, or omitting the benefits that are your duty.

      9. Moderation. Avoid extremes; forbear resenting injuries so much as you think they deserve.

      10. Cleanliness. Tolerate no uncleanliness in body, clothes, or habitation.

      11. Tranquillity. Be not disturbed at trifles, or at accidents common or unavoidable.

      12. Chastity.

      13. Humility. Imitate Jesus and Socrates.

      My intention being to acquire the habitude of all these virtues, I judged it would be well not to distract my attention by attempting the whole at once, but to fix it on one of them at a time; and, when I should be master of that, then to proceed to another, and so on, till I should have gone through the thirteen; and, as the previous acquisition of some might facilitate the acquisition of certain others, I arranged them with that view, as they stand above. Temperance first, as it tends to procure that coolness and clearness of head, which is so necessary where constant vigilance was to be kept up, and guard maintained against the unremitting attraction of ancient habits, and the force of perpetual temptations. This being acquired and established, Silence would be more easy; and my desire being to gain knowledge at the same time that I improved in virtue, and considering that in conversation it was obtained rather by the use of the ears than of the tongue, and therefore wishing to break a habit I was getting into of prattling, punning, and joking, which only made me acceptable to trifling company, I gave Silence the second place. This and the next, Order, I expected would allow me more time for attending to my project and my studies. Resolution, once become habitual, would keep me firm in my endeavours to obtain all the subsequent virtues; Frugality and Industry freeing me from my remaining debt, and producing affluence and independence, would make more easy the practice of Sincerity and Justice, etc., etc. Conceiving then, that, agreeably to the advice of Pythagoras in his Golden Verses, daily examination would be necessary, I contrived the following method for conducting that examination.
    checkIn:
      id: bf-ch-09-s1-c1
      stem: Why did Temperance stand first in the order of the thirteen?
      options:
        - Because it frees a man from debt and brings independence
        - Because it keeps him firm in all his later endeavours
        - Because it procures the coolness of head vigilance needs
        - Because it leaves him more time for his studies
      correctIndex: 2
      explanationZh: 他把节制排在最前，因为它 "tends to procure that coolness and clearness of head, which is so necessary where constant vigilance was to be kept up"。还清债务靠的是节俭与勤勉，撑住后续努力靠果断，腾出时间靠沉默与条理——各有各的位置。
  - id: bf-ch-09-s2
    text: |-
      I made a little book, in which I allotted a page for each of the virtues. I ruled each page with red ink, so as to have seven columns, one for each day of the week, marking each column with a letter for the day. I crossed these columns with thirteen red lines, marking the beginning of each line with the first letter of one of the virtues, on which line, and in its proper column, I might mark, by a little black spot, every fault I found upon examination to have been committed respecting that virtue upon that day.

      Form of the pages.

      Temperance

      Eat not to dullness Drink not to elevation

      I determined to give a week’s strict attention to each of the virtues successively. Thus, in the first week, my great guard was to avoid every the least offense against Temperance, leaving the other virtues to their ordinary chance, only marking every evening the faults of the day. Thus, if in the first week I could keep my first line, marked T, clear of spots, I supposed the habit of that virtue so much strengthened, and its opposite weakened, that I might venture extending my attention to include the next, and for the following week keep both lines clear of spots. Proceeding thus to the last, I could go through a course complete in thirteen weeks, and four courses in a year. And like him who, having a garden to weed, does not attempt to eradicate all the bad herbs at once, which would exceed his reach and his strength, but works on one of the beds at a time, and, having accomplished the first, proceeds to a second, so I should have, I hoped, the encouraging pleasure of seeing on my pages the progress I made in virtue, by clearing successively my lines of their spots, till in the end, by a number of courses, I should be happy in viewing a clean book, after a thirteen weeks’ daily examination.

      This my little book had for its motto these lines from Addison’s Cato:

      “Here will I hold. If there’s a power above us (And that there is, all nature cries aloud Thro’ all her works), He must delight in virtue; And that which he delights in must be happy.”
    checkIn:
      id: bf-ch-09-s2-c1
      stem: How long did one complete course through the thirteen take?
      options:
        - Seven weeks, so seven courses could be run in a year
        - Thirteen weeks, so four courses could be run in a year
        - Twenty-six weeks, so two courses could be run in a year
        - Fifty-two weeks, so one course could be run in a year
      correctIndex: 1
      explanationZh: 他每周只死守一项，其余听其自然，只在每晚记下当天的过失；这样 "I could go through a course complete in thirteen weeks, and four courses in a year"。他把这比作除草——不指望一次拔光，先收拾一畦，再收拾第二畦。
  - id: bf-ch-09-s3
    text: |-
      Another from Cicero,

      “O vitae Philosophia dux! O virtutum indagatrix expultrixque vitiorum! Unus dies, bene et ex praeceptis tuis actus, peccanti immortalitati est anteponendus.”

      Another from the Proverbs of Solomon, speaking of wisdom or virtue:

      “Length of days is in her right hand, and in her left hand riches and honour. Her ways are ways of pleasantness, and all her paths are peace.”

      And conceiving God to be the fountain of wisdom, I thought it right and necessary to solicit his assistance for obtaining it; to this end I formed the following little prayer, which was prefixed to my tables of examination, for daily use.

      “O powerful Goodness! bountiful Father! merciful Guide! Increase in me that wisdom which discovers my truest interest. Strengthen my resolutions to perform what that wisdom dictates. Accept my kind offices to thy other children as the only return in my power for thy continual favours to me.”

      I used also sometimes a little prayer which I took from Thomson’s Poems, viz.:

      “Father of light and life, thou Good Supreme! O teach me what is good; teach me Thyself! Save me from folly, vanity, and vice, From every low pursuit; and fill my soul With knowledge, conscious peace, and virtue pure; Sacred, substantial, never-fading bliss!”

      The precept of Order requiring that every part of my business should have its allotted time, one page in my little book contained the following scheme of employment for the twenty-four hours of a natural day.

      The Morning. Question. What good shall I do this day? 5 Rise, wash, and address Powerful Goodness! Contrive day’s business, and take the resolution of the day: prosecute the present study, and breakfast.

      8 Work.

      Noon. 12 Read, or overlook my accounts, and dine.

      2 Work.

      Evening. Question. What good have I done today? 6 Put things in their places. Supper. Music or diversion, or conversation. Examination of the day.

      Night. 10 Sleep.

      I entered upon the execution of this plan for self-examination, and continued it with occasional intermissions for some time. I was surprised to find myself so much fuller of faults than I had imagined; but I had the satisfaction of seeing them diminish. To avoid the trouble of renewing now and then my little book, which, by scraping out the marks on the paper of old faults to make room for new ones in a new course, became full of holes, I transferred my tables and precepts to the ivory leaves of a memorandum book, on which the lines were drawn with red ink, that made a durable stain, and on those lines I marked my faults with a black-lead pencil, which marks I could easily wipe out with a wet sponge. After a while I went through one course only in a year, and afterward only one in several years, till at length I omitted them entirely, being employed in voyages and business abroad, with a multiplicity of affairs that interfered; but I always carried my little book with me.
    checkIn:
      id: bf-ch-09-s3-c1
      stem: What two questions stood at the head of his daily scheme?
      options:
        - What good shall I do this day, and what good have I done
        - What faults must I guard, and what faults did I mark
        - What debts must I pay, and what money have I taken in
        - What shall I study today, and what have I finished today
      correctIndex: 0
      explanationZh: 日程表上，早晨那一栏的问题是 "What good shall I do this day?"，傍晚那一栏是 "What good have I done today?"。中间排着五点起身、八点上工、十二点看账吃饭、两点再上工、六点归置东西并自省，十点睡觉。
  - id: bf-ch-09-s4
    text: My scheme of Order gave me the most trouble; and I found that, though it might be practicable where a man’s business was such as to leave him the disposition of his time, that of a journeyman printer, for instance, it was not possible to be exactly observed by a master, who must mix with the world, and often receive people of business at their own hours. Order, too, with regard to places for things, papers, etc., I found extremely difficult to acquire. I had not been early accustomed to it, and, having an exceeding good memory, I was not so sensible of the inconvenience attending want of method. This article, therefore, cost me so much painful attention, and my faults in it vexed me so much, and I made so little progress in amendment, and had such frequent relapses, that I was almost ready to give up the attempt, and content myself with a faulty character in that respect, like the man who, in buying an ax of a smith, my neighbour, desired to have the whole of its surface as bright as the edge. The smith consented to grind it bright for him if he would turn the wheel; he turned, while the smith pressed the broad face of the ax hard and heavily on the stone, which made the turning of it very fatiguing. The man came every now and then from the wheel to see how the work went on, and at length would take his ax as it was, without farther grinding. “No,” said the smith, “turn on, turn on; we shall have it bright by-and-by; as yet, it is only speckled.” “Yes,” says the man, “but I think I like a speckled ax best.” And I believe this may have been the case with many, who, having, for want of some such means as I employed, found the difficulty of obtaining good and breaking bad habits in other points of vice and virtue, have given up the struggle, and concluded that “a speckled ax was best”; for something, that pretended to be reason, was every now and then suggesting to me that such extreme nicety as I exacted of myself might be a kind of foppery in morals, which, if it were known, would make me ridiculous; that a perfect character might be attended with the inconvenience of being envied and hated; and that a benevolent man should allow a few faults in himself, to keep his friends in countenance.
    checkIn:
      id: bf-ch-09-s4-c1
      stem: What does the story of the man and the ax stand for?
      options:
        - That a smith should name his price before he starts
        - That grinding takes far more strength than one expects
        - That neighbours should never lend each other tools
        - That men give up and settle for a speckled character
      correctIndex: 3
      explanationZh: 那人转不动磨轮，最后说 "but I think I like a speckled ax best"。富兰克林拿这话比自己在条理一项上的败退，也比许多半途而废的人——总有个装作理性的声音在耳边说，对自己苛求到这个地步，说不定只是道德上的一种做作。
  - id: bf-ch-09-s5
    text: |-
      In truth, I found myself incorrigible with respect to Order; and now I am grown old, and my memory bad, I feel very sensibly the want of it. But, on the whole, though I never arrived at the perfection I had been so ambitious of obtaining, but fell far short of it, yet I was, by the endeavour, a better and a happier man than I otherwise should have been if I had not attempted it; as those who aim at perfect writing by imitating the engraved copies, though they never reach the wished-for excellence of those copies, their hand is mended by the endeavour, and is tolerable while it continues fair and legible.

      It may be well my posterity should be informed that to this little artifice, with the blessing of God, their ancestor owed the constant felicity of his life, down to his seventy-ninth year, in which this is written. What reverses may attend the remainder is in the hand of Providence; but, if they arrive, the reflection on past happiness enjoyed ought to help his bearing them with more resignation. To Temperance he ascribes his long-continued health, and what is still left to him of a good constitution; to Industry and Frugality, the early easiness of his circumstances and acquisition of his fortune, with all that knowledge that enabled him to be a useful citizen, and obtained for him some degree of reputation among the learned; to Sincerity and Justice, the confidence of his country, and the honorable employs it conferred upon him; and to the joint influence of the whole mass of the virtues, even in the imperfect state he was able to acquire them, all that evenness of temper, and that cheerfulness in conversation, which makes his company still sought for, and agreeable even to his younger acquaintance. I hope, therefore, that some of my descendants may follow the example and reap the benefit.

      It will be remarked that, though my scheme was not wholly without religion, there was in it no mark of any of the distinguishing tenets of any particular sect. I had purposely avoided them; for, being fully persuaded of the utility and excellency of my method, and that it might be serviceable to people in all religions, and intending some time or other to publish it, I would not have anything in it that should prejudice anyone, of any sect, against it. I purposed writing a little comment on each virtue, in which I would have shown the advantages of possessing it, and the mischiefs attending its opposite vice; and I should have called my book “The Art of Virtue,” because it would have shown the means and manner of obtaining virtue, which would have distinguished it from the mere exhortation to be good, that does not instruct and indicate the means, but is like the apostle’s man of verbal charity, who only without showing to the naked and hungry how or where they might get clothes or victuals, exhorted them to be fed and clothed.—James 2:15, 16.
    checkIn:
      id: bf-ch-09-s5-c1
      stem: What did Franklin purposely keep out of the whole scheme?
      options:
        - The mottoes he took from Addison, Cicero, and Solomon
        - The short precept annexed to each of the thirteen names
        - Any mark of the distinguishing tenets of a particular sect
        - The scheme of employment for the hours of the day
      correctIndex: 2
      explanationZh: 他写得很清楚——方案里 "there was in it no mark of any of the distinguishing tenets of any particular sect. I had purposely avoided them"，因为他打算日后出版，不愿任何教派的人一看就先有成见。格言、箴言、日程和逐条戒律，倒都留在书里。
  - id: bf-ch-09-s6
    text: |-
      But it so happened that my intention of writing and publishing this comment was never fulfilled. I did, indeed, from time to time, put down short hints of the sentiments, reasonings, etc., to be made use of in it, some of which I have still by me; but the necessary close attention to private business in the earlier part of my life, and public business since, have occasioned my postponing it; for, it being connected in my mind with a great and extensive project, that required the whole man to execute, and which an unforeseen succession of employs prevented my attending to, it has hitherto remained unfinished.

      In this piece it was my design to explain and enforce this doctrine, that vicious actions are not hurtful because they are forbidden, but forbidden because they are hurtful, the nature of man alone considered; that it was, therefore, everyone’s interest to be virtuous who wished to be happy even in this world; and I should, from this circumstance (there being always in the world a number of rich merchants, nobility, states, and princes, who have need of honest instruments for the management of their affairs, and such being so rare), have endeavoured to convince young persons that no qualities were so likely to make a poor man’s fortune as those of probity and integrity.

      My list of virtues contained at first but twelve; but a Quaker friend having kindly informed me that I was generally thought proud; that my pride showed itself frequently in conversation; that I was not content with being in the right when discussing any point, but was overbearing, and rather insolent, of which he convinced me by mentioning several instances; I determined endeavouring to cure myself, if I could, of this vice or folly among the rest, and I added Humility to my list, giving an extensive meaning to the word.

      I cannot boast of much success in acquiring the reality of this virtue, but I had a good deal with regard to the appearance of it. I made it a rule to forbear all direct contradiction to the sentiments of others, and all positive assertion of my own. I even forbid myself, agreeably to the old laws of our Junto, the use of every word or expression in the language that imported a fixed opinion, such as “certainly,” “undoubtedly,” etc., and I adopted, instead of them, “I conceive,” “I apprehend,” or “I imagine” a thing to be so or so; or it “so appears to me at present.” When another asserted something that I thought an error, I denied myself the pleasure of contradicting him abruptly, and of showing immediately some absurdity in his proposition; and in answering I began by observing that in certain cases or circumstances his opinion would be right, but in the present case there appeared or seemed to me some difference, etc. I soon found the advantage of this change in my manner; the conversations I engaged in went on more pleasantly. The modest way in which I proposed my opinions procured them a readier reception and less contradiction; I had less mortification when I was found to be in the wrong, and I more easily prevailed with others to give up their mistakes and join with me when I happened to be in the right.
    checkIn:
      id: bf-ch-09-s6-c1
      stem: What made Franklin add a thirteenth name to his list of twelve?
      options:
        - He read in Cicero that pride is the root of every vice
        - A Quaker friend told him he was generally thought proud
        - He found his book had one page more than he had virtues
        - He decided on a voyage that he had been too close with money
      correctIndex: 1
      explanationZh: 起初只有十二项。一位贵格会朋友好意提醒他，人家普遍觉得他骄傲，"that I was not content with being in the right when discussing any point, but was overbearing, and rather insolent"，还举了好几件事为证。他因此把 Humility 添了进去，并把这个词的意思放得很宽。
  - id: bf-ch-09-s7
    text: |-
      And this mode, which I at first put on with some violence to natural inclination, became at length so easy, and so habitual to me, that perhaps for these fifty years past no one has ever heard a dogmatical expression escape me. And to this habit (after my character of integrity) I think it principally owing that I had early so much weight with my fellow-citizens when I proposed new institutions, or alterations in the old, and so much influence in public councils when I became a member; for I was but a bad speaker, never eloquent, subject to much hesitation in my choice of words, hardly correct in language, and yet I generally carried my points.

      In reality, there is, perhaps, no one of our natural passions so hard to subdue as pride. Disguise it, struggle with it, beat it down, stifle it, mortify it as much as one pleases, it is still alive, and will every now and then peep out and show itself; you will see it, perhaps, often in this history; for, even if I could conceive that I had completely overcome it, I should probably be proud of my humility.

      [Thus far written at Passy, 1784.]

      [“I am now about to write at home, August, 1788, but cannot have the help expected from my papers, many of them being lost in the war. I have, however, found the following.”]

      Having mentioned a great and extensive project which I had conceived, it seems proper that some account should be here given of that project and its object. Its first rise in my mind appears in the following little paper, accidentally preserved, viz.:

      Observations on my reading history, in Library, May 19th, 1731.

      “That the great affairs of the world, the wars, revolutions, etc., are carried on and effected by parties.

      “That the view of these parties is their present general interest, or what they take to be such.

      “That the different views of these different parties occasion all confusion.

      “That while a party is carrying on a general design, each man has his particular private interest in view.

      “That as soon as a party has gained its general point, each member becomes intent upon his particular interest; which, thwarting others, breaks that party into divisions, and occasions more confusion.

      “That few in public affairs act from a mere view of the good of their country, whatever they may pretend; and, though their actings bring real good to their country, yet men primarily considered that their own and their country’s interest was united, and did not act from a principle of benevolence.
    checkIn:
      id: bf-ch-09-s7-c1
      stem: To what did Franklin chiefly credit his weight in public councils?
      options:
        - His reputation as an eloquent and elegant speaker
        - His readiness to point out an error the moment he saw it
        - His habit of proposing opinions without dogmatic assertion
        - His strict keeping of Order in every piece of public business
      correctIndex: 2
      explanationZh: 他自认是个 "bad speaker, never eloquent, subject to much hesitation in my choice of words"，可五十年来没人听他吐过一句武断的话。他说，除了正直的名声之外，主要就靠这个习惯，议事时才能 "generally carried my points"。
  - id: bf-ch-09-s8
    text: |-
      “That fewer still, in public affairs, act with a view to the good of mankind.

      “There seems to me at present to be great occasion for raising a United Party for Virtue, by forming the virtuous and good men of all nations into a regular body, to be governed by suitable good and wise rules, which good and wise men may probably be more unanimous in their obedience to, than common people are to common laws.

      “I at present think that whoever attempts this aright, and is well qualified, cannot fail of pleasing God, and of meeting with success.

      “B. F.”

      Revolving this project in my mind, as to be undertaken hereafter, when my circumstances should afford me the necessary leisure, I put down from time to time, on pieces of paper, such thoughts as occurred to me respecting it. Most of these are lost; but I find one purporting to be the substance of an intended creed, containing, as I thought, the essentials of every known religion, and being free of everything that might shock the professors of any religion. It is expressed in these words, viz.:

      “That there is one God, who made all things.

      “That he governs the world by his providence.

      “That he ought to be worshiped by adoration, prayer, and thanksgiving.

      “But that the most acceptable service of God is doing good to man.

      “That the soul is immortal.

      “And that God will certainly reward virtue and punish vice, either here or hereafter.”

      My ideas at that time were, that the sect should be begun and spread at first among young and single men only; that each person to be initiated should not only declare his assent to such creed, but should have exercised himself with the thirteen weeks’ examination and practice of the virtues, as in the beforementioned model; that the existence of such a society should be kept a secret, till it was become considerable, to prevent solicitations for the admission of improper persons, but that the members should each of them search among his acquaintance for ingenuous, well-disposed youths, to whom, with prudent caution, the scheme should be gradually communicated; that the members should engage to afford their advice, assistance, and support to each other in promoting one another’s interests, business, and advancement in life; that, for distinction, we should be called “The Society of the Free and Easy”: free, as being, by the general practice and habit of the virtues, free from the dominion of vice; and particularly by the practice of industry and frugality, free from debt, which exposes a man to confinement, and a species of slavery to his creditors.
    checkIn:
      id: bf-ch-09-s8-c1
      stem: What was the society in his paper to be called?
      options:
        - The Society of the Free and Easy
        - The United Party for Virtue and Wisdom
        - The Brotherhood of the Thirteen Virtues
        - The Order of the Spotless Page
      correctIndex: 0
      explanationZh: 他给这个设想中的团体取名 "The Society of the Free and Easy"——free 有两层意思：因养成美德的习惯而不受恶习支配，又因勤勉节俭而免于负债，不至于沦为债主手里的囚徒。
  - id: bf-ch-09-s9
    text: This is as much as I can now recollect of the project, except that I communicated it in part to two young men, who adopted it with some enthusiasm; but my then narrow circumstances, and the necessity I was under of sticking close to my business, occasioned my postponing the further prosecution of it at that time; and my multifarious occupations, public and private, induced me to continue postponing, so that it has been omitted till I have no longer strength or activity left sufficient for such an enterprise; though I am still of opinion that it was a practicable scheme, and might have been very useful, by forming a great number of good citizens; and I was not discouraged by the seeming magnitude of the undertaking, as I have always thought that one man of tolerable abilities may work great changes, and accomplish great affairs among mankind, if he first forms a good plan, and, cutting off all amusements or other employments that would divert his attention, makes the execution of that same plan his sole study and business.
    checkIn:
      id: bf-ch-09-s9-c1
      stem: What kept the great project from ever being carried out?
      options:
        - He came to think the whole scheme impracticable
        - No young man could be found to take it up with him
        - The creed offended professors of several religions
        - Narrow circumstances first, then a press of public business
      correctIndex: 3
      explanationZh: 他说 "my then narrow circumstances, and the necessity I was under of sticking close to my business, occasioned my postponing the further prosecution of it at that time"，此后公私事务纷至沓来，一推再推，直到再没有精力。他始终认为这计划可行——当年已有两个年轻人满怀热情地接受了它。
quiz:
  - id: bf-ch-09-q1
    stem: What doctrine was the unwritten Art of Virtue to have pressed?
    options:
      - That virtue is out of reach without divine grace to help
      - That temperance must be mastered before the rest are defined
      - That moral perfection asks a man to withdraw from company
      - That vicious actions are forbidden because they are hurtful
    correctIndex: 3
    explanationZh: 他要讲的道理是 "vicious actions are not hurtful because they are forbidden, but forbidden because they are hurtful, the nature of man alone considered"，由此推出：凡想在这世上过得快活的人，本身就该做个有德之人。他还打算劝年轻人，穷人发家最靠得住的本钱是 probity 和 integrity。
  - id: bf-ch-09-q2
    stem: How was a fault entered in the little book?
    options:
      - A red check beside each virtue he had kept that day
      - A little black spot on the virtue's line, in that day's column
      - A pencilled note giving the circumstances of the offence
      - A small circle drawn through the letter of the virtue
    correctIndex: 1
    explanationZh: 每页用红墨水划出七栏（一天一栏）和十三条横线（一项美德一条），"I might mark, by a little black spot, every fault I found upon examination to have been committed respecting that virtue upon that day"。
  - id: bf-ch-09-q3
    stem: Why did Franklin move his tables onto ivory leaves?
    options:
      - The paper had gone full of holes from scraping out old marks
      - The red ink had spilled and ruined every page in the book
      - He left the paper book behind on a voyage and never got it back
      - A friend borrowed the book and never brought it back to him
    correctIndex: 0
    explanationZh: 每开一轮新课都要把旧痕刮掉腾地方，纸 "became full of holes"。于是他把表格和戒律搬到备忘录的象牙页上——红线用能留下印痕的墨水画，过失用黑铅笔点，湿海绵一抹就干净。
  - id: bf-ch-09-q4
    stem: Which virtue gave Franklin the most trouble of all?
    options:
      - Silence, which he found spoiled his conversation
      - Frugality, which his business made hard
      - Order, in his time and in his papers alike
      - Sincerity, which cost him several friendships
    correctIndex: 2
    explanationZh: 他说 "My scheme of Order gave me the most trouble"。排定时间这一层，对一个必须应酬来客的老板本就难办；给东西和纸张定位置更让他吃力，因为从小没养成这习惯，记性又太好，感觉不到没条理的麻烦。
  - id: bf-ch-09-q5
    stem: To which pair does Franklin credit his country's confidence in him?
    options:
      - Temperance and Industry
      - Frugality and Resolution
      - Order and Humility
      - Sincerity and Justice
    correctIndex: 3
    explanationZh: 他把功劳一项项分开算——"to Temperance he ascribes his long-continued health"；勤勉与节俭带来早年的宽裕和后来的家业；"to Sincerity and Justice, the confidence of his country, and the honorable employs it conferred upon him"；至于那份平和的脾气和谈吐间的愉快，则归给全部美德合在一起的作用。
  - id: bf-ch-09-q6
    stem: What rule did Franklin set himself against pride?
    options:
      - To speak only when a person of rank put a question to him
      - To forbear all flat contradiction and all positive assertion
      - To set aside a fixed part of his income for the poor every week
      - To do one act of public service every day without reward
    correctIndex: 1
    explanationZh: 规矩是 "to forbear all direct contradiction to the sentiments of others, and all positive assertion of my own"。他连 certainly、undoubtedly 这类词都禁了，一律换成 I conceive、I apprehend 或 it so appears to me at present；别人讲错了，他也先说在某些情形下这话是对的，再说眼下似乎稍有出入。

id: bf-ch-03
bookId: book-franklin
title: Arrival in Philadelphia
titleZh: 抵达费城
summaryZh: 富兰克林从纽约出发前往费城寻找印刷工作，途中遭遇暴风雨、发烧和步行长途跋涉等种种磨难。他几乎身无分文、衣衫褴褛地初到费城，凭借勤勉与节俭逐渐站稳脚跟，却因一封信件而面临是否返回波士顿的抉择。
sections:
  - id: bf-ch-03-s1
    text: |-
      My inclinations for the sea were by this time worn out, or I might now have gratified them. But, having a trade, and supposing myself a pretty good workman, I offered my service to the printer in the place, old Mr. William Bradford, who had been the first printer in Pennsylvania, but removed from thence upon the quarrel of George Keith. He could give me no employment, having little to do, and help enough already; but says he, “My son at Philadelphia has lately lost his principal hand, Aquilla Rose, by death; if you go thither, I believe he may employ you.” Philadelphia was a hundred miles further; I set out, however, in a boat for Amboy, leaving my chest and things to follow me round by sea.

      In crossing the bay, we met with a squall that tore our rotten sails to pieces, prevented our getting into the Kill, and drove us upon Long Island. In our way, a drunken Dutchman, who was a passenger too, fell overboard; when he was sinking, I reached through the water to his shock pate, and drew him up, so that we got him in again. His ducking sobered him a little, and he went to sleep, taking first out of his pocket a book, which he desired I would dry for him. It proved to be my old favorite author, Bunyan’s Pilgrim’s Progress, in Dutch, finely printed on good paper, with copper cuts, a dress better than I had ever seen it wear in its own language. I have since found that it has been translated into most of the languages of Europe, and suppose it has been more generally read than any other book, except perhaps the Bible. Honest John was the first that I know of who mixed narration and dialogue; a method of writing very engaging to the reader, who in the most interesting parts finds himself, as it were, brought into the company and present at the discourse. De Foe in his Cruso, his Moll Flanders, Religious Courtship, Family Instructor, and other pieces, has imitated it with success; and Richardson has done the same in his Pamela, etc.

      When we drew near the island, we found it was at a place where there could be no landing, there being a great surf on the stony beach. So we dropped anchor, and swung round towards the shore. Some people came down to the water edge and halloed to us, as we did to them; but the wind was so high, and the surf so loud, that we could not hear so as to understand each other. There were canoes on the shore, and we made signs, and halloed that they should fetch us; but they either did not understand us, or thought it impracticable, so they went away, and night coming on, we had no remedy but to wait till the wind should abate; and, in the meantime, the boatman and I concluded to sleep, if we could; and so crowded into the scuttle, with the Dutchman, who was still wet, and the spray beating over the head of our boat, leaked through to us, so that we were soon almost as wet as he. In this manner we lay all night, with very little rest; but, the wind abating the next day, we made a shift to reach Amboy before night, having been thirty hours on the water, without victuals, or any drink but a bottle of filthy rum, and the water we sailed on being salt.
    checkIn:
      id: bf-ch-03-s1-c1
      stem: Where did old Mr. William Bradford in New York send Franklin to seek employment?
      options:
        - To his son Andrew Bradford's printing shop in Philadelphia.
        - To a newspaper office operated by Keimer in New York.
        - To a bookshop owned by Aquilla Rose in Burlington.
        - To a publishing house managed by his brother in Boston.
      correctIndex: 0
      explanationZh: 老Bradford说费城的儿子刚失去了主要助手Aquilla Rose，建议富兰克林去那里："My son at Philadelphia has lately lost his principal hand…if you go thither, I believe he may employ you." Aquilla Rose是去世的助手而非书商，其余去处也均非他的建议。
  - id: bf-ch-03-s2
    text: |-
      In the evening I found myself very feverish, and went in to bed; but, having read somewhere that cold water drank plentifully was good for a fever, I followed the prescription, sweat plentifully most of the night, my fever left me, and in the morning, crossing the ferry, I proceeded on my journey on foot, having fifty miles to Burlington, where I was told I should find boats that would carry me the rest of the way to Philadelphia.

      It rained very hard all the day; I was thoroughly soaked, and by noon a good deal tired; so I stopped at a poor inn, where I stayed all night, beginning now to wish that I had never left home. I cut so miserable a figure, too, that I found, by the questions asked me, I was suspected to be some runaway servant, and in danger of being taken up on that suspicion. However, I proceeded the next day, and got in the evening to an inn, within eight or ten miles of Burlington, kept by one Dr. Brown. He entered into conversation with me while I took some refreshment, and, finding I had read a little, became very sociable and friendly. Our acquaintance continued as long as he lived. He had been, I imagine, an itinerant doctor, for there was no town in England, or country in Europe, of which he could not give a very particular account. He had some letters, and was ingenious, but much of an unbeliever, and wickedly undertook, some years after, to travesty the Bible in doggrel verse, as Cotton had done Virgil. By this means he set many of the facts in a very ridiculous light, and might have hurt weak minds if his work had been published; but it never was.

      At his house I lay that night, and the next morning reached Burlington, but had the mortification to find that the regular boats were gone a little before my coming, and no other expected to go before Tuesday, this being Saturday; wherefore I returned to an old woman in the town, of whom I had bought gingerbread to eat on the water, and asked her advice. She invited me to lodge at her house till a passage by water should offer; and being tired with my foot traveling, I accepted the invitation. She understanding I was a printer, would have had me stay at that town and follow my business, being ignorant of the stock necessary to begin with. She was very hospitable, gave me a dinner of ox-cheek with great good will, accepting only of a pot of ale in return; and I thought myself fixed till Tuesday should come. However, walking in the evening by the side of the river, a boat came by, which I found was going towards Philadelphia, with several people in her. They took me in, and, as there was no wind, we rowed all the way; and about midnight, not having yet seen the city, some of the company were confident we must have passed it, and would row no farther; the others knew not where we were; so we put toward the shore, got into a creek, landed near an old fence, with the rails of which we made a fire, the night being cold, in October, and there we remained till daylight. Then one of the company knew the place to be Cooper’s Creek, a little above Philadelphia, which we saw as soon as we got out of the creek, and arrived there about eight or nine o’clock on the Sunday morning, and landed at the Market-street wharf.
    checkIn:
      id: bf-ch-03-s2-c1
      stem: What happened after Franklin drank plenty of cold water for his fever?
      options:
        - He became delirious and had to call for a doctor.
        - He felt much worse and decided to return home.
        - He slept peacefully without any change in his condition.
        - He sweated most of the night and the fever left him.
      correctIndex: 3
      explanationZh: 富兰克林读到冷水可治发烧，便照做，结果"sweat plentifully most of the night, my fever left me"。第二天他继续渡河步行，并没有变严重或请医生。
  - id: bf-ch-03-s3
    text: |-
      I have been the more particular in this description of my journey, and shall be so of my first entry into that city, that you may in your mind compare such unlikely beginnings with the figure I have since made there. I was in my working dress, my best clothes being to come round by sea. I was dirty from my journey; my pockets were stuffed out with shirts and stockings, and I knew no soul nor where to look for lodging. I was fatigued with traveling, rowing, and want of rest, I was very hungry; and my whole stock of cash consisted of a Dutch dollar, and about a shilling in copper. The latter I gave the people of the boat for my passage, who at first refused it, on account of my rowing; but I insisted on their taking it. A man being sometimes more generous when he has but a little money than when he has plenty, perhaps through fear of being thought to have but little.

      Then I walked up the street, gazing about till near the market-house I met a boy with bread. I had made many a meal on bread, and, inquiring where he got it, I went immediately to the baker’s he directed me to, in Second-street, and asked for biscuit, intending such as we had in Boston; but they, it seems, were not made in Philadelphia. Then I asked for a threepenny loaf, and was told they had none such. So not considering or knowing the difference of money, and the greater cheapness nor the names of his bread, I bade him give me threepenny worth of any sort. He gave me, accordingly, three great puffy rolls. I was surprised at the quantity, but took it, and, having no room in my pockets, walked off with a roll under each arm, and eating the other. Thus I went up Market-street as far as Fourth-street, passing by the door of Mr. Read, my future wife’s father; when she, standing at the door, saw me, and thought I made, as I certainly did, a most awkward, ridiculous appearance. Then I turned and went down Chestnut-street and part of Walnut-street, eating my roll all the way, and, coming round, found myself again at Market-street wharf, near the boat I came in, to which I went for a draught of the river water; and, being filled with one of my rolls, gave the other two to a woman and her child that came down the river in the boat with us, and were waiting to go farther.
    checkIn:
      id: bf-ch-03-s3-c1
      stem: What did Franklin do with the two extra rolls after eating his fill of the third one?
      options:
        - He saved them for breakfast at the Crooked Billet.
        - He handed them to a beggar near the Quaker meetinghouse.
        - He gave them to a woman and her child from the boat.
        - He sold them to a boy at the Market-street wharf.
      correctIndex: 2
      explanationZh: 富兰克林吃了一个面包后便饱了，"gave the other two to a woman and her child that came down the river in the boat with us"。其余选项都是编造的细节。
  - id: bf-ch-03-s4
    text: |-
      Thus refreshed, I walked again up the street, which by this time had many clean-dressed people in it, who were all walking the same way. I joined them, and thereby was led into the great meetinghouse of the Quakers near the market. I sat down among them, and, after looking round awhile and hearing nothing said, being very drowsy through labour and want of rest the preceding night, I fell fast asleep, and continued so till the meeting broke up, when one was kind enough to rouse me. This was, therefore, the first house I was in, or slept in, in Philadelphia.

      Walking down again toward the river, and, looking in the faces of people, I met a young Quaker man, whose countenance I liked, and, accosting him, requested he would tell me where a stranger could get lodging. We were then near the sign of the Three Mariners. “Here,” says he, “is one place that entertains strangers, but it is not a reputable house; if thee wilt walk with me, I’ll show thee a better.” He brought me to the Crooked Billet in Water-street. Here I got a dinner; and, while I was eating it, several sly questions were asked me, as it seemed to be suspected from my youth and appearance, that I might be some runaway.

      After dinner, my sleepiness returned, and being shown to a bed, I lay down without undressing, and slept till six in the evening, was called to supper, went to bed again very early, and slept soundly till next morning. Then I made myself as tidy as I could, and went to Andrew Bradford the printer’s. I found in the shop the old man his father, whom I had seen at New York, and who, traveling on horseback, had got to Philadelphia before me. He introduced me to his son, who received me civilly, gave me a breakfast, but told me he did not at present want a hand, being lately supplied with one; but there was another printer in town, lately set up, one Keimer, who, perhaps, might employ me; if not, I should be welcome to lodge at his house, and he would give me a little work to do now and then till fuller business should offer.

      The old gentleman said he would go with me to the new printer; and when we found him, “Neighbour,” says Bradford, “I have brought to see you a young man of your business; perhaps you may want such a one.” He asked me a few questions, put a composing stick in my hand to see how I worked, and then said he would employ me soon, though he had just then nothing for me to do; and, taking old Bradford, whom he had never seen before, to be one of the town’s people that had a good will for him, entered into a conversation on his present undertaking and prospects; while Bradford, not discovering that he was the other printer’s father, on Keimer’s saying he expected soon to get the greatest part of the business into his own hands, drew him on by artful questions, and starting little doubts, to explain all his views, what interest he relied on, and in what manner he intended to proceed. I, who stood by and heard all, saw immediately that one of them was a crafty old sophister, and the other a mere novice. Bradford left me with Keimer, who was greatly surprised when I told him who the old man was.
    checkIn:
      id: bf-ch-03-s4-c1
      stem: Why was old Bradford able to trick Keimer into revealing all his business plans?
      options:
        - Because Keimer was too drunk to recognize his rival.
        - Because Bradford pretended to be a wealthy merchant from Boston.
        - Because Keimer did not know the old man was the other printer's father.
        - Because Keimer had already decided to leave the printing trade.
      correctIndex: 2
      explanationZh: Keimer从未见过老Bradford，以为他只是个好心市民，便毫无防备地畅谈计划；而实际上老Bradford是对手Andrew Bradford的父亲。富兰克林在旁看穿了一切："one of them was a crafty old sophister, and the other a mere novice."——老练的诡辩家对上初出茅庐的新手。
  - id: bf-ch-03-s5
    text: |-
      Keimer’s printing-house, I found, consisted of an old shattered press, and one small, worn-out font of English, which he was then using himself, composing an Elegy on Aquilla Rose, before mentioned, an ingenious young man, of excellent character, much respected in the town, clerk of the Assembly, and a pretty poet. Keimer made verses too, but very indifferently. He could not be said to write them, for his manner was to compose them in the types directly out of his head. So there being no copy, but one pair of cases, and the Elegy likely to require all the letter, no one could help him. I endeavoured to put his press (which he had not yet used, and of which he understood nothing) into order fit to be worked with; and, promising to come and print off his Elegy as soon as he should have got it ready, I returned to Bradford’s, who gave me a little job to do for the present, and there I lodged and dieted. A few days after, Keimer sent for me to print off the Elegy. And now he had got another pair of cases, and a pamphlet to reprint, on which he set me to work.

      These two printers I found poorly qualified for their business. Bradford had not been bred to it, and was very illiterate; and Keimer, though something of a scholar, was a mere compositor, knowing nothing of presswork. He had been one of the French prophets, and could act their enthusiastic agitations. At this time he did not profess any particular religion, but something of all on occasion; was very ignorant of the world, and had, as I afterward found, a good deal of the knave in his composition. He did not like my lodging at Bradford’s while I worked with him. He had a house, indeed, but without furniture, so he could not lodge me; but he got me a lodging at Mr. Read’s before mentioned, who was the owner of his house; and, my chest and clothes being come by this time, I made rather a more respectable appearance in the eyes of Miss Read than I had done when she first happened to see me eating my roll in the street.

      I began now to have some acquaintance among the young people of the town, that were lovers of reading, with whom I spent my evenings very pleasantly; and gaining money by my industry and frugality, I lived very agreeably, forgetting Boston as much as I could, and not desiring that any there should know where I resided, except my friend Collins, who was in my secret, and kept it when I wrote to him. At length, an incident happened that sent me back again much sooner than I had intended. I had a brother-in-law, Robert Holmes, master of a sloop that traded between Boston and Delaware. He being at Newcastle, forty miles below Philadelphia, heard there of me, and wrote me a letter mentioning the concern of my friends in Boston at my abrupt departure, assuring me of their good will to me, and that everything would be accommodated to my mind if I would return, to which he exhorted me very earnestly. I wrote an answer to his letter, thanked him for his advice, but stated my reasons for quitting Boston fully and in such a light as to convince him I was not so wrong as he had apprehended.
    checkIn:
      id: bf-ch-03-s5-c1
      stem: Why did Keimer get Franklin lodgings at Mr. Read's house?
      options:
        - Because Mr. Read had offered Keimer a partnership in printing.
        - Because Keimer's own house had no furniture to lodge anyone.
        - Because Franklin had specifically requested to live near the market.
        - Because Bradford refused to let Franklin stay at his house any longer.
      correctIndex: 1
      explanationZh: Keimer不喜欢富兰克林住在Bradford那里，但自己"had a house, indeed, but without furniture, so he could not lodge me"，于是把他安排在房东Mr. Read家。富兰克林的行李此时也到了，让Miss Read对他改观。
quiz:
  - id: bf-ch-03-q1
    stem: Why did Franklin originally set out from New York for Philadelphia instead of going to sea?
    options:
      - His father had ordered him to seek work in Philadelphia.
      - A wealthy merchant had promised him a printing partnership.
      - He was fleeing arrest and needed to leave New York quickly.
      - His desire for the sea had faded and he had a trade to offer.
    correctIndex: 3
    explanationZh: 富兰克林说"my inclinations for the sea were by this time worn out"，加上自己有一门手艺，便去找老Bradford谋职。他并非受父亲派遣、没有商人许诺合作，也不是在纽约面临逮捕才走的。
  - id: bf-ch-03-q2
    stem: What book did the drunken Dutchman ask Franklin to dry after being pulled from the water?
    options:
      - Bunyan's Pilgrim's Progress, in Dutch.
      - De Foe's Robinson Crusoe, in French.
      - Cotton's travesty of Virgil, in English.
      - Richardson's Pamela, in German.
    correctIndex: 0
    explanationZh: 荷兰人落水被救起后，从口袋掏出一本书请富兰克林弄干，"It proved to be my old favorite author, Bunyan's Pilgrim's Progress, in Dutch"。富兰克林还由此感慨此书在欧洲被广泛译介。
  - id: bf-ch-03-q3
    stem: What did Dr. Brown attempt some years after Franklin lodged at his inn?
    options:
      - He published a scathing attack on the Quakers.
      - He travestied the Bible in doggerel verse.
      - He wrote a treatise defending the French prophets.
      - He translated Pilgrim's Progress into English doggerel.
    correctIndex: 1
    explanationZh: Dr. Brown是个有才华但不信教的人，后来"wickedly undertook…to travesty the Bible in doggrel verse"，把圣经故事写得滑稽可笑。幸好此作从未出版，未造成大的危害。
  - id: bf-ch-03-q4
    stem: What was Franklin's entire stock of cash when he first landed at the Market-street wharf?
    options:
      - A single gold guinea and a handful of copper coins.
      - Three Dutch dollars and a few pennies.
      - One English pound and a Dutch dollar.
      - A Dutch dollar and about a shilling in copper.
    correctIndex: 3
    explanationZh: 富兰克林到费城时"my whole stock of cash consisted of a Dutch dollar, and about a shilling in copper"。他把铜板给了船夫当船费，自己坚持要付。
  - id: bf-ch-03-q5
    stem: Which building does Franklin call the first house he was in, or slept in, in Philadelphia?
    options:
      - At the Crooked Billet inn on Water-street, near the wharf.
      - At Andrew Bradford's printing shop.
      - Inside the great Quaker meetinghouse near the market.
      - At Mr. Read's house on Market-street.
    correctIndex: 2
    explanationZh: 富兰克林跟着衣着整洁的人群走进贵格会礼拜堂，因极度困倦而"fell fast asleep, and continued so till the meeting broke up"。他说"This was, therefore, the first house I was in, or slept in, in Philadelphia." 在Crooked Billet过夜是当天傍晚之后的事。
  - id: bf-ch-03-q6
    stem: What did Keimer's printing-house consist of when Franklin first saw it?
    options:
      - Two new presses and a complete set of French type.
      - A broken press and no type cases at all.
      - An old shattered press and one small worn-out font of type.
      - One working press and two fonts of English type.
    correctIndex: 2
    explanationZh: 富兰克林看到Keimer的印刷所只有"an old shattered press, and one small, worn-out font of English"。Keimer当时正用这套铅字直接在字盘上排一首悼念Aquilla Rose的挽歌。

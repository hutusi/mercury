        - A second law imposing new taxes.
      correctIndex: 1
      explanationZh: Mansfield 在律师们辩论时把富兰克林叫到书记室，问他是否确信执行该法案不会损害业主产业，富兰克林说当然，Mansfield 便建议他签一份保证书。双方接受后，法律获准通过。
quiz:
  - id: bf-ch-19-q1
    stem: Why did Franklin tell Governor Denny he could not accept any proprietary favours?
    options:
      - He distrusted the proprietary's sincerity and preferred to stay neutral.
      - He had already accepted a pension from the Royal Society.
      - His circumstances made favours unnecessary, and he sat in the Assembly.
      - He planned to sail to England and did not want conflicts of interest.
    correctIndex: 2
    explanationZh: 富兰克林明确说感谢上帝，他的经济状况使业主恩惠对他不必要，而且作为议会议员他不可能接受。他并非不信任业主的诚意，而是身份所限不能接受。
  - id: bf-ch-19-q2
    stem: What was Franklin's reason for his past opposition to the proprietary's measures?
    options:
      - The measures served proprietary interest at the people's cost.
      - The proprietary had personally insulted him in public.
      - The proprietary refused to pay his military supply accounts.
      - The proprietary had blocked his appointment as colonial agent.
    correctIndex: 0
    explanationZh: 富兰克林说他过去的反对基于一个事实：那些被推动的措施明显意在服务业主利益而损害人民利益。这是原则问题而非个人恩怨。
  - id: bf-ch-19-q3
    stem: What news did Governor Denny give Franklin about his old friend James Ralph?
    options:

      - Ralph had been appointed governor of a small Caribbean island.
      - Ralph had become a successful poet admired by Pope.
    correctIndex: 0
    explanationZh: Denny 告诉富兰克林，Ralph 仍活着，被认为是英国最好的政论作家之一，在腓特烈王子与国王的争端中被雇佣并获每年三百镑年金。作为诗人他声誉不高，Pope 在《愚人志》中贬低过他的诗，但他的散文被认为极佳。
  - id: bf-ch-19-q4
    stem: What reason did Franklin later understand Mr. Pitt gave for replacing Lord Loudoun with Generals Amherst and Wolfe?
    options:
      - Loudoun had lost a major battle at Louisburg and retreated.
      - Pitt never heard from him and could not know his doings.
      - Loudoun had been accused of embezzling army supplies.
      - Loudoun had disobeyed direct orders from the king.
    correctIndex: 1
    explanationZh: 富兰克林到英国后听说 Pitt 撤换 Loudoun 的理由之一是这位大臣从未收到过他的来信，无法了解他在做什么。这正与 Innis 的观察吻合——Loudoun 总在写字却从不出成果。
  - id: bf-ch-19-q5
    stem: During the hearing before the Council, what did Franklin argue would happen if the taxing act were repealed?
    options:
      - The proprietaries would gain control of the colony's tax collection.
      - The Assembly would refuse to make any future grants to the king.
      - The assessors would be forced to perjure themselves en masse.
      - The paper money in circulation would be struck dead, ruining many.
    correctIndex: 3
    explanationZh: 富兰克林强调十万镑纸币已经印发、用于国王服务并散布于民间，撤销该法会使这些钱在人们手中变成废纸，导致许多人破产并彻底打击未来的拨款意愿。他以此强调业主的自私。
  - id: bf-ch-19-q6
    stem: What happened to Governor Denny after he passed the act taxing the proprietary estate?
    options:
      - He was promoted to a higher office in the colonial administration.

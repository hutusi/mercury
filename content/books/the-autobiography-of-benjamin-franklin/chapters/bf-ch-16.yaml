  - id: bf-ch-16-q4
    stem: How did Braddock take that warning?
    options:
      - He turned Franklin out of the camp for the impertinence
      - He smiled, and said savages could not touch the regulars
      - He halted the march at once to shorten the column
      - He thanked him and set the scouts to guard the flanks
    correctIndex: 1

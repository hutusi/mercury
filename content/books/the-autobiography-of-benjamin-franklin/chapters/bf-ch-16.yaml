  - id: bf-ch-16-q3
    stem: What specific military danger did Franklin warn Braddock about during their conversation?
    options:
      - The French garrison at Fort Duquesne was much stronger than the intelligence suggested.
      - The army's artillery would be too heavy to transport through the wilderness terrain.
      - The Indian scouts would betray the army and lead it into an enemy trap on purpose.
      - Its slender four-mile line could be flanked and cut into pieces.
    correctIndex: 3
    explanationZh: 富兰克林说军队在狭窄的路上排成近四英里的细长队形，侧翼可能遭印第安伏兵袭击，被切成数段而无法互相支援。文中原话是"cut like a thread into several pieces"。选项提到堡垒兵力、火炮过重、侦察兵叛变均非他当时提出的担忧。
  - id: bf-ch-16-q4
    stem: How did Braddock respond to Franklin's warning about Indian ambuscades?
    options:
      - He angrily dismissed Franklin from the camp and forbade him from returning.
      - He smiled and said savages could make no impression on the king's regulars.
      - He immediately ordered the army to halt and reorganize into a shorter marching column.
      - He thanked Franklin and reassigned the Indian scouts to guard the flanks of the column.
    correctIndex: 1
    explanationZh: 布雷多克笑了笑，说这些"savages"也许对美洲民兵可怕，但对国王正规军不可能有任何影响。文中写"He smiled at my ignorance"。选项中赶走富兰克林、立即停队整编或感谢他并调遣侦察兵保护侧翼都不符合原文。
  - id: bf-ch-16-q5
    stem: What happened to the secretary's papers after Braddock's defeat?
    options:
      - They were destroyed by fire when the camp's ammunition stores were deliberately burned.
      - They were safely carried back to Philadelphia by Captain Orme along with the wounded general.
      - They fell into enemy hands, and selected articles were translated into French and printed.
      - They were recovered by Colonel Dunbar and delivered to the Pennsylvania Assembly intact.
    correctIndex: 2
    explanationZh: 秘书Shirley阵亡后，他携带的文件——包括将军的命令、指令与通信——落入敌手。法方从中挑选若干译成法文并印刷，以证明英国在宣战前就有敌意。选项说文件被焚毁、由Orme安全带回或由Dunbar完整交付议会，都与事实不符。
  - id: bf-ch-16-q6
    stem: How did General Shirley eventually relieve Franklin from the wagon owners' demands?
    options:
      - He appointed commissioners to examine the claims and ordered payment.
      - He declared Franklin's personal bonds null and void by military authority.
      - He reimbursed Franklin directly from the royal treasury within one week.
      - He persuaded the wagon owners to accept a partial settlement of ten shillings per pound.
    correctIndex: 0
    explanationZh: 车主要求富兰克林按担保赔偿，有人甚至开始起诉。Shirley将军最终任命专员审查赔偿要求并下令支付，总计数近两万英镑，若由富兰克林自付将破产。选项中宣布担保无效、直接从国库还款或说服车主打折，均无文本支持。

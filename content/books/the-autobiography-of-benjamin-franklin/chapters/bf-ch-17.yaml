id: bf-ch-17
bookId: book-franklin
title: Franklin’s Defense of the Frontier
titleZh: 富兰克林对边疆的防御
summaryZh: 富兰克林受命率领民兵修建堡垒以保卫西北边疆，期间他观察到摩拉维亚教徒的务实作风，也见识了印第安人的侦察技巧。回到费城后，他因军官们拔剑护送出城而触怒领主，后者试图借机剥夺他的职务。
sections:
  - id: bf-ch-17-s1
    text: |-
      While the several companies in the city and country were forming, and learning their exercise, the governor prevailed with me to take charge of our Northwestern frontier, which was infested by the enemy, and provide for the defense of the inhabitants by raising troops and building a line of forts. I undertook this military business, though I did not conceive myself well qualified for it. He gave me a commission with full powers, and a parcel of blank commissions for officers, to be given to whom I thought fit. I had but little difficulty in raising men, having soon five hundred and sixty under my command. My son, who had in the preceding war been an officer in the army raised against Canada, was my aid-de-camp, and of great use to me. The Indians had burned Gnadenhut, a village settled by the Moravians, and massacred the inhabitants; but the place was thought a good situation for one of the forts.

      In order to march thither, I assembled the companies at Bethlehem, the chief establishment of those people. I was surprised to find it in so good a posture of defense; the destruction of Gnadenhut had made them apprehend danger. The principal buildings were defended by a stockade; they had purchased a quantity of arms and ammunition from New York, and had even placed quantities of small paving stones between the windows of their high stone houses, for their women to throw down upon the heads of any Indians that should attempt to force into them. The armed brethren, too, kept watch, and relieved as methodically as in any garrison town. In conversation with the bishop, Spangenberg, I mentioned this my surprise; for, knowing they had obtained an act of Parliament exempting them from military duties in the colonies, I had supposed they were conscientiously scrupulous of bearing arms. He answered me that it was not one of their established principles, but that, at the time of their obtaining that act, it was thought to be a principle with many of their people. On this occasion, however, they, to their surprise, found it adopted by but a few. It seems they were either deceived in themselves, or deceived the Parliament; but common sense, aided by present danger, will sometimes be too strong for whimsical opinions.

      It was the beginning of January when we set out upon this business of building forts. I sent one detachment toward the Minisink, with instructions to erect one for the security of that upper part of the country, and another to the lower part, with similar instructions; and I concluded to go myself with the rest of my force to Gnadenhut, where a fort was thought more immediately necessary. The Moravians procured me five wagons for our tools, stores, baggage, etc.
    checkIn:
      id: bf-ch-17-s1-c1
      stem: How did the Moravians at Bethlehem explain their willingness to bear arms despite a parliamentary exemption?
      options:
        - They had secretly obtained a new act requiring all colonists to bear arms.
        - They found that only a few members actually held it as a genuine principle.
        - They claimed the exemption applied only to clergy, not to ordinary members.
        - They said they bore arms solely to protect Franklin's military stores.
      correctIndex: 1
      explanationZh: 主教Spangenberg告诉富兰克林，虽然他们曾以反对持武为由获得议会豁免，但真正持有这一原则的人很少，现实的危险让常识压倒了怪念头。所谓豁免只适用于教士的说法与原文不符。
  - id: bf-ch-17-s2
    text: |-
      Just before we left Bethlehem, eleven farmers, who had been driven from their plantations by the Indians, came to me requesting a supply of firearms, that they might go back and fetch off their cattle. I gave them each a gun with suitable ammunition. We had not marched many miles before it began to rain, and it continued raining all day; there were no habitations on the road to shelter us, till we arrived near night at the house of a German, where, and in his barn, we were all huddled together, as wet as water could make us. It was well we were not attacked in our march, for our arms were of the most ordinary sort, and our men could not keep their gun locks dry. The Indians are dexterous in contrivances for that purpose, which we had not. They met that day the eleven poor farmers above mentioned, and killed ten of them. The one who escaped informed that his and his companions’ guns would not go off, the priming being wet with the rain.

      The next day being fair, we continued our march, and arrived at the desolated Gnadenhut. There was a sawmill near, round which were left several piles of boards, with which we soon hutted ourselves; an operation the more necessary at that inclement season, as we had no tents. Our first work was to bury more effectually the dead we found there, who had been half interred by the country people.

      The next morning our fort was planned and marked out, the circumference measuring four hundred and fifty-five feet, which would require as many palisades to be made of trees, one with another, of a foot diameter each. Our axes, of which we had seventy, were immediately set to work to cut down trees, and, our men being dexterous in the use of them, great despatch was made. Seeing the trees fall so fast, I had the curiosity to look at my watch when two men began to cut at a pine; in six minutes they had it upon the ground, and I found it of fourteen inches diameter. Each pine made three palisades of eighteen feet long, pointed at one end. While these were preparing, our other men dug a trench all round, of three feet deep, in which the palisades were to be planted; and, our wagons, the bodies being taken off, and the fore and hind wheels separated by taking out the pin which united the two parts of the perch, we had ten carriages, with two horses each, to bring the palisades from the woods to the spot. When they were set up, our carpenters built a stage of boards all round within, about six feet high, for the men to stand on when to fire through the loopholes. We had one swivel gun, which we mounted on one of the angles, and fired it as soon as fixed, to let the Indians know, if any were within hearing, that we had such pieces; and thus our fort, if such a magnificent name may be given to so miserable a stockade, was finished in a week, though it rained so hard every other day that the men could not work.
    checkIn:
      id: bf-ch-17-s2-c1
      stem: What happened to the eleven farmers who asked Franklin for guns before the march?
      options:
        - Ten of them were killed by Indians because their wet gunlocks would not fire.
        - They deserted the march and returned to Bethlehem for safety.
        - They were ambushed and robbed of all their cattle by Franklin's men.
        - They survived an Indian attack by taking shelter in a German barn.
      correctIndex: 0
      explanationZh: 出发前，十一位农民向富兰克林借枪以回去取牲畜，但途中下大雨，火药被淋湿，枪无法击发，其中十人被印第安人杀死，仅一人逃回报信。躲进谷仓避雨的是富兰克林的部队，而非这些农民。
  - id: bf-ch-17-s3
    text: |-
      This gave me occasion to observe, that, when men are employed, they are best contented; for on the days they worked they were good-natured and cheerful, and, with the consciousness of having done a good day’s work, they spent the evening jollily; but on our idle days they were mutinous and quarrelsome, finding fault with their pork, the bread, etc., and in continual ill-humour, which put me in mind of a sea-captain, whose rule it was to keep his men constantly at work; and, when his mate once told him that they had done everything, and there was nothing further to employ them about, “Oh,” says he, “make them scour the anchor.”

      This kind of fort, however contemptible, is a sufficient defense against Indians, who have no cannon. Finding ourselves now posted securely, and having a place to retreat to on occasion, we ventured out in parties to scour the adjacent country. We met with no Indians, but we found the places on the neighbouring hills where they had lain to watch our proceedings. There was an art in their contrivance of those places that seems worth mention. It being winter, a fire was necessary for them; but a common fire on the surface of the ground would by its light have discovered their position at a distance. They had therefore dug holes in the ground about three feet diameter, and somewhat deeper; we saw where they had with their hatchets cut off the charcoal from the sides of burnt logs lying in the woods. With these coals they had made small fires in the bottom of the holes, and we observed among the weeds and grass the prints of their bodies, made by their laying all round, with their legs hanging down in the holes to keep their feet warm, which, with them, is an essential point. This kind of fire, so managed, could not discover them, either by its light, flame, sparks, or even smoke: it appeared that their number was not great, and it seems they saw we were too many to be attacked by them with prospect of advantage.

      We had for our chaplain a zealous Presbyterian minister, Mr. Beatty, who complained to me that the men did not generally attend his prayers and exhortations. When they enlisted, they were promised, besides pay and provisions, a gill of rum a day, which was punctually served out to them, half in the morning, and the other half in the evening; and I observed they were as punctual in attending to receive it; upon which I said to Mr. Beatty, “It is, perhaps, below the dignity of your profession to act as steward of the rum, but if you were to deal it out and only just after prayers, you would have them all about you.” He liked the thought, undertook the office, and, with the help of a few hands to measure out the liquor, executed it to satisfaction, and never were prayers more generally and more punctually attended; so that I thought this method preferable to the punishment inflicted by some military laws for nonattendance on divine service.
    checkIn:
      id: bf-ch-17-s3-c1
      stem: What did Franklin observe about the Indian scouts' fire pits?
      options:
        - They dug deep holes and built small fires inside them to remain hidden.
        - They lit large fires on hilltops to intimidate approaching enemies.
        - They carried heated charcoal in leather pouches instead of making fires.
        - They used wet leaves to produce smoke signals for distant communication.
      correctIndex: 0
      explanationZh: 富兰克林仔细观察了印第安侦察兵的藏身处：他们在地上挖洞，在洞底生小火，并把腿垂进洞里取暖，这样火光、火星和烟都不会暴露位置。在山顶生大火与原文恰恰相反。
  - id: bf-ch-17-s4
    text: |-
      I had hardly finished this business, and got my fort well stored with provisions, when I received a letter from the governor, acquainting me that he had called the Assembly, and wished my attendance there, if the posture of affairs on the frontiers was such that my remaining there was no longer necessary. My friends, too, of the Assembly, pressing me by their letters to be, if possible, at the meeting, and my three intended forts being now completeed, and the inhabitants contented to remain on their farms under that protection, I resolved to return; the more willingly, as a New England officer, Colonel Clapham, experienced in Indian war, being on a visit to our establishment, consented to accept the command. I gave him a commission, and, parading the garrison, had it read before them, and introduced him to them as an officer who, from his skill in military affairs, was much more fit to command them than myself; and, giving them a little exhortation, took my leave. I was escorted as far as Bethlehem, where I rested a few days to recover from the fatigue I had undergone. The first night, being in a good bed, I could hardly sleep, it was so different from my hard lodging on the floor of our hut at Gnaden wrapt only in a blanket or two.

      While at Bethlehem, I inquired a little into the practice of the Moravians: some of them had accompanied me, and all were very kind to me. I found they worked for a common stock, ate at common tables, and slept in common dormitories, great numbers together. In the dormitories I observed loopholes, at certain distances all along just under the ceiling, which I thought judiciously placed for change of air. I was at their church, where I was entertained with good music, the organ being accompanied with violins, hautboys, flutes, clarinets, etc. I understood that their sermons were not usually preached to mixed congregations of men, women, and children, as is our common practice, but that they assembled sometimes the married men, at other times their wives, then the young men, the young women, and the little children, each division by itself. The sermon I heard was to the latter, who came in and were placed in rows on benches; the boys under the conduct of a young man, their tutor, and the girls conducted by a young woman. The discourse seemed well adapted to their capacities, and was delivered in a pleasing, familiar manner, coaxing them, as it were, to be good. They behaved very orderly, but looked pale and unhealthy, which made me suspect they were kept too much within doors, or not allowed sufficient exercise.
    checkIn:
      id: bf-ch-17-s4-c1
      stem: What did Franklin observe about the Moravian children at church?
      options:
        - They were allowed to choose for themselves which sermon to attend each week.
        - They were taught separately from the married men and women.
        - They refused to sit on benches and stood through the sermon.
        - They behaved orderly but looked pale and unhealthy from lack of exercise.
      correctIndex: 3
      explanationZh: 富兰克林看到摩拉维亚人按年龄和性别分开聚会，给儿童讲道的方式亲切温和，孩子们很守秩序，但面色苍白不健康，让他怀疑他们被关在室内太久、缺乏运动。
  - id: bf-ch-17-s5
    text: |-
      I inquired concerning the Moravian marriages, whether the report was true that they were by lot. I was told that lots were used only in particular cases; that generally, when a young man found himself disposed to marry, he informed the elders of his class, who consulted the elder ladies that governed the young women. As these elders of the different sexes were well acquainted with the tempers and dispositions of their respective pupils, they could best judge what matches were suitable, and their judgments were generally acquiesced in; but if, for example, it should happen that two or three young women were found to be equally proper for the young man, the lot was then recurred to. I objected, if the matches are not made by the mutual choice of the parties, some of them may chance to be very unhappy. “And so they may,” answered my informer, “if you let the parties choose for themselves;” which, indeed, I could not deny.

      Being returned to Philadelphia, I found the association went on swimmingly, the inhabitants that were not Quakers having pretty generally come into it, formed themselves into companies, and chose their captains, lieutenants, and ensigns, according to the new law. Dr. B. visited me, and gave me an account of the pains he had taken to spread a general good liking to the law, and ascribed much to those endeavours. I had had the vanity to ascribe all to my Dialogue; however, not knowing but that he might be in the right, I let him enjoy his opinion, which I take to be generally the best way in such cases. The officers, meeting, chose me to be colonel of the regiment, which I this time accepted. I forget how many companies we had, but we paraded about twelve hundred well-looking men, with a company of artillery, who had been furnished with six brass field-pieces, which they had become so expert in the use of as to fire twelve times in a minute. The first time I reviewed my regiment they accompanied me to my house, and would salute me with some rounds fired before my door, which shook down and broke several glasses of my electrical apparatus. And my new honour proved not much less brittle; for all our commissions were soon after broken by a repeal of the law in England.

      During this short time of my colonelship, being about to set out on a journey to Virginia, the officers of my regiment took it into their heads that it would be proper for them to escort me out of town, as far as the Lower Ferry. Just as I was getting on horseback they came to my door, between thirty and forty, mounted, and all in their uniforms. I had not been previously acquainted with the project, or I should have prevented it, being naturally averse to the assuming of state on any occasion; and I was a good deal chagrined at their appearance, as I could not avoid their accompanying me. What made it worse was, that, as soon as we began to move, they drew their swords and rode with them naked all the way. Somebody wrote an account of this to the proprietor, and it gave him great offense. No such honour had been paid him when in the province, nor to any of his governors; and he said it was only proper to princes of the blood royal, which may be true for aught I know, who was, and still am, ignorant of the etiquette in such cases.
    checkIn:
      id: bf-ch-17-s5-c1
      stem: When did the Moravians resort to the lot in arranging marriages?
      options:
        - In every marriage, as the standard method of matching couples.
        - Only when several candidates seemed equally suitable for a match.
        - Only when the parties' parents could not agree on the terms.
        - Never; the report of marriages by lot was entirely false.
      correctIndex: 1
      explanationZh: 富兰克林问起“抽签结婚”的传闻，得到的答复是：通常由熟悉各人性情的长老们撮合婚配，只有在两三位姑娘同样合适时才诉诸抽签。当他质疑不由当事人自选可能不幸福时，对方反问：让他们自己选就一定幸福吗？他无言以对。
  - id: bf-ch-17-s6
    text: |-
      This silly affair, however, greatly increased his rancour against me, which was before not a little, on account of my conduct in the Assembly respecting the exemption of his estate from taxation, which I had always opposed very warmly, and not without severe reflections on his meanness and injustice of contending for it. He accused me to the ministry as being the great obstacle to the King’s service, preventing, by my influence in the House, the proper form of the bills for raising money, and he instanced this parade with my officers as a proof of my having an intention to take the government of the province out of his hands by force. He also applied to Sir Everard Fawkener, the postmaster-general, to deprive me of my office; but it had no other effect than to procure from Sir Everard a gentle admonition.

      Notwithstanding the continual wrangle between the governor and the House, in which I, as a member, had so large a share, there still subsisted a civil intercourse between that gentleman and myself, and we never had any personal difference. I have sometimes since thought that his little or no resentment against me, for the answers it was known I drew up to his messages, might be the effect of professional habit, and that, being bred a lawyer, he might consider us both as merely advocates for contending clients in a suit, he for the proprietaries and I for the Assembly. He would, therefore, sometimes call in a friendly way to advise with me on difficult points, and sometimes, though not often, take my advice.

      We acted in concert to supply Braddock’s army with provisions; and, when the shocking news arrived of his defeat, the governor sent in haste for me, to consult with him on measures for preventing the desertion of the back counties. I forget now the advice I gave; but I think it was, that Dunbar should be written to, and prevailed with, if possible, to post his troops on the frontiers for their protection, till, by reinforcements from the colonies, he might be able to proceed on the expedition. And, after my return from the frontier, he would have had me undertake the conduct of such an expedition with provincial troops, for the reduction of Fort Duquesne, Dunbar and his men being otherwise employed; and he proposed to commission me as general. I had not so good an opinion of my military abilities as he professed to have, and I believe his professions must have exceeded his real sentiments; but probably he might think that my popularity would facilitate the raising of the men, and my influence in Assembly, the grant of money to pay them, and that, perhaps, without taxing the proprietary estate. Finding me not so forward to engage as he expected, the project was dropped, and he soon after left the government, being superseded by Captain Denny.
    checkIn:
      id: bf-ch-17-s6-c1
      stem: What did the proprietor accuse Franklin of after the officers' mounted escort?
      options:
        - He accused him of embezzling tax money meant for the frontier forts.
        - He accused him of secretly negotiating a treaty with the Indians.
        - He accused him of plotting to seize control of the province by force.
        - He accused him of trying to overturn the new military law in England.
      correctIndex: 2
      explanationZh: 军官们骑马拔剑护送富兰克林出城，领主对此大怒，认为这是僭越，向大臣指控富兰克林是阻碍国王事务的祸首，并以这次列队护送为证，说他有意以武力夺取省政府。关于贪污或私订条约的说法原文并无依据。
quiz:
  - id: bf-ch-17-q1
    stem: Why was Franklin relieved to hand over command to Colonel Clapham?
    options:
      - He wanted to take command of a larger regiment in Philadelphia.
      - He was ordered to do so by the Assembly to avoid a conflict.
      - He needed to leave immediately to settle a family estate.
      - He considered Clapham far more skilled in Indian warfare than himself.
    correctIndex: 3
    explanationZh: 富兰克林坦承自己军事能力不足，而Clapham是经验丰富的印第安战争老兵，所以他当众宣读委任状，把指挥权交给对方。他并非奉议会之命行事，而是边境防务已稳固才放心离开。
  - id: bf-ch-17-q2
    stem: What did Franklin learn about the Moravians' communal way of living at Bethlehem?
    options:
      - They worked for a common stock and ate at common tables together.
      - They lived in private cottages and pooled only their farming tools.
      - They shared all wages equally but maintained separate households.
      - They assigned each member a separate plot of land to cultivate.
    correctIndex: 0
    explanationZh: 富兰克林在伯利恒休整时了解到，摩拉维亚人共同劳动、共享物资，在公共餐桌用餐，在公共宿舍就寝。他并未提到他们保留私人住宅或单独分配土地。
  - id: bf-ch-17-q3
    stem: Why did the governor and Assembly members urge Franklin to return from the frontier?
    options:
      - They wanted him to recruit more troops for the Virginia expedition.
      - They needed his attendance at the Assembly meeting.
      - They had received reports of an imminent attack on Philadelphia.
      - They needed him to negotiate a peace treaty with nearby tribes.
    correctIndex: 1
    explanationZh: 总督来信说已召开议会，希望他若边境不再危急便回来开会；议会里的朋友也写信催他出席。富兰克林见三座堡垒已建成，居民安心留在农场，便决定返回。招兵或谈判并非召回他的原因。
  - id: bf-ch-17-q4
    stem: What happened to Franklin's military commissions shortly after he became colonel?
    options:
      - They were revoked by the governor after the mounted escort affair.
      - They were transferred to Colonel Clapham by a military tribunal.
      - They were renewed only after Franklin paid a fee to the proprietor.
      - They were invalidated by a repeal of the law in England.
    correctIndex: 3
    explanationZh: 富兰克林担任上校后不久，英国废除了相关法律，所有人的委任状随即失效，他自嘲这份新荣誉和被礼炮震碎的玻璃仪器一样脆弱。并非总督因护送事件直接撤销他的委任。
  - id: bf-ch-17-q5
    stem: Why did the proprietor's complaint to the postmaster-general fail to remove Franklin from office?
    options:
      - It was dismissed because Franklin had support from the king directly.
      - It was withdrawn after the governor wrote a letter of apology.
      - It only produced a gentle admonition from Sir Everard Fawkener.
      - It resulted in a formal inquiry that found Franklin innocent.
    correctIndex: 2
    explanationZh: 领主向邮政大臣Sir Everard Fawkener控告富兰克林，企图剥夺他的邮政职务，但结果只是换来Sir Everard的一番温和告诫，没有实际效果。并非国王支持或正式调查使指控不成立。
  - id: bf-ch-17-q6
    stem: Why did the governor propose commissioning Franklin as a general against Fort Duquesne?
    options:
      - He believed Franklin had superior military training compared to Dunbar.
      - He wanted Franklin out of Philadelphia so he could control the Assembly.
      - He hoped Franklin's popularity and influence would raise men and money.
      - He needed Franklin to negotiate a peace treaty with the Indians first.
    correctIndex: 2
    explanationZh: 总督提议让富兰克林率民兵远征杜肯堡，可能是因为看中他的声望便于招兵、在议会的影响力便于拨款，甚至可能不必向领主地产征税。富兰克林觉得总督的溢美之词超过其真心，最终未接受，计划作罢。

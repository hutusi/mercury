      explanationZh: 镇上跟他一块儿长大的姑娘差不多都嫁了人，等新一批长成的空档里，他找上了 the widow Sharpless——"a powerful, well-preserved woman of forty or thereabouts, who had been born with her eye-teeth cut. He found her uncommon sympathetic. And when Chauncey finally came out of his trance he was the stepfather of the widow's four children."。

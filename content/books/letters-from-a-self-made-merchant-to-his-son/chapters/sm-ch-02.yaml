  - id: sm-ch-02-q2
    stem: What does the steer that will not fatten stand for?
    options:
      - The boy is eating so much that he ruins his own health
      - The boy is putting on weight faster than the other boys
      - The boy will not come away from college and go to work
      - The bills go up month by month, and no honors come of it
    correctIndex: 3

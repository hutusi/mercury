  - id: sm-ch-02-q4
    stem: What did two dollars a week and a hard floor teach him?
    options:
      - How to beat a butcher down on the price of a good roast of beef
      - How many pennies were in a dollar, and how hard a floor is
      - How to catch the eye of a boss and get moved up
      - How to buy wheat at the right figure week by week
    correctIndex: 1
    explanationZh: 原文写 "I got two dollars a week, and slept under the counter, and you can bet I knew just how many pennies there were in each of those dollars, and how hard the floor was. That is what you have got to learn."。
  - id: sm-ch-02-q5
    stem: What is a young man to do about the Old Abe in his crowd?
    options:
      - Follow him close, and he will show the way to the top
      - Ask him to dinner and make a friend of him early
      - Keep away from the crowd that is following him
      - Take him on, and prove you are no light-weight
    correctIndex: 2
    explanationZh: 原文写 "I never saw a dozen boys together that there wasn't an Old Abe among them. If you find your crowd following him, keep away from it. There are times when it's safest to be lonesome."。

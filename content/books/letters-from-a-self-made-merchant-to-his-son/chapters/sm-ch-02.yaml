  - id: sm-ch-02-q3
    stem: What does he mean by saying there is no elevator in the building?
    options:
      - There is no short cut up to a place at the top here
      - The office building happens to have but one floor
      - The lift is kept for the use of the executives only
      - The stairs are there to keep a clerk in condition

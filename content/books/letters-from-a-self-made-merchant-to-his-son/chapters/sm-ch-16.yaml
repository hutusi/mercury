      id: sm-ch-16-s7-c1
      stem: What went up on the front door before he left Boston?
      options:
        - A fresh invitation, for a party the following week
        - A word of apology over the trouble with the police
        - A notice that he had gone back out to Circle City
        - A warning to the police to keep off the premises
      correctIndex: 2
      explanationZh: 门上那张告示写着——"Neighbors paying their party calls will please not heave rocks through windows to attract attention. Not in and not going to be. Gone back to Circle City for a little quiet." 落款后头还添了一句 "Too swift for your uncle."。

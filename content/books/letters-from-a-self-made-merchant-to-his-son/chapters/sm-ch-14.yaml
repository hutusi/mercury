        - It went by mail to the Deacon's own pastor, for his poor
        - The Deacon took charge of it, to keep it safe for Bill's sake
      correctIndex: 2
      explanationZh: 他说那两百块压了自己一整夜，天没亮就起来 "mailed a check for it to the Deacon's pastor and told him to spend it on his poor"。Zeke 连夜坐车赶回去撬这张支票，可 "old Doc. Hoover was a pretty quick stepper himself and he'd blown the whole two hundred as soon as he got it, buying winter coal for poor people"。

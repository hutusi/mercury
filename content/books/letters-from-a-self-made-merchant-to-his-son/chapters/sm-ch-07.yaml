    stem: What does the father say about a young man's likes and dislikes?
    options:
      - Telling them is the surest way to make friends here
      - Telling them shows a bright, progressive sort of clerk
      - Having them costs a man, and telling them ruins him
      - Telling them is how a clerk gets his salary raised
    correctIndex: 2
    explanationZh: 原文写 "I don't know anything that a young business man ought to keep more entirely to himself than his dislikes, unless it is his likes. It's generally expensive to have either, but it's bankruptcy to tell about them."。

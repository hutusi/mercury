    explanationZh: 原文写 "I am a little disappointed in the showing that this house has been making. Pound for pound it is not getting nearly so much out of its hogs as we are in Chicago. I don't know just where the leak is, but if they don't do better next month I am coming back here with a shotgun, and there's going to be a pretty heavy mortality among our head men."。

  - id: sm-ch-07-q5
    stem: What does real superiority look like?
    options:
      - Loud notice taken of a man's own importance
      - Courtesy without condescension, and no signboards
      - Rules and signs enough to keep every stranger off
      - A four-colored label to help the package along

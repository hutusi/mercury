      explanationZh: 原文写 "the Widow must have touched him at least a hundred times and every time he was affected to tears, for she was using a bed slat, which is a powerfully strong moral agent for making a boy see the error of his ways." 此后整整一个月，凡在他"淹死"期间夸过他 noble little fellow 的人，见了他都要赏一记耳刮子。

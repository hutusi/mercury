        - He demands three thousand dollars compensation before he will take the boy back.
        - He refuses to take the boy back and tells them to keep him as long as they like.
      correctIndex: 1
      explanationZh: 原文中 Dorset 的信提出如果他们付两百五十美元，他就接走孩子。Bill 和 Sam 照做了。文中没有出现小硬币、三千美元的价码，Dorset 也答应接收，并非拒绝。
quiz:

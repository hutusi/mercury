      explanationZh: 哄他上路的说辞是 "his father had bought a silver-mounted rifle and a pair of moccasins for him, and we were going to hunt bears the next day"。等他发现真要被留在家里，便 "started up a howl like a calliope"，像水蛭一样死死抱住 Bill 的腿。
quiz:

  - id: oh-ch-07-q5
    stem: Why could nobody in the bank open the vault door?
    options:
      - The dynamite that someone suggested had been used up
      - Mr. Adams had left the only key at his house
      - The clock was not wound and no combination was set
      - The three bolts had jammed against one another
    correctIndex: 2
    explanationZh: 老银行家扑到把手上拉了几下就绝望了——"The door can't be opened. The clock hasn't been wound nor the combination set."。他还说 "There isn't a man nearer than Little Rock who can open that door."；有人喊要用炸药，但那只是慌乱中的一句话。
  - id: oh-ch-07-q6
    stem: What did Ben Price do at the bank door?
    options:
      - He arrested Jimmy the moment the child was safe
      - He gave Jimmy a day to settle his affairs and go
      - He asked to see the tools before he made up his mind
      - He said he did not recognize him and walked away
    correctIndex: 3
    explanationZh: Jimmy 穿上外套走向门口，主动招呼 "Hello, Ben! Got around at last, have you?"，Ben Price 却答 "Guess you're mistaken, Mr. Spencer. Don't believe I recognize you. Your buggy's waiting for you, ain't it?"，随后转身沿街走开。当众亮出手艺救人，等于亲手毁掉那个新身份——正是这一下让侦探收了手。

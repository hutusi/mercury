quiz:
  - id: oh-ch-07-q1
    stem: How did Jimmy spend his first hours of freedom?
    options:
      - He went straight to the depot and boarded a train
      - He ate broiled chicken and drank a bottle of white wine
      - He went to see the friends who had won his pardon
      - He walked out to enjoy the birds and the flowers
    correctIndex: 1
    explanationZh: 他对鸟鸣、绿树和花香一概不理，径直奔向饭馆，尝到的第一份自由是 "a broiled chicken and a bottle of white wine—followed by a cigar a grade better than the one the warden had given him"。吃完才慢悠悠踱去车站。
  - id: oh-ch-07-q2
    stem: What at the robbery scenes told Ben Price whose work it was?
    options:
      - A signature scratched into the paint of the safe door
      - The fact that securities and silver were left untouched
      - The three jobs fell in one week
      - The knob jerked out and a single hole drilled
    correctIndex: 3
    explanationZh: 他一眼认出手法——"Look at that combination knob—jerked out as easy as pulling up a radish in wet weather. He's got the only clamps that can do it. And look how clean those tumblers were punched out! Jimmy never has to drill but one hole."。证券和银器没被动，那是 Logansport 一案的细节，不是他判断的依据。
  - id: oh-ch-07-q3

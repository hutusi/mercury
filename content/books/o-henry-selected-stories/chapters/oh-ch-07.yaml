  - id: oh-ch-07-q4
    stem: How did Ben Price get his look at Ralph D. Spencer?
    options:
      - He came by train on the morning of the wedding
      - He watched Spencer from a drugstore over the way
      - He put up at the Planters' Hotel under a false name
      - He went straight to Mr. Adams with a warrant in hand

  - id: oh-ch-06-s5
    text: |-
      “I’m very sorry,” said Richard, as he resumed his seat, “but it looks as if we are stuck. They won’t get this jumble loosened up in an hour. It was my fault. If I hadn’t dropped the ring we—”

      “Let me see the ring,” said Miss Lantry. “Now that it can’t be helped, I don’t care. I think theatres are stupid, anyway.”

      At 11 o’clock that night somebody tapped lightly on Anthony Rockwall’s door.

      “Come in,” shouted Anthony, who was in a red dressing-gown, reading a book of piratical adventures.

      Somebody was Aunt Ellen, looking like a grey-haired angel that had been left on earth by mistake.

      “They’re engaged, Anthony,” she said, softly. “She has promised to marry our Richard. On their way to the theatre there was a street blockade, and it was two hours before their cab could get out of it.

      “And oh, brother Anthony, don’t ever boast of the power of money again. A little emblem of true love—a little ring that symbolised unending and unmercenary affection—was the cause of our Richard finding his happiness. He dropped it in the street, and got out to recover it. And before they could continue the blockade occurred. He spoke to his love and won her there while the cab was hemmed in. Money is dross compared with true love, Anthony.”

      “All right,” said old Anthony. “I’m glad the boy has got what he wanted. I told him I wouldn’t spare any expense in the matter if—”

      “But, brother Anthony, what good could your money have done?”

      “Sister,” said Anthony Rockwall. “I’ve got my pirate in a devil of a scrape. His ship has just been scuttled, and he’s too good a judge of the value of money to let drown. I wish you would let me go on with this chapter.”

      The story should end here. I wish it would as heartily as you who read it wish it did. But we must go to the bottom of the well for truth.

      The next day a person with red hands and a blue polka-dot necktie, who called himself Kelly, called at Anthony Rockwall’s house, and was at once received in the library.

      “Well,” said Anthony, reaching for his chequebook, “it was a good bilin’ of soap. Let’s see—you had $5,000 in cash.”

      “I paid out $300 more of my own,” said Kelly. “I had to go a little above the estimate. I got the express wagons and cabs mostly for $5; but the trucks and two-horse teams mostly raised me to $10. The motormen wanted $10, and some of the loaded teams $20. The cops struck me hardest—$50 I paid two, and the rest $20 and $25. But didn’t it work beautiful, Mr. Rockwall? I’m glad William A. Brady wasn’t onto that little outdoor vehicle mob scene. I wouldn’t want William to break his heart with jealousy. And never a rehearsal, either! The boys was on time to the fraction of a second. It was two hours before a snake could get below Greeley’s statue.”

      “Thirteen hundred—there you are, Kelly,” said Anthony, tearing off a check. “Your thousand, and the $300 you were out. You don’t despise money, do you, Kelly?”

      “Me?” said Kelly. “I can lick the man that invented poverty.”

      Anthony called Kelly when he was at the door.

      “You didn’t notice,” said he, “anywhere in the tie-up, a kind of a fat boy without any clothes on shooting arrows around with a bow, did you?”

      “Why, no,” said Kelly, mystified. “I didn’t. If he was like you say, maybe the cops pinched him before I got there.”

      “I thought the little rascal wouldn’t be on hand,” chuckled Anthony. “Goodbye, Kelly.”
    checkIn:
      id: oh-ch-06-s5-c1
      stem: What does Aunt Ellen believe caused the street blockade that helped Richard?
      options:
        - A sudden mechanical failure of all the crosstown cars
        - The dropped ring, an emblem of true love, caused it
        - A citywide parade scheduled for that very evening
        - Miss Lantry's mother secretly arranged the traffic jam
      correctIndex: 1
      explanationZh: 爱伦姑妈认为是理查德掉落戒指这一举动导致了交通堵塞，她坚信这是真爱的象征在起作用：“A little emblem of true love … was the cause of our Richard finding his happiness.” 她完全不知道堵塞是安东尼花钱安排的。
quiz:
  - id: oh-ch-06-q1
    stem: Why does Anthony ask Richard what he pays for soap and clothes?
    options:
      - He wants to calculate how much allowance Richard needs each month.
      - He is planning to raise the price of Eureka soap to match Richard's brand.
      - He wants to judge whether Richard is a genuine gentleman despite his wealth.
      - He thinks Richard is wasting money and needs to learn frugality.
    correctIndex: 2
    explanationZh: 安东尼通过询问肥皂和衣服的价格来判断理查德是否务实节俭。理查德用适中的价格，安东尼便断言“You're a gentleman”，并说金钱能像肥皂油脂一样润滑地造就绅士——关键不在血统而在态度。
  - id: oh-ch-06-q2
    stem: What does Richard believe about money and time when he tells his father about Miss Lantry?
    options:
      - Money can buy a first-class ticket to follow her ship to Europe.
      - Money cannot buy even a single minute of time to speak with her.
      - Money can rent a private box at the theatre for uninterrupted talk.
      - Money can bribe her mother to extend the visit by one day.
    correctIndex: 1
    explanationZh: 理查德说“We can't buy one minute of time with cash; if we could, rich people would live longer”，他认为金钱无法买到与小姐独处的片刻时间。这与安东尼“金钱万能”的信念形成核心冲突。
  - id: oh-ch-06-q3
    stem: Why does Richard drop the ring on the way to the theatre?
    options:
      - The cab hits a pothole and the ring flies out of the window.
      - He genuinely loses it while adjusting his gloves in the cab.
      - Miss Lantry accidentally knocks it out of his hand.
      - He fakes dropping it to create a private moment with Miss Lantry.
    correctIndex: 3
    explanationZh: 理查德“dropped a ring”是他故意制造的借口，目的是让马车停下来，争取与小姐独处的时间。他事先把戒指塞进马甲口袋，上车后便以掉戒指为由钻出车厢，回来后堵车恰好发生。
  - id: oh-ch-06-q4
    stem: How long does the street blockade last before the cab can move again?
    options:
      - Two hours.
      - Twenty minutes.
      - Forty-five minutes.
      - One hour.
    correctIndex: 0
    explanationZh: 爱伦姑妈报告堵塞持续了“two hours before their cab could get out of it”，而凯利后来也说“It was two hours before a snake could get below Greeley's statue”，确认了整整两小时的交通瘫痪。
  - id: oh-ch-06-q5
    stem: What is the real purpose of Kelly's visit to Anthony the next day?
    options:
      - To deliver the engagement ring back to Anthony's mansion
      - To collect payment for staging the blockade
      - To report on Miss Lantry's reaction to Richard's proposal
      - To return the three hundred dollars Anthony overpaid him
    correctIndex: 1
    explanationZh: 凯利是安东尼雇来制造交通堵塞的人。他汇报各项花费——马车、卡车、车夫、警察的佣金，安东尼随即开出一张一千三百美元的支票结清账目，证明堵塞完全是金钱买来的。
  - id: oh-ch-06-q6
    stem: What does Anthony's final comment about a fat boy with a bow imply?
    options:
      - He suspects a street urchin stole the ring during the blockade.
      - He thinks Kelly forgot to hire a child actor for the scene.
      - He jokingly wonders whether Cupid himself was involved in the love match.
      - He is worried that a stray child was injured in the traffic jam.
    correctIndex: 2
    explanationZh: 安东尼最后问凯利是否在堵车现场看到“a kind of a fat boy without any clothes on shooting arrows around with a bow”——这分明是丘比特的形象。他笑着说“I thought the little rascal wouldn't be on hand”，暗示真正的爱神并没有出场，一切都是金钱在起作用。

      id: oh-ch-06-s5-c1
      stem: What did Aunt Ellen conclude from the night's events?
      options:
        - That Anthony's money had bought the boy his chance
        - That Richard should have spoken to her much earlier
        - That the theatre party had been a mistake from the start

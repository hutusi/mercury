      correctIndex: 3
      explanationZh: 她跑去劝哥哥别再夸口钱的力量——"A little emblem of true love—a little ring that symbolised unending and unmercenary affection—was the cause of our Richard finding his happiness."，末了还加一句 "Money is dross compared with true love"。她把整件事都记在那枚戒指账上。
quiz:
  - id: oh-ch-06-q1
    stem: What boast did Anthony make about the encyclopaedia?
    options:
      - He had read down to Y looking for something money can't buy
      - He had bought a new encyclopaedia for the library that week
      - He had written to the editors to correct the entry on soap
      - He had memorised it as a boy on the Kansas prairies
    correctIndex: 0
    explanationZh: 他说 "I've been through the encyclopaedia down to Y looking for something you can't buy with it; and I expect to have to take up the appendix next week."——查到字母 Y 都没找出一个反例。堪萨斯草原留给他的是那副能吼破天的嗓门，不是背书的本事。
  - id: oh-ch-06-q2
    stem: What did Anthony offer while he still thought it was Richard's liver?
    options:
      - A cheque large enough to buy any cure he wanted
      - The Rambler, coaled and ready to steam to the Bahamas
      - A whole season at the club with every expense paid
      - A quiet fortnight at Larchmont away from the city
    correctIndex: 1
    explanationZh: 他先猜是肝出了毛病，随口便说 "there's the Rambler down in the bay, coaled, and ready to steam down to the Bahamas in two days"，还说二十四小时内能凑出一千一百万现款。理查德只答 "Not a bad guess, dad; you haven't missed it far."。
  - id: oh-ch-06-q3
    stem: Why did Richard have the cabman stop at Thirty-fourth Street?
    options:
      - He said he had dropped his mother's ring in the street
      - He wanted to buy flowers before they reached the theatre
      - The horse had thrown a shoe and needed to be checked
      - He had spotted the box party waiting on the sidewalk
    correctIndex: 0
    explanationZh: 他顶开活板叫停车，说 "I've dropped a ring"，又补一句 "It was my mother's, and I'd hate to lose it. I won't detain you a minute—I saw where it fell."。不到一分钟他就拿着戒指回来了，而正是这不到一分钟里，路口彻底堵死。
  - id: oh-ch-06-q4
    stem: How did Miss Lantry take it when the cab was hemmed in?
    options:
      - That her mother would never forgive the delay
      - That they should get out and walk to the theatre
      - That she would like to see the ring he had found
      - That the cabman ought to be reported to the police
    correctIndex: 2
    explanationZh: 她的反应出人意料——"Let me see the ring. Now that it can't be helped, I don't care. I think theatres are stupid, anyway."。她既没有催他步行赶路，也没有替母亲抱怨迟到。
  - id: oh-ch-06-q5
    stem: In Kelly's accounting, which item cost the most?
    options:
      - The policemen came cheapest of all the men hired
      - The policemen cost the most, up to fifty dollars each
      - Kelly did the whole job for a flat five thousand dollars
      - Kelly rehearsed the drivers for a week beforehand
    correctIndex: 1
    explanationZh: 凯利报账说 "The cops struck me hardest—$50 I paid two, and the rest $20 and $25."，比快递马车、出租马车的五美元和卡车、双马车的十美元贵得多。他另外自掏了三百美元，还特意强调 "never a rehearsal, either!"。
  - id: oh-ch-06-q6
    stem: What did Anthony's question about a fat boy with a bow mean?
    options:
      - That a child was hurt in the jam
      - That Kelly should have hired a boy for the scene
      - That a pickpocket had worked the crowd that night
      - That Cupid had had no hand in the match at all
    correctIndex: 3
    explanationZh: 他在凯利要出门时补问一句，堵车现场有没有见到 "a kind of a fat boy without any clothes on shooting arrows around with a bow"——那正是丘比特的模样。凯利说没见着，他便笑道 "I thought the little rascal wouldn't be on hand."——这桩姻缘从头到尾是钱办成的。

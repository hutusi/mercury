  - id: oh-ch-03-q2
    stem: What happens when Soapy tries to play the "masher" near the young woman at the shop window?
    options:
      - She screams for help and the nearby policeman immediately arrests him.
      - She turns out to be willing to join him and asks him to buy her a drink.
      - She ignores him completely and walks away without saying a word.
      - She recognizes him as a vagrant and calls the policeman over herself.
    correctIndex: 1
    explanationZh: 索皮本想调戏女子以被警察逮捕，没料到对方反而热情回应，说只要他请喝一杯就愿意跟他走，害他只能甩掉她继续逃走。选项中说女子尖叫报警或不理他，均与文中她那句"Sure, Mike"的欢快回答矛盾。
  - id: oh-ch-03-q3
    stem: How does the umbrella owner react when Soapy refuses to return the umbrella?
    options:
      - He immediately calls the nearby policeman to arrest Soapy.
      - He grabs the umbrella back forcibly and walks away in anger.
      - He backs down and claims it was all a misunderstanding.
      - He offers Soapy money to leave the umbrella and go peacefully.
    correctIndex: 2
    explanationZh: 伞的主人见索皮态度强硬，便退缩说这只是一场误会，称伞是当天早上在餐厅捡到的。选项中说他强行夺回雨伞或报警抓人，均与原文不符。
  - id: oh-ch-03-q4
    stem: Where is Soapy standing when the anthem from the old church moves him to reform?
    options:
      - Against the iron fence outside an old, quaint, gabled church.
      - On his bench beside the spurting fountain in Madison Square.
      - On the sidewalk in front of a brilliantly lit theatre entrance.
      - In a street damaged by improvements on the city's east side.
    correctIndex: 0
    explanationZh: 索皮走到一座古老而别致的教堂前，被铁栅栏缠住脚步，紫色窗玻璃透出柔光，管风琴奏出的赞美诗让他驻足沉思。选项中说他在喷泉长椅或剧院门口，均非原文中这一转折发生的地点。
  - id: oh-ch-03-q5
    stem: For what reason is Soapy finally arrested outside the church?
    options:
      - The officer catches him carrying a stolen umbrella he threw away.
      - The officer regards him as a loiterer with no lawful business there.
      - The officer overhears him shouting drunken gibberish on the street.
      - The officer finds him breaking a church window with a cobblestone.
    correctIndex: 1
    explanationZh: 警察问他在这做什么，索皮说没做什么，警察便以游荡为由逮捕了他，次日法官判处三个月监禁。选项中说他因偷伞或醉酒喧闹被捕，这些之前的尝试均告失败，真正导致入狱的只是教堂前被认定为游荡者。

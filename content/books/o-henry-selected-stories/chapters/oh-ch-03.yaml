    stem: What does Soapy plan to order at the luxurious café on Broadway?
    options:
      - A grilled salmon steak, a bottle of Burgundy, and some Brie.
      - A roast beef platter, a bottle of claret, and some Roquefort.
      - A bowl of turtle soup, a bottle of champagne, and some Stilton.

      explanationZh: 磨坊主说汉斯是个大损失，因为 "I had as good as given him my wheelbarrow"，现在手推车坏得卖不掉，放在家里还碍事，他说以后再也不大方送东西了。他毫无悔意，完全没有反思是自己的要求害死了汉斯。
quiz:
  - id: hp-ch-04-q1
    stem: Why does the Miller never visit Hans during the winter?
    options:
      - The road to Hans's cottage is blocked by snow
      - He is too busy working at his mill
      - His wife forbids him from going out
      - He says people in trouble should be left alone
    correctIndex: 3
    explanationZh: 磨坊主对妻子说，下雪天不该去探望汉斯，因为 "when people are in trouble they should be left alone"。他还说等到春天再去，那时汉斯就能给他一篮报春花了。路被雪堵、太忙、妻子禁止都不是文中提到的理由。
  - id: hp-ch-04-q2
    stem: What does Hans sell first to buy bread during the hard winter?
    options:
      - His coat buttons
      - His wheelbarrow
      - His big pipe
      - His silver chain
    correctIndex: 0
    explanationZh: 汉斯说他先卖了 "the silver buttons off my Sunday coat"，然后卖银链子，再卖大烟斗，最后才卖手推车。手推车是他最后卖掉的东西。
  - id: hp-ch-04-q3
    stem: Why does the Miller say he can give Hans his old wheelbarrow?
    options:
      - The wheelbarrow is too broken to use anyway
      - He owes Hans for years of help
      - His wife told him to give it away
      - He has already bought a new one for himself
    correctIndex: 3
    explanationZh: 磨坊主说自己已经有一辆新推车了，所以旧的可以给汉斯。他嘴上说得大方，但实际上这辆旧车一边坏了、轮辐也有问题，他自己已经不需要了。
  - id: hp-ch-04-q4
    stem: What happens to Hans on the moor during the storm?
    options:
      - He falls from a ladder and breaks his leg
      - Robbers attack him and take his coat
      - He loses his way and drowns in a deep pool
      - He freezes to death on the road
    correctIndex: 2
    explanationZh: 暴风雨越来越大，汉斯迷了路，走上满是深坑的荒野，最终 "poor little Hans was drowned"。第二天牧羊人发现他浮在一个大水塘里。摔下梯子受伤的是磨坊主的儿子，不是汉斯。
  - id: hp-ch-04-q5
    stem: How did the Miller react when his little son wanted to invite Hans and share his porridge?
    options:
      - He praised the boy for his kind heart
      - He called the boy silly and doubted the use of school
      - He agreed to invite Hans at once
      - He sent the boy to Hans with a sack of flour
    correctIndex: 1
    explanationZh: 小儿子提议请汉斯来家里，还愿意分他一半麦片粥、给他看白兔。磨坊主却骂道“What a silly boy you are!”，说真不知道送他上学有什么用。满口友谊大道理的磨坊主，对真正的善意反而嗤之以鼻；他既没有夸奖孩子，也没有请汉斯来。
  - id: hp-ch-04-q6
    stem: What makes the Water-rat go back into his hole at the end?
    options:
      - He is bored by the Linnet's long story
      - He wants to find the Miller and help him
      - He is angry that the story has a moral
      - He is sad about Hans's death
    correctIndex: 2
    explanationZh: 水鼠听到故事有道德寓意后非常生气，说早知道就不听了，喊了一声 "Pooh"，甩甩尾巴钻回洞里。他不是无聊或难过，而是觉得被骗听了一个有教育意义的故事。

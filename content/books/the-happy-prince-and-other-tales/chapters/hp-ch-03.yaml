id: hp-ch-03
bookId: book-happy-prince
title: The Selfish Giant
titleZh: 自私的巨人
summaryZh: 孩子们放学后总去巨人的花园里玩，直到花园的主人在外做客七年之后回了家。那之后，这座花园里过了很久很久才再听见笑声。
sections:
  - id: hp-ch-03-s1
    text: |-
      Every afternoon, as they were coming from school, the children used to go and play in the Giant’s garden.

      It was a large lovely garden, with soft green grass. Here and there over the grass stood beautiful flowers like stars, and there were twelve peach-trees that in the springtime broke out into delicate blossoms of pink and pearl, and in the autumn bore rich fruit. The birds sat on the trees and sang so sweetly that the children used to stop their games in order to listen to them. “How happy we are here!” they cried to each other.

      One day the Giant came back. He had been to visit his friend the Cornish ogre, and had stayed with him for seven years. After the seven years were over he had said all that he had to say, for his conversation was limited, and he determined to return to his own castle. When he arrived he saw the children playing in the garden.

      “What are you doing here?” he cried in a very gruff voice, and the children ran away.

      “My own garden is my own garden,” said the Giant; “anyone can understand that, and I will allow nobody to play in it but myself.” So he built a high wall all round it, and put up a noticeboard.

      Trespassers Will Be Prosecuted

      He was a very selfish Giant.

      The poor children had now nowhere to play. They tried to play on the road, but the road was very dusty and full of hard stones, and they did not like it. They used to wander round the high wall when their lessons were over, and talk about the beautiful garden inside. “How happy we were there,” they said to each other.

      Then the Spring came, and all over the country there were little blossoms and little birds. Only in the garden of the Selfish Giant it was still winter. The birds did not care to sing in it as there were no children, and the trees forgot to blossom. Once a beautiful flower put its head out from the grass, but when it saw the noticeboard it was so sorry for the children that it slipped back into the ground again, and went off to sleep. The only people who were pleased were the Snow and the Frost. “Spring has forgotten this garden,” they cried, “so we will live here all the year round.” The Snow covered up the grass with her great white cloak, and the Frost painted all the trees silver. Then they invited the North Wind to stay with them, and he came. He was wrapped in furs, and he roared all day about the garden, and blew the chimney-pots down. “This is a delightful spot,” he said, “we must ask the Hail on a visit.” So the Hail came. Every day for three hours he rattled on the roof of the castle till he broke most of the slates, and then he ran round and round the garden as fast as he could go. He was dressed in grey, and his breath was like ice.
    checkIn:
      id: hp-ch-03-s1-c1
      stem: Why did the little flower slip back into the ground and go off to sleep?
      options:
        - The North Wind had frozen it down to the roots
        - It saw the noticeboard and was sorry for the children
        - The Giant's high wall had shut out all the sunlight
        - The Hail had broken every petal that it put out
      correctIndex: 1
      explanationZh: 花刚从草里探出头，"when it saw the noticeboard it was so sorry for the children that it slipped back into the ground again"。冰雹和北风是雪与霜后来才请进花园的客人。
  - id: hp-ch-03-s2
    text: |-
      “I cannot understand why the Spring is so late in coming,” said the Selfish Giant, as he sat at the window and looked out at his cold white garden; “I hope there will be a change in the weather.”

      But the Spring never came, nor the Summer. The Autumn gave golden fruit to every garden, but to the Giant’s garden she gave none. “He is too selfish,” she said. So it was always Winter there, and the North Wind, and the Hail, and the Frost, and the Snow danced about through the trees.

      One morning the Giant was lying awake in bed when he heard some lovely music. It sounded so sweet to his ears that he thought it must be the King’s musicians passing by. It was really only a little linnet singing outside his window, but it was so long since he had heard a bird sing in his garden that it seemed to him to be the most beautiful music in the world. Then the Hail stopped dancing over his head, and the North Wind ceased roaring, and a delicious perfume came to him through the open casement. “I believe the Spring has come at last,” said the Giant; and he jumped out of bed and looked out.

      What did he see?

      He saw a most wonderful sight. Through a little hole in the wall the children had crept in, and they were sitting in the branches of the trees. In every tree that he could see there was a little child. And the trees were so glad to have the children back again that they had covered themselves with blossoms, and were waving their arms gently above the children’s heads. The birds were flying about and twittering with delight, and the flowers were looking up through the green grass and laughing. It was a lovely scene, only in one corner it was still winter. It was the farthest corner of the garden, and in it was standing a little boy. He was so small that he could not reach up to the branches of the tree, and he was wandering all round it, crying bitterly. The poor tree was still quite covered with frost and snow, and the North Wind was blowing and roaring above it. “Climb up! little boy,” said the Tree, and it bent its branches down as low as it could; but the boy was too tiny.
    checkIn:
      id: hp-ch-03-s2-c1
      stem: What did the Giant hear one morning that made him jump out of bed?
      options:
        - The children laughing in the branches of his trees
        - The Hail rattling on the roof for three whole hours
        - A little linnet singing outside his window
        - The North Wind roaring over the chimney-pots
      correctIndex: 2
      explanationZh: 那不过是 "a little linnet singing outside his window"，可他太久没在园里听见鸟叫，还以为是国王的乐师路过。冰雹和北风恰恰在那一刻停了下来。
  - id: hp-ch-03-s3
    text: |-
      And the Giant’s heart melted as he looked out. “How selfish I have been!” he said; “now I know why the Spring would not come here. I will put that poor little boy on the top of the tree, and then I will knock down the wall, and my garden shall be the children’s playground forever and ever.” He was really very sorry for what he had done.

      So he crept downstairs and opened the front door quite softly, and went out into the garden. But when the children saw him they were so frightened that they all ran away, and the garden became winter again. Only the little boy did not run, for his eyes were so full of tears that he did not see the Giant coming. And the Giant stole up behind him and took him gently in his hand, and put him up into the tree. And the tree broke at once into blossom, and the birds came and sang on it, and the little boy stretched out his two arms and flung them round the Giant’s neck, and kissed him. And the other children, when they saw that the Giant was not wicked any longer, came running back, and with them came the Spring. “It is your garden now, little children,” said the Giant, and he took a great axe and knocked down the wall. And when the people were going to market at twelve o’clock they found the Giant playing with the children in the most beautiful garden they had ever seen.

      All day long they played, and in the evening they came to the Giant to bid him goodbye.

      “But where is your little companion?” he said: “the boy I put into the tree.” The Giant loved him the best because he had kissed him.

      “We don’t know,” answered the children; “he has gone away.”

      “You must tell him to be sure and come here tomorrow,” said the Giant. But the children said that they did not know where he lived, and had never seen him before; and the Giant felt very sad.

      Every afternoon, when school was over, the children came and played with the Giant. But the little boy whom the Giant loved was never seen again. The Giant was very kind to all the children, yet he longed for his first little friend, and often spoke of him. “How I would like to see him!” he used to say.
    checkIn:
      id: hp-ch-03-s3-c1
      stem: Why did the little boy alone not run away when the Giant came into the garden?
      options:
        - He was too small to climb down out of the tree
        - He knew the Giant had come to lift him into the tree
        - He was hiding behind the trunk of the tree
        - His eyes were so full of tears he did not see him
      correctIndex: 3
      explanationZh: 别的孩子吓得四散奔逃，"Only the little boy did not run, for his eyes were so full of tears that he did not see the Giant coming"。他个子太小够不着树枝是真的，却不是他没跑的原因。
  - id: hp-ch-03-s4
    text: |-
      Years went over, and the Giant grew very old and feeble. He could not play about any more, so he sat in a huge armchair, and watched the children at their games, and admired his garden. “I have many beautiful flowers,” he said; “but the children are the most beautiful flowers of all.”

      One winter morning he looked out of his window as he was dressing. He did not hate the Winter now, for he knew that it was merely the Spring asleep, and that the flowers were resting.

      Suddenly he rubbed his eyes in wonder, and looked and looked. It certainly was a marvellous sight. In the farthest corner of the garden was a tree quite covered with lovely white blossoms. Its branches were all golden, and silver fruit hung down from them, and underneath it stood the little boy he had loved.

      Downstairs ran the Giant in great joy, and out into the garden. He hastened across the grass, and came near to the child. And when he came quite close his face grew red with anger, and he said, “Who hath dared to wound thee?” For on the palms of the child’s hands were the prints of two nails, and the prints of two nails were on the little feet.

      “Who hath dared to wound thee?” cried the Giant; “tell me, that I may take my big sword and slay him.”

      “Nay!” answered the child; “but these are the wounds of Love.”

      “Who art thou?” said the Giant, and a strange awe fell on him, and he knelt before the little child.

      And the child smiled on the Giant, and said to him, “You let me play once in your garden, today you shall come with me to my garden, which is Paradise.”

      And when the children ran in that afternoon, they found the Giant lying dead under the tree, all covered with white blossoms.
    checkIn:
      id: hp-ch-03-s4-c1
      stem: What did the Giant see in the farthest corner on that winter morning?
      options:
        - The little boy he had loved, standing under white blossoms
        - The children of the town skating on the frozen grass
        - The North Wind and the Hail dancing round the trunk
        - A noticeboard that someone had set up again in the night
      correctIndex: 0
      explanationZh: 那棵树 "quite covered with lovely white blossoms"，枝条是金的，垂着银色的果子，"underneath it stood the little boy he had loved"。那时正是冬天，园中别处都还睡着。
quiz:
  - id: hp-ch-03-q1
    stem: What did the Giant put up once the high wall was finished?
    options:
      - A row of twelve young peach-trees
      - A noticeboard warning off trespassers
      - A gate that only he himself could unlock
      - A bell to call the children in from the road
    correctIndex: 1
    explanationZh: 墙筑好之后他还立了一块告示牌，写着 Trespassers Will Be Prosecuted。十二棵桃树本来就长在园子里，是春天开花、秋天结果的那几棵。
  - id: hp-ch-03-q2
    stem: Why did the Autumn give the Giant's garden no golden fruit?
    options:
      - The frost had killed the twelve peach-trees
      - The children had carried all the fruit away
      - The Giant had picked it before it was ripe
      - Autumn said that the Giant was too selfish
    correctIndex: 3
    explanationZh: 秋天给每一座花园都送去金色的果子，唯独不给这一座——"He is too selfish," she said。桃树并没有冻死，只是年年不肯开花。
  - id: hp-ch-03-q3
    stem: How did the children get back into the walled garden?
    options:
      - The Giant himself opened the door for them
      - They climbed over the wall on a long garden ladder
      - They crept in through a little hole in the wall
      - The North Wind blew a gap in the high wall
    correctIndex: 2
    explanationZh: 巨人从窗口望出去，看见 "Through a little hole in the wall the children had crept in"，一个个坐在树枝上。那时他还没有下过楼，更没有替谁开门。
  - id: hp-ch-03-q4
    stem: What did the Giant do soon after he had lifted the boy into the tree?
    options:
      - He took a great axe and knocked down the wall
      - He called the children back from the road outside
      - He sat down in his armchair to watch them play
      - He drove the North Wind out of the farthest corner
    correctIndex: 0
    explanationZh: 孩子们看出他不再凶恶就跑了回来，春天也跟着回来，他说 "It is your garden now, little children"，随即抡起大斧头推倒了那堵墙。坐进扶手椅是很多年以后的事了。
  - id: hp-ch-03-q5
    stem: Why did the Giant love that one little friend the best?
    options:
      - Because the boy had been the smallest child of them all
      - Because the boy had kissed him and hugged his neck
      - Because the boy stayed behind when the others left
      - Because the boy had never been afraid of his voice
    correctIndex: 1
    explanationZh: 文中直说 "The Giant loved him the best because he had kissed him"——那天孩子伸出双臂搂住他的脖子。别的孩子第二天都回来了，唯独这一个再也没有出现。
  - id: hp-ch-03-q6
    stem: What did the child say about the nail-prints on his hands and feet?
    options:
      - The North Wind had wounded him
      - The Giant's axe had struck him
      - They were the wounds of Love
      - He had cut them on the tree
    correctIndex: 2
    explanationZh: 巨人怒问是谁敢伤他，要提剑去杀那个人，孩子却答 "Nay! but these are the wounds of Love"，随后邀他同去自己的花园。那把斧头从未碰过这个孩子。

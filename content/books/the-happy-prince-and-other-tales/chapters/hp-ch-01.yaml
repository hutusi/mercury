      - That her lover cared more for the stars than for her
      - That her dress would not be ready for the State-ball
      - That the ball would be held without any music at all
      - That the Queen's maids-of-honour would outshine her
    correctIndex: 1
    explanationZh: 她在阳台上说 "I hope my dress will be ready in time for the State-ball… but the seamstresses are so lazy"。恋人正对她赞叹星星与爱情的力量，她惦记的却只有那条绣西番莲的裙子——而绣裙的正是燕子刚去过的那位女工。
  - id: hp-ch-01-q4
    stem: What did the young man in the garret think when he found the sapphire?
    options:
      - That the Director of the Theatre had paid him early
      - That a bird had dropped a jewel through the roof hole
      - That some great admirer had sent it, and he could work
      - That his withered violets had turned into a blue stone
    correctIndex: 2
    explanationZh: 他把头埋在手里，没听见翅膀的声音，抬头看见宝石便喊 "I am beginning to be appreciated… this is from some great admirer"。屋顶确实破了个洞，但他从头到尾不知道来客是一只燕子。
  - id: hp-ch-01-q5
    stem: What did the little match-girl do when the jewel dropped into her hand?
    options:
      - She said the Prince had answered her prayers
      - She called it a lovely bit of glass, and ran home
      - She cried out that her father would take it away
      - She asked the Swallow where it had come from
    correctIndex: 1
    explanationZh: 她把这颗印度运来的蓝宝石当成了玻璃——"What a lovely bit of glass," cried the little girl; and she ran home, laughing——她既不知道燕子来过，也没有向谁发问。
  - id: hp-ch-01-q6
    stem: Which two things did the Angel carry to God as the most precious in the city?
    options:
      - The broken leaden heart and the dead Swallow
      - The gilded statue and the Mayor's proclamation
      - The two sapphires and the ruby from the sword
      - The play that the young writer had at last finished
    correctIndex: 0
    explanationZh: 上帝要 "the two most precious things in the city"，天使带回的是那颗裂成两半的铅心和死去的小鸟。宝石与金箔早已散给了穷人，雕像本身则被熔进了炉子。

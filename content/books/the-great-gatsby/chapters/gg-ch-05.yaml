    explanationZh: 盖茨比告诉尼克"It took me just three years to earn the money that bought it"。但当尼克以为他继承了遗产时，他又习惯性地附和说自己确实继承了但大部分在战时金融恐慌中损失了。这种自相矛盾暗示他的财富来源并不清白。
  - id: gg-ch-05-q3
    stem: What realization does Gatsby have about the green light at the end of Daisy's dock?
    options:
      - It has grown brighter since Daisy first came to his house.

  - id: gg-ch-05-q2
    stem: What does Gatsby claim about the source of the money that bought his house?
    options:
      - He inherited it entirely from his family in the Midwest.
      - He won it in a single large business transaction.
      - He borrowed it from Dan Cody and never repaid the loan.
      - He earned it himself over three years.

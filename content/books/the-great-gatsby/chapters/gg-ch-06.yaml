  - id: gg-ch-06-q4
    stem: How does Mr. Sloane and the woman actually regard Gatsby's attempt to join them for supper?
    options:
      - They do not really want him, despite the spoken invitation.
      - They warmly insist that he follow them on horseback.
      - They invite him only if he can bring Nick along too.
      - They agree to come back and fetch him in an hour.

  - id: gg-ch-06-q6
    stem: How does Gatsby answer when told the past cannot be repeated?
    options:
      - He allows it, and says he will build something new instead
      - He owns the past is gone, but swears to get even for it
      - He says he will leave it to Daisy to decide for them both
      - He cries that of course you can, and will fix it as before
    correctIndex: 3
    explanationZh: 尼克劝他别对黛西要求太多——"You can't repeat the past."；他难以置信地反问 "Can't repeat the past? Why of course you can!"，又四下张望，像是过去就藏在自家屋影里、伸手可及——"I'm going to fix everything just the way it was before. She'll see."。

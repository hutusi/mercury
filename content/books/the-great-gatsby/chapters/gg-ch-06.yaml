quiz:
  - id: gg-ch-06-q1
    stem: When did James Gatz become Jay Gatsby?
    options:
      - At twenty-one, on the day he first reached New York
      - At seventeen, when Cody's yacht dropped anchor off the flat
      - At twenty-five, when the money came down from Ella Kaye

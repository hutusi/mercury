      explanationZh: 原文说他知道亲吻黛西后 "his mind would never romp again like the mind of God"——他将不可言说的幻想与她易逝的气息永远结合在了一起。其他选项与原文的情感逻辑无关。
quiz:
  - id: gg-ch-06-q1
    stem: At what age and on what occasion did James Gatz change his name to Jay Gatsby?
    options:
      - At twenty-one, when he first arrived in New York City.
      - At seventeen, when Dan Cody's yacht anchored near him on Lake Superior.
      - At twenty-five, when he inherited money from Ella Kaye.
      - At thirty, when he bought his house in West Egg.
    correctIndex: 1
    explanationZh: 原文说他十七岁时改名，那一刻正是他看见 Dan Cody 的游艇在苏必利尔湖上下锚——"the specific moment that witnessed the beginning of his career"。其他选项的时间节点都与原文不符。
  - id: gg-ch-06-q2
    stem: What practical arrangement did Cody make because of his drinking problem?
    options:
      - He paid Gatsby extra to keep all liquor off the boat.
      - He made Gatsby sign a contract to never let him drink.
      - He sent Gatsby ahead to each port to screen his hosts.
      - He gave Gatsby increasing trust to manage things when Cody was drunk.
    correctIndex: 3
    explanationZh: 科迪清醒时知道醉酒后可能挥霍胡闹，于是 "reposing more and more trust in Gatsby" 来防范此类意外。盖茨比也因此养成了几乎不沾酒的习惯。其他选项虚构了禁酒契约或提前筛查的做法。
  - id: gg-ch-06-q3
    stem: Why was Gatsby especially affected by Tom's unexpected visit on Sunday afternoon?
    options:

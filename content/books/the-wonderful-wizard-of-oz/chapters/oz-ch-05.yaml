quiz:
  - id: oz-ch-05-q1
    stem: How did the Wicked Witch of the East harm the Tin Woodman?
    options:
      - She enchanted his axe so it slipped and cut off his body parts
      - She put a curse on his house
      - She sent a rainstorm to rust his joints
      - She turned him into tin directly
    correctIndex: 0
    explanationZh: 东方恶女巫 "enchanted my axe"，让斧子一次次滑落，砍掉他的腿、手臂、甚至头和身体。生锈是后来他自己忘记上油才发生的。
  - id: oz-ch-05-q2
    stem: Who asked the Wicked Witch to stop the Tin Woodman's marriage?
    options:
      - The beautiful Munchkin girl herself
      - The tinsmith who made the tin body
      - The Tin Woodman's mother
      - An old woman who was too lazy to do her own work
    correctIndex: 3
    explanationZh: 那个和女孩住在一起的老妇人太懒了，不想让女孩嫁人离开她，所以去找东方恶女巫帮忙阻止这门婚事。
  - id: oz-ch-05-q3
    stem: What happened the last time the Wicked Witch used the enchanted axe?
    options:
      - It cut off his head
      - It cut off both legs at once
      - It cut off his hands
      - It cut right through his body, splitting him in two
    correctIndex: 3
    explanationZh: 女巫最后一次让斧子滑落时，"it cut right through my body, splitting me into two halves"。之后铁匠给他做了完整的锡身体，但他也从此失去了心。
  - id: oz-ch-05-q4
    stem: Why was the Tin Woodman stuck in the forest for over a year?
    options:
      - A tree fell on him and he could not move
      - The Wicked Witch trapped him there on purpose
      - He lost his axe and could not find his way home
      - He was caught in a rainstorm and forgot to oil himself, so his joints rusted
    correctIndex: 3
    explanationZh: 他平时会给自己上油防锈，但有一天他忘了，又被暴雨淋到，关节就锈住了，在森林里站了一年多，直到多萝西来帮忙。
  - id: oz-ch-05-q5
    stem: What useful thing does the Tin Woodman do for the party soon after joining?
    options:
      - He carries Dorothy across a river
      - He finds food for Toto
      - He chops through thick branches blocking the road
      - He scares away wild animals with his axe
    correctIndex: 2
    explanationZh: 他们上路不久就遇到树枝挡路，铁皮人用斧子 "chopped so well that soon he cleared a passage for the entire party"。这正是他作为铁皮樵夫的特长。
  - id: oz-ch-05-q6
    stem: What do the Scarecrow and the Tin Woodman disagree about at the end?
    options:
      - Whether Oz can really help them
      - Which road to take to the Emerald City
      - Whether brains or a heart is more important
      - Whether Dorothy should go back to Kansas
    correctIndex: 2
    explanationZh: 稻草人认为脑子更重要，因为傻瓜有了心也不知道怎么用；铁皮人认为心更重要，因为 "happiness is the best thing in the world"。多萝西拿不定主意谁对。

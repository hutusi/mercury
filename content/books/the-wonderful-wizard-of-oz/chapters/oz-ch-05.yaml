  - id: oz-ch-05-q4
    stem: What did the enchanted axe do last of all?
    options:
      - It cut off the head he had grown so proud of
      - It cut both of his tin arms off at the shoulder
      - It went right through him, splitting him in two
      - It broke on the tin body and was thrown away

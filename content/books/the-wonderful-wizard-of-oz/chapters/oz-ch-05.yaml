    explanationZh: 先是两条腿，再是两条胳膊，然后是头；最后一次 "it cut right through my body, splitting me into two halves"。铁匠这才用关节把他重新拼成一个铁皮人。
  - id: oz-ch-05-q5
    stem: Why did the Tin Woodman stand still in the forest for a whole year?
    options:
      - The Wicked Witch had fixed him to the spot
      - A falling tree had pinned his legs to the ground
      - He was waiting for the Munchkin girl to find him
      - He forgot to oil himself and was caught in the rain
    correctIndex: 3
    explanationZh: 他平时勤于上油，"However, there came a day when I forgot to do this, and, being caught in a rainstorm… my joints had rusted"，从此在林子里站了一年多。
  - id: oz-ch-05-q6
    stem: What did the Scarecrow say when the Woodman chose a heart over brains?
    options:
      - That a fool would not know what to do with a heart
      - That happiness is the best thing in all the world
      - That Oz would surely refuse to give away a heart
      - That he would ask for a heart and brains together
    correctIndex: 0
    explanationZh: 稻草人坚持要脑子——"a fool would not know what to do with a heart if he had one"；铁皮人则说 "brains do not make one happy, and happiness is the best thing in the world"。多萝西觉得两边都有道理。

    explanationZh: 她要洗掉一路的尘土，还要喝水，"so the dry bread will not stick in my throat"。稻草人听了才感叹，做血肉之躯真是麻烦。
  - id: oz-ch-05-q2
    stem: What did the Tin Woodman ask Dorothy to carry in her basket?

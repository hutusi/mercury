id: oz-ch-24
bookId: book-oz
title: Home Again
titleZh: 回家
summaryZh: 多萝西终于回到了堪萨斯的家乡。婶婶正在浇卷心菜时，抬头看见多萝西朝她跑来，两人紧紧相拥。
sections:
  - id: oz-ch-24-s1
    text: |-
      Aunt Em had just come out of the house to water the cabbages when she looked up and saw Dorothy running toward her.

      “My darling child!” she cried, folding the little girl in her arms and covering her face with kisses. “Where in the world did you come from?”

      “From the Land of Oz,” said Dorothy gravely. “And here is Toto, too. And oh, Aunt Em! I’m so glad to be at home again!”
    checkIn:
      id: oz-ch-24-s1-c1
      stem: What was Aunt Em doing when she saw Dorothy?
      options:
        - Watering the cabbages
        - Sweeping the house
        - Feeding the chickens
        - Reading a letter
      correctIndex: 0
      explanationZh: 原文说 Aunt Em “had just come out of the house to water the cabbages”，所以她在浇卷心菜。“喂鸡”“扫地”在本章都没有出现。
quiz:
  - id: oz-ch-24-q1
    stem: Where did Dorothy say she came from?
    options:
      - From a big city
      - From a farm next door
      - From a school trip
      - From the Land of Oz
    correctIndex: 3
    explanationZh: 多萝西明确回答 “From the Land of Oz”。其他选项只是常见干扰，原文并没有提到城市或学校。
  - id: oz-ch-24-q2
    stem: Who came back home together with Dorothy?
    options:
      - Toto
      - The Scarecrow
      - The Cowardly Lion
      - The Tin Woodman
    correctIndex: 0
    explanationZh: 多萝西说 “And here is Toto, too”，所以和她一起回来的是小狗 Toto。稻草人、铁皮人和胆小狮都没有跟她回到堪萨斯。
  - id: oz-ch-24-q3
    stem: How did Aunt Em feel when she saw Dorothy?
    options:
      - Angry and worried
      - Bored and tired
      - Happy and loving
      - Afraid and nervous
    correctIndex: 2
    explanationZh: 婶婶喊 “My darling child!” 并亲吻多萝西的脸，表现出非常开心和充满爱意。“生气”“无聊”与原文的温馨场面相反。

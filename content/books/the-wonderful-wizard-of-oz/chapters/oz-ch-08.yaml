  - id: oz-ch-08-q2
    stem: Why did the Tin Woodman dry his tears on Dorothy's apron?
    options:
      - The wind on the river had blown grit into his eyes
      - He did not want Dorothy to see that he was crying
      - He had remembered that tears would rust him
      - His hinges had begun to squeak as he wept
    correctIndex: 2
    explanationZh: 稻草人被落在河里，他难过得哭起来，"but fortunately remembered that he might rust, and so dried his tears on Dorothy's apron"。
  - id: oz-ch-08-q3
    stem: What did the Scarecrow promise to do for the Stork?
    options:
      - To do her a kindness if he ever got his brains
      - To carry her babies safely out of the nest
      - To ask Oz to give her a wish of her own
      - To send her word when they reached the city

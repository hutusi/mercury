    stem: What did the Scarecrow think while he clung to the pole in the river?
    options:
      - That the Stork would surely come and fetch him
      - That he was worse off than in the cornfield
      - That the raft would drift back for him by evening
      - That his straw would soon be soaked right through
    correctIndex: 1

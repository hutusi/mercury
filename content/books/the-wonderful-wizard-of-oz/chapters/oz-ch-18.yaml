quiz:
  - id: oz-ch-18-q1
    stem: What did the people of the city say they were proud of?
    options:
      - That their ruler had once been a great Wizard
      - That their ruler had killed the Wicked Witch
      - That their ruler could think without a head
      - That no other city is ruled by a stuffed man
    correctIndex: 3
    explanationZh: 稻草人不是巫师，人们却很得意——"there is not another city in all the world that is ruled by a stuffed man"。就他们所知，这话一点不错。
  - id: oz-ch-18-q2
    stem: What happened when the Scarecrow thought very hard?
    options:
      - His painted eyes shut tight until he was done
      - He had to sit in the throne to keep his balance
      - The pins and needles stuck out of his brains
      - His hat slipped off and rolled across the floor
    correctIndex: 2
    explanationZh: 头一回 "he thought so hard that the pins and needles began to stick out of his brains"；第二回想得更凶，脑袋鼓得多萝西怕它会炸开。
  - id: oz-ch-18-q3
    stem: Who was Glinda, according to the soldier?
    options:
      - The Good Witch who once ruled the Winkies
      - The Witch of the South, most powerful of all
      - The sister of the Witch Dorothy had melted
      - The woman who had taught Oz all his tricks
    correctIndex: 1
    explanationZh: 士兵说 "The Witch of the South. She is the most powerful of all the Witches, and rules over the Quadlings"，还说她的城堡就在沙漠边上，也许知道横越沙漠的办法。

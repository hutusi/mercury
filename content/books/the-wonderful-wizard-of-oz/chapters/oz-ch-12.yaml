  - id: oz-ch-12-q6
    stem: Why is Dorothy able to melt the Witch so easily?
    options:
      - She knew water would destroy the Witch
      - She used a magic spell from the Silver Shoes
      - The Lion told her the Witch's secret weakness
      - In her anger over the shoe, she threw water
    correctIndex: 3
    explanationZh: 女巫抢走了多萝西的一只银鞋，还嘲笑她，多萝西非常生气，就抓起旁边的一桶水泼了过去。她当时并不知道水会要了女巫的命——女巫问她"Didn't you know water would be the end of me?"，多萝西说"Of course not."。银鞋的魔力要到很久以后才有人告诉她，狮子也从没提过女巫怕水。

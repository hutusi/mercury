      correctIndex: 2
      explanationZh: 女巫用隐形的铁条绊倒多萝西，抢走了一只银鞋。多萝西气愤地拿起一桶水泼在女巫身上，女巫立刻开始融化，最终变成地上一摊棕色的东西。

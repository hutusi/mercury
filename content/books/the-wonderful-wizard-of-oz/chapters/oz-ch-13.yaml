quiz:
  - id: oz-ch-13-q1
    stem: Why were the Winkies so happy and willing to help Dorothy?
    options:
      - She gave them a lot of gold
      - She had freed them from slavery
      - She promised to rule over them
      - She brought food from the Emerald City
    correctIndex: 1
    explanationZh: 温基人多年来被迫做苦工，多萝西告诉他们不再是奴隶了，所以他们心怀感激，愿为解放他们的多萝西竭尽全力（"do all in their power for Dorothy, who had set them free from bondage"）。
  - id: oz-ch-13-q2
    stem: What did Dorothy have to do when the Tin Woodman wept tears of joy?
    options:
      - Give him a new axe
      - Oil his joints immediately
      - Wipe each tear carefully from his face
      - Tell him to stop crying
    correctIndex: 2
    explanationZh: 铁皮人流下喜悦的泪水后，多萝西必须用围裙仔细擦去他脸上的每一滴眼泪，否则他的关节会生锈（"so his joints would not be rusted"）。
  - id: oz-ch-13-q3
    stem: What was special about the Tin Woodman's new axe handle?
    options:
      - It was made of solid gold
      - It was made of silver
      - It was covered in jewels
      - It was made of straw
    correctIndex: 0
    explanationZh: 一位温基金匠打造了一根纯金斧柄（"an axe-handle of solid gold"），装在铁皮人的斧头上，替代旧断裂的斧柄；斧刃也被抛光得像擦亮的银子一样闪闪发光。
  - id: oz-ch-13-q4
    stem: What did the Winkies ask the Tin Woodman to do before he left?
    options:
      - To fix their tools
      - To stay and rule over them
      - To teach them tinsmithing
      - To find them a new ruler
    correctIndex: 1
    explanationZh: 温基人非常喜欢铁皮人，恳求他留下来统治他们和西方的黄色土地（"begged him to stay and rule over them and the Yellow Land of the West"），但他决心要跟伙伴们一起离开。
  - id: oz-ch-13-q5
    stem: What did Dorothy find in the Witch's cupboard and decide to wear?
    options:
      - A pair of silver shoes
      - A magic wand
      - The Golden Cap
      - A diamond bracelet
    correctIndex: 2
    explanationZh: 多萝西在女巫的橱柜里装食物时发现了金冠（"the Golden Cap"），试戴后发现大小正好。她当时不知道金冠的法力，只觉得好看，便决定戴上它，把遮阳帽放进篮子里。
  - id: oz-ch-13-q6
    stem: What does each traveler want to get from Oz when they return to the Emerald City?
    options:
      - Gold, food, tools, and shelter
      - A heart, brains, courage, and a trip home
      - A new axe, new straw, a tail, and a basket
      - Magic shoes, a crown, a collar, and a stick
    correctIndex: 1
    explanationZh: 铁皮人想要心（"my heart"），稻草人想要脑子（"my brains"），狮子想要勇气（"my courage"），多萝西想回堪萨斯（"back to Kansas"），各自对应奥兹曾许下的承诺。

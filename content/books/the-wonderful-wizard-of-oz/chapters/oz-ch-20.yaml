      id: oz-ch-20-s1-c1
      stem: What did each of them say on first looking over the wall?
      options:
        - Nothing at all, for they were too surprised
        - They said Oh, my! one after another, and Toto barked
        - That the ladder would never bear their weight
        - That the country below was made of gold
      correctIndex: 1

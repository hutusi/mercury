  - id: oz-ch-20-s4
    text: |-
      “I would not make you unhappy for all the world!” exclaimed Dorothy. “So I’ll just say good-bye.”

      “Good-bye,” replied the Princess.

      They walked carefully through the china country. The little animals and all the people scampered out of their way, fearing the strangers would break them, and after an hour or so the travelers reached the other side of the country and came to another china wall.

      It was not so high as the first, however, and by standing upon the Lion’s back they all managed to scramble to the top. Then the Lion gathered his legs under him and jumped on the wall; but just as he jumped, he upset a china church with his tail and smashed it all to pieces.

      “That was too bad,” said Dorothy, “but really I think we were lucky in not doing these little people more harm than breaking a cow’s leg and a church. They are all so brittle!”

      “They are, indeed,” said the Scarecrow, “and I am thankful I am made of straw and cannot be easily damaged. There are worse things in the world than being a Scarecrow.”
    checkIn:
      id: oz-ch-20-s4-c1
      stem: What was the Scarecrow thankful for as they left the china country?
      options:
        - That the Princess had not come away with them
        - That the second wall was lower than the first
        - That the Lion had jumped over it so easily
        - That being made of straw, he is not easily damaged
      correctIndex: 3
      explanationZh: 他说 "I am thankful I am made of straw and cannot be easily damaged. There are worse things in the world than being a Scarecrow"——瓷器国的人可是碰一下就碎。
quiz:
  - id: oz-ch-20-q1
    stem: What did the Tin Woodman say while the Scarecrow puzzled over the wall?
    options:
      - That the Winkies had built it many years ago
      - That it was surely made of white china
      - That they had better walk round it instead
      - To rest his brains until they got over it
    correctIndex: 3
    explanationZh: 稻草人说猜不透这墙是谁砌的、用什么砌的，铁皮人答 "Rest your brains and do not worry about the wall. When we have climbed over it, we shall know what is on the other side"。
  - id: oz-ch-20-q2
    stem: What were the houses of the china country like?
    options:
      - Tall and narrow, with roofs of beaten gold
      - Small and brightly painted, the biggest waist-high
      - Round, with domes, exactly like Munchkin houses
      - Built of white china, all of them just the same
    correctIndex: 1
    explanationZh: 地面白得像大浅盘的底，房子 "made entirely of china and painted in the brightest colors"，最大的也只到多萝西的腰；瓷人更小，最高的不过她的膝盖。
  - id: oz-ch-20-q3
    stem: What did the milkmaid say she would do about her cow?
    options:
      - Sell her to the mender and buy another
      - Keep her in the barn until the leg grew back
      - Take her to the mender's shop to be glued
      - Ask the Tin Woodman to solder the leg on
    correctIndex: 2
    explanationZh: 她气冲冲地说 "My cow has broken her leg, and I must take her to the mender's shop and have it glued on again"，还怪他们吓着了牛；她自己的手肘也磕出一个缺口。
  - id: oz-ch-20-q4
    stem: What had happened to Mr. Joker the clown?
    options:
      - He had broken so often he was mended all over
      - He had lost his cap while standing on his head
      - He had been carried away to somebody's mantel
      - He had been made with no joints at all
    correctIndex: 0
    explanationZh: 公主说他老想拿头倒立，"He has broken himself so often that he is mended in a hundred places, and doesn't look at all pretty"，浑身裂纹。她还说他脑袋裂得厉害，所以说话不着调。
  - id: oz-ch-20-q5
    stem: Why would leaving her own country make the Princess unhappy?
    options:
      - Her painted colours would fade in the sunlight
      - She would have to leave Mr. Joker behind
      - The journey over the wall would surely break her
      - Away from here her joints stiffen for good
    correctIndex: 3
    explanationZh: 她说在本国瓷人可以随意走动说话，"but whenever any of us are taken away our joints at once stiffen, and we can only stand straight and look pretty"。
  - id: oz-ch-20-q6
    stem: What did the Lion break as he jumped onto the second wall?
    options:
      - The little purple dog that had barked at them
      - The barn where the china cows were kept
      - A china church, smashed to pieces by his tail
      - The ladder the Woodman had left behind
    correctIndex: 2
    explanationZh: 他一跃上墙，"he upset a china church with his tail and smashed it all to pieces"。多萝西说，全程只弄坏一条牛腿和一座教堂，已经算走运了。

    correctIndex: 1
    explanationZh: 听说堪萨斯是个文明国家后，女巫说"那就说得通了"——文明国家已经没有女巫、巫师和魔法师，而奥兹国与世隔绝，从未被文明化，所以仍然有女巫和巫师。

    stem: What happened to the body of the Wicked Witch of the East?
    options:
      - The Munchkins buried her under the house
      - The house crushed her into dust at once
      - She dried up, leaving only her shoes
      - She melted away in the rain
    correctIndex: 2
    explanationZh: 芒奇金人惊呼时，恶女巫的双脚已完全消失。北方女巫笑着解释："她太老了，在太阳下很快就干掉了。"最后只剩下那双银鞋，女巫把鞋交给了多萝西。
